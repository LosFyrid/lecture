id: agent-dev-201-t02-context-engineering
title: "上下文工程：长任务的注意力预算管理"
description: |
  做长任务 agent 时，常见的“看起来像模型变笨了”的问题，本质上往往是：模型在**错误的上下文**上做了很认真、很昂贵的推理。
  一味把更多历史对话、更多检索片段塞进输入，只会带来三个副作用：成本上升、注意力被稀释、以及行为逐步漂移（drift）。

  本 track 用一个工程视角重新定义 *context*：它不是“尽量多给信息”，而是一次调用里模型能看到的**有限注意力预算**。
  你将学习如何像管理缓存/索引一样管理上下文：选择什么进入窗口、用什么结构组织、什么时候压缩或卸载、哪些信息要隔离，如何诊断“长上下文退化”的失败模式。

  读完后，你应该能把“上下文”从一个黑盒参数，改造成一条可设计、可调参、可回归测试的管线。

  学习建议：如果你已经掌握了 agent loop/harness 的基本结构（模型如何在多轮里获取观测、如何执行工具、如何回填结果），再来学习这条 track 会更顺畅；因为 context engineering 讨论的很多“失败”，本质上发生在 loop 的每一轮输入管线里。
