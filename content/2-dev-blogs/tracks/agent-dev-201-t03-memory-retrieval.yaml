id: agent-dev-201-t03-memory-retrieval
title: "记忆与检索：长期记忆、召回与检索选型"
description: |
  对 agent 来说，“记忆”不只是把东西塞进向量库；它更像一套可演化的数据产品：
  你需要决定**写入什么**（什么值得长期保存）、**如何召回**（什么时候检索、检索多少、如何与当前上下文融合），以及**如何更新**（纠错、去重、版本化）。

  本 track 围绕两个常见工程困惑展开：
  1) 向量检索几乎成了默认选项，但在代码/文档类任务里，filesystem + grep 这类“可解释的探索工具”什么时候反而更可靠？  
  2) 当任务变成“读很多材料再写文档”时，模型可能陷入过度推理与无效展开：怎样通过记忆/检索与写作策略，减少这种失败模式？

  学习建议：把这条 track 视为“上下文工程的外延”。当你开始做长任务，你会发现很多信息既不适合常驻在 context window，也不适合完全丢弃；记忆与检索就是在“成本、可解释性与召回质量”之间做工程化折中。
