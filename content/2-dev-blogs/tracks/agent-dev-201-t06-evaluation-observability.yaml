id: agent-dev-201-t06-evaluation-observability
title: "评估与可观测：把 Evals / Tracing / Safety 写进迭代闭环"
description: |
  agent 的行为具有非确定性：同一个任务、同一套代码，在不同输入、不同上下文、不同时间都可能走出不一样的轨迹。
  这意味着“看起来能用”远远不够——你需要一套能持续发现退化、定位原因、并把改进变成可回归的工程闭环。

  本 track 讨论三件彼此耦合的事：
  - **评估（evals）**：从 Day 0 就把评估写进代码与 CI，让迭代有抓手。  
  - **可观测（observability）**：用 tracing / 日志 / 指标把“它做了什么”变成可查询的事实，而不是靠复述与猜测。  
  - **安全（safety）**：把 guardrails 当作系统设计问题（输入、工具、策略、监控与处置），而不是单点提示词技巧。

  同时，你也会看到：benchmark 会“失效”，指标会被优化，自治度很难量化——这些并不是放弃评估的理由，而是需要治理与设计的对象。

  学习建议：如果你已经有一个能跑通真实任务的 agent（哪怕很简陋），这条 track 会更“立刻可用”。评估与可观测的许多细节，需要你能拿到真实轨迹与失败样本才能体会；反过来，一旦你开始迭代上线系统，它们往往会成为决定你能否持续改进的关键基础设施。
