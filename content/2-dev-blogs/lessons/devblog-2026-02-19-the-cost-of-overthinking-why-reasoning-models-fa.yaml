    title: "原文：The Cost of Overthinking: Why Reasoning Models Fail at Document Parsing"
    url: https://www.llamaindex.ai/blog/the-cost-of-overthinking-why-reasoning-models-fail-at-document-parsing
    mode: open

  - type: md
    title: 时效性提示（可能过时）
    body: |
      文中使用的模型与“thinking 档位”的控制方式可能随 API 与产品更新而变化；但它揭示的结构性矛盾（parsing 追求高保真、reasoning 倾向补全与重构）通常不会因为换一个更强模型就自动消失。迁移时更建议保留“对照实验 + 失败模式归因”的方法，而不是复用某个固定的阈值。

  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) 在 parsing 里，“理解得更像人”可能带来错误，是因为它会诱发补全与重构（填空、拆表），而 parsing 的评分口径往往惩罚这种结构偏离。  
      2) reasoning tokens 的主要收益是更强的语义解释能力（例如描述 logo），主要副作用是更高成本/延迟，以及更强的“按理想结构推断”的倾向。  
      3) 当更多 thinking 不提升质量时，更划算的做法是 pipeline：先确定性 OCR/布局，再让 LLM 在已读出的文本上做结构化与校验，把 reasoning 放到局部的“结构决策与验证”环节。  
      4) 评测与分析要围绕失败模式设计：表格结构（是否拆分/跨行列）与内容准确（字符/公式）最好分开看；否则你会把“结构变形”和“字符读错”混在一个总分里，难以定位到底该改 OCR、改布局还是改 LLM。

