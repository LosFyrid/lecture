id: devblog-2026-02-26-you-dont-know-what-your-agent-will-do-until-its
title: "你直到上线才知道 agent 会做什么：为什么 AgentOps 必须从生产数据开始"
summary: |
  Agent 的输入空间近乎无限、对措辞/上下文顺序敏感且具有随机性，又由多步工具调用轨迹构成，因此“上线前可预期性”远弱于传统软件。要把它做成可靠系统，你需要面向对话与轨迹的可观测性：采集多轮上下文与中间步骤、用抽样与标注队列扩展人类判断、用在线评估持续监控质量与安全，并把生产失败样本无缝回流到数据集与实验迭代里。
items:
  - type: md
    title: 导入：本课要回答的问题
    body: |
      传统软件上线前，你大致知道会发生什么：输入空间有限（按钮、表单、固定 API），测试能覆盖大部分路径，监控也有成熟套路（错误率、延迟、DB 查询、CPU）。

      但很多团队第一次把 agent 推到生产后会发现：  
      **你直到上线才知道它会怎么被用、会在哪里崩、以及崩起来是什么形态。**

      本课想回答：

      1) 为什么 agent 的“可预期性”天生弱于传统软件？  
      2) 生产监控对 agent 来说应该监控什么（不仅是延迟/错误率）？  
      3) 当你每天有上千条对话时，人类评审为什么不可扩展？你可以用哪些机制把“人类判断”引入生产数据？  
      4) 为什么通用 APM（Datadog/New Relic 一类）不够用？一个 agent observability 平台需要补哪几类能力？

  - type: md
    title: 概念对齐：APM 监控的是系统，AgentOps 还要监控轨迹
    body: |
      **agent loop / trajectory（轨迹）**  
      一个工具型 agent 往往不是“一次回答”，而是一段循环：观察 → 决策 → 工具调用 → 得到 observation → 再决策。  
      这段中间步骤（tool calls、检索结果、状态更新）决定了最后输出为什么会变成那样。

      **trace（可回放的执行记录）**  
      能回答“发生了什么、为什么这样、如何复现”的最小材料。对 agent 来说，trace 通常需要包含：多轮消息、工具请求/返回、关键状态、错误与重试。

      **APM（传统应用性能监控）**  
      更擅长监控结构化系统指标：吞吐、延迟、错误率、资源使用。它对“自然语言内容是否正确/是否安全”天然不敏感。

      **annotation queue（标注队列）**  
      把需要人类判断的 traces 放进一个可操作的队列：给定 rubric，让评审者快速标注“好/坏/原因”。它的目标不是“全量人工”，而是“把有限人力用在最有价值的样本上”。

      **online evaluation（在线评估）**  
      用 LLM 或规则在生产 traces 上自动评分/检查（质量、groundedness、工具使用、隐私/政策违规等），常配合抽样以控成本。

  - type: md
    title: 为什么 agent 与传统软件不同：无限输入空间 + 对小改动敏感
    body: |
      原文提出两个关键差异，它们直接决定了你“上线前很难穷举测试”的原因。

      **1) 输入空间近乎无限**  
      传统软件的输入往往被 UI/接口约束住；而 agent 的输入是自然语言，同一个意图可以有无数表达方式（简短、含糊、混合多个意图、跨多轮逐步补充）。

      **2) LLM 对小变化极其敏感，且具有非确定性**  
      同一个需求，换一种措辞、换一种上下文顺序，就可能触发不同的工具选择与不同的后续轨迹；采样机制也会带来同输入不同输出的波动。  
      这意味着“开发期看起来稳定”的策略，在生产长尾里可能突然失效。

  - type: md
    title: 生产监控应该看什么：对话 + 多轮上下文 + 中间步骤
    body: |
      原文强调：agent 的可观测性需要“看内容”，而不只是“看系统状态”。

      你至少需要采集与组织：

      - **完整 prompt-response 对**：用户问了什么、系统提示是什么、最终回答是什么。  
      - **multi-turn 上下文**：同一线程里前文约束与澄清如何积累。  
      - **轨迹与中间步骤**：检索了什么、调用了哪些工具、参数是否正确、工具返回如何影响下一步。

      在传统系统里，一条日志可能是 “POST /checkout 200 342ms”。  
      在 agent 系统里，“200 OK”几乎不告诉你质量：你需要能回放“它为什么这么答、为什么这么做”。

  - type: md
    title: 人类判断如何在规模化流量里存在：标注队列 + LLM 代理评审
    body: |
      原文给了一个很实用的量级直觉：一个评审者每小时大约只能有效看 **50–100** 条 traces；如果你每天有 1,000 个请求，全人工评审会变成每天 **10–20 小时**的人力投入。

      所以你需要两类互补机制：

      **A) 结构化人工评审（Annotation queues for structured human review）**  
      让评审者不必“在日志海里找样本”，而是把样本按优先级送到队列里，并遵循同一套预设的审查准则或评分标准。一个有效的队列系统通常支持：

      - 把特定 traces 路由给特定评审者（领域专家/安全审查/工程调试）  
      - 让评审在结构化界面里快速打分与写原因  
      - 把标注结果回流成训练数据/评估数据集

      原文也提醒：标注队列会消耗人力并引入反馈延迟，所以更适合聚焦“高价值 traces”，而不是试图全量覆盖。

      **B) LLM 代理评审（LLMs as a proxy for human judgment）**  
      用在线 evaluator 在生产上自动评分，解决“规模”问题。原文提到的典型做法是：

      - 对全量流量或抽样子集运行评估（常见抽样比例 **10–20%**）  
      - 用评估信号做告警：比如质量下降、工具调用错误增多、敏感信息泄露、政策违规等

      同时要正视LLLM评审的限制：  
      - **延迟**：评估器可能给每条 trace 增加几秒额外延迟（更适合异步/批处理）。  
      - **成本**：全量评估很贵，抽样几乎是默认策略。  
      - **准确性**：开箱 evaluator 不一定符合你对“好”的定义；自定义 judge 往往需要，但又必须与人类标注做校准（否则你会在评估噪声上做优化）。

  - type: md
    title: 需要哪些“生产级能力”：自动发现模式、在线评估、仪表盘与告警
    body: |
      原文把“生产 agent 可观测”拆成了一组能力（以 LangSmith 为例，但概念可迁移）：

      **1) Insights / pattern discovery（自动发现使用与错误模式）**  
      生产里最难的一步往往是“我甚至不知道该找什么”。因此需要能在大量 traces 里自动聚类与总结：用户主要怎么用？最常见的错误模式是什么？工具选择失败集中在哪些意图上？

      **2) Online evaluations（持续质量监控）**  
      让 evaluator 在生产 traces 上持续跑，并且可配置：

      - 评哪些 traces（全量 / 抽样 / 规则过滤子集）  
      - 评哪些维度（质量、groundedness、工具使用、格式、政策与安全）  
      - 何时告警（阈值、趋势突变、特定模式爆发）

      **3) Dashboards & Alerts（监控“对业务重要的东西”）**  
      不是所有指标都值得上墙。生产里更常见的是：按工作流/用户群/工具链路拆分成功率、转人工率、完成率、满意度、安全事件等，并配套告警策略。

      这三类能力之所以必须和“开发闭环”连起来，是因为 agent 的改进路径通常是：  
      生产 traces → 标注队列 → 数据集 → 实验对比新旧策略 → 回归验证 → 再部署 → 再监控。

  - type: md
    title: 为什么通用 APM 工具不够：payload、连接性与使用者都不同
    body: |
      原文用三个维度解释了“为什么 传统的观测工具如 Datadog/New Relic 不够用”（它们当然可以做基础指标，但很难覆盖 agent 的核心需求）：

      **Payloads：自然语言数据**  
      你需要存储与检索完整对话与轨迹，甚至需要语义检索，而不是只存结构化日志。

      **Connectivity：与开发循环的连接**  
      生产失败样本要能一键进入数据集、进入实验与回归；否则 observability 只是“看见问题”，无法“快速修复并验证”。

      **Users：跨职能团队**  
      agent observability 的使用者通常不仅是 SRE/DevOps，还包括 ML 工程师、产品、领域专家、数据科学等；因此界面与协作流程也需要不同设计。

  - type: md
    title: 开放挑战：评估器可靠性、成本与隐私合规
    body: |
      原文最后也保持了克制：即使有了上述机制，仍有长期挑战需要持续权衡：

      - evaluator（尤其是 LLM judge）的可靠性：什么时候能自动判定，什么时候必须人工复核？  
      - 规模化成本：抽样比例、自动评估与人工评审的组合如何随业务变化调整？  
      - 隐私与合规：存储完整对话与轨迹的敏感性如何治理（脱敏、权限、保留策略）？

  - type: md
    title: 练习：为你的 agent 写一份“生产可观测最小设计”
    body: |
      选一个你正在做或打算做的 agent，写一页纸的最小设计（偏工程，不要写愿景）：

      1) 你会记录哪些 trace 字段？（至少包含：多轮消息、工具调用、工具错误、关键状态）  
      2) 你准备怎样抽样？（全量存储 vs 10–20% 评估抽样 vs 规则过滤）  
      3) 你要建一个 annotation queue 吗？它的 rubric 最少包含哪 3 项？  
      4) 你最想告警的 2 个信号是什么？（质量下降/工具错误暴涨/安全违规等）  
      5) 生产失败样本如何回流到回归集与实验里？写出你希望的一条最短路径。

  - type: md
    title: 原文阅读
    body: |
      - 日期：2026-02-26
      - 来源：LangChain
      - 建议：阅读时可以先抓住“为什么 agent 不可预期”（无限输入 + 非确定性），再顺着文章中段的两条扩展路径（annotation queues + LLM online evals）理解“人类判断如何规模化”；最后看工具能力清单（insights、在线评估、告警）与其如何嵌入开发闭环。

  - type: url
    title: "原文：You don’t know what your agent will do until it’s in production"
    url: https://blog.langchain.com/you-dont-know-what-your-agent-will-do-until-its-in-production
    mode: open

  - type: md
    title: 时效性提示（可能过时）
    body: |
      文中提到的一些产品/工具名会迭代；但“生产 traces → 标注/评估 → 数据集/实验 → 再部署”的闭环思路通常不会过时。不同团队差异主要在抽样比例、rubric 与合规策略，而不是是否需要这条闭环。

  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) agent 的可预期性弱，主要因为输入空间无限、对小变化敏感且非确定，并且行为由多步轨迹构成；因此上线前很难用有限测试覆盖。  
      2) 生产监控需要看“对话与轨迹”：多轮上下文、中间步骤、工具调用质量与安全信号；单靠 HTTP 指标不足以评估质量。  
      3) 人类评审不扩展的瓶颈可以用两条路径缓解：用 annotation queue 把人力聚焦到高价值样本；用在线 evaluator（抽样 10–20% 等）把判断规模化，但要权衡延迟/成本/准确性并做校准。  
      4) 通用 APM 缺的是自然语言 payload 的数据模型与检索能力、与开发闭环的连接性、以及面向跨职能团队的协作流程；AgentOps 工具的价值往往来自把这些“非传统监控能力”组合成可用工作流。

