id: devblog-2025-06-13-how-we-built-our-multi-agent-research-system
title: "Orchestrator–Worker：并行探索如何转化为“压缩回传”的能力"
summary: |
  用 orchestrator–worker 把“并行探索”组织成可控的 fan-out / fan-in：workers 在各自上下文里独立搜索并产出可复用 artifact（或结构化摘要），orchestrator 负责统一约束、合并、迭代与收敛；理解同步/异步权衡、token 成本边界与 end-state 评估思路。
items:
  - type: md
    title: 导入：本课要回答的问题
    body: |
      第一次接触 multi-agent 时，很容易把它理解成“多开几个模型并行跑”。但在 agent 系统里，更关键的问题往往不是“怎么并行”，而是：
      **并行带来的信息增量，如何以低损失、可校验、可复现的方式合并回主线**。

      本课围绕下面 5 个问题展开：

      1) “并行探索”通常解决什么类型的问题？为什么研究类任务更常见？  
      2) orchestrator 和 workers 分别做什么？两者之间要约定哪些输入/输出，系统才不会变成“传话游戏”？  
      3) “压缩回传（compression）”压缩的到底是什么？它和“写个摘要”有什么差别？  
      4) 同步（synchronous）与异步（asynchronous）各自带来什么收益与新风险？“一致性”“错误传播复杂度”这些词在系统里具体长什么样？  
      5) multi-agent 很贵：token 成本怎么理解？怎样判断什么时候值得付这笔钱？

  - type: md
    title: 概念对齐：从“Chat 调用”到“Agent 系统”
    body: |
      先把一些在工程讨论里经常混用的词拆开，避免“听起来像同一件事”：

      **Chat 调用（作为一种常见基线）**  
      这里把 “chat” 当作一种常见的成本/形态基线：一次（或少数几次）LLM 调用主要在文本对话中完成任务，不需要在循环里多次调用工具，也不持续维护复杂的外部状态。
      它不是唯一形态，但常用于估算“非 agent 交互”的成本级别。

      **Agent（单 agent）**  
      在工程上，agent 往往意味着一个闭环：模型会反复执行“观察 → 决策 → 行动（工具调用/写文件/查询）→ 再观察”，直到满足停止条件。
      即使只用一个模型实例，这种闭环也会显著增加 token 消耗，因为每一轮都要把必要上下文与工具结果带回模型输入。

      **Multi-agent（多个 agent）**  
      多个 agent 同时（或分阶段）运行。直觉收益不止是“多线程”，更关键的是：每个 agent 都有自己的 context window，可以承载一段更细的探索轨迹；主系统再把多个轨迹的有效信息合并起来。

      **Token / context window / token budget**  
      token 可以理解为模型计费与容量使用的基本单位（通常接近“子词/子串”）。  
      - context window：一次调用中模型最多能“看到”的输入 + 输出 token 总量上限。  
      - token budget：为了完成一个任务愿意花掉的 token 总量（直接影响成本，通常也影响延迟）。

      **Tool call（工具调用）**  
      指模型不直接输出最终文本，而是请求执行一个函数/工具（例如浏览、检索、运行脚本、读写文件）。工具返回的结果会成为后续推理的新输入。

      **Orchestrator / Worker（也常叫 lead / subagent）**  
      - orchestrator：负责“全局目标与约束”的那一端：拆分任务、分配预算、合并结果、判断是否继续迭代。  
      - worker：负责“局部探索与产出”的那一端：围绕一个子问题搜索、读取资料、跑工具、写出阶段性产物，再把信息以可合并的形式交回。

  - type: md
    title: 为什么研究类任务更常见：路径依赖与“边找边改”
    body: |
      研究型问题很难被写成“确定步骤的流水线”。原因不只是步骤多，而是：**下一步依赖上一轮发现**。

      一个典型研究任务的节奏更像：

      - 先提出一个宽问题（“有哪些主流路线？”）  
      - 扫一轮资料后发现分支与关键词（路线 A/B/C、不同团队的术语差异）  
      - 根据发现 pivot：把问题改写得更具体，或转向更能解释差异的角度  
      - 重复数轮，直到证据与解释框架足够一致

      这类任务里，“并行探索”的自然切法通常是 breadth-first：把多个相对独立的方向同时推进，再合并结果。

      原文给了一个非常直观的案例：问题是“列出某一大类公司（例如某指数的某行业子集）所有公司的董事会成员”。  
      - 串行路线：一个 agent 逐个公司搜索，覆盖慢、容易漏；  
      - 并行路线：多个 workers 各自负责一批公司或一种信息源，orchestrator 负责汇总与查漏补缺。  

      同一篇文章也报告了一个内部评测观察：在研究型评测中，引入 orchestrator + 多个 workers 的系统，相对单 agent 有显著提升（量级报告为 90.2% 的相对提升）。把它当作“多开就一定更强”的结论并不合适，但它很好地说明：当任务的瓶颈是覆盖与检索容量时，并行探索可能是有效杠杆。

  - type: md
    title: Orchestrator–Worker：把并行探索组织成可控的 fan-out / fan-in
    body: |
      一个可迁移的最小结构，是把系统拆成两个“职责非常不对称”的角色：一个负责全局收敛（orchestrator），多个负责局部扩展（workers）。

      先用三条同层级要点描述架构，再逐条解释含义：

      - **1) 计划与派发（Plan & Dispatch）**：orchestrator 保持“问题定义”稳定，把任务拆成若干可并行的子问题，并为每个 worker 设定预算与输出格式。  
      - **2) 并行探索（Parallel Explore）**：workers 在各自上下文中独立搜索、读取与推理，尽量把“探索过程”留在自己的轨迹里。  
      - **3) 合并与迭代（Fan-in & Iterate）**：orchestrator 收集 workers 的产出，做去重、对齐假设、补洞，然后决定下一轮要不要再 fan-out。

      这三步里，最容易被低估的是“输出格式”。契约不清晰时，系统常滑向两种极端：

      - worker 输出太散：回传大量原文与碎片推理，orchestrator 读不完、合不起来。  
      - worker 输出太薄：只有一句结论，没有证据与不确定性，orchestrator 无法判断可信度，也难以决定下一步。

      一个常见折中，是让 worker 输出更像“可合并的数据结构”，而不是“聊天段落”。例如（示意，不绑定具体框架）：

      ```yaml
      worker_output:
        answer: "一句话结论"
        evidence:
          - claim: "关键事实/主张"
            source: "可追溯引用（URL/文档/文件路径）"
        uncertainties:
          - "仍不确定的点/需要澄清的假设"
        artifacts:
          - "输出物的引用（report.md / results.json 等）"
      ```

  - type: md
    title: “搜索 = 压缩”：压缩回传压缩的是什么？
    body: |
      原文用一句很有辨识度的话概括研究：搜索的本质是压缩。它容易被误读成“最终写个摘要”，但在 agent 系统里，更贴近工程语义的“压缩”通常至少包含三件事：

      **1) 选择（selection）**  
      不是所有发现都需要进入主线；需要进入的，往往是会影响后续决策的那部分信息（关键证据、关键约束、关键分歧）。

      **2) 结构化（structuring）**  
      压缩后的信息需要适合被合并：同一类字段放在一起（事实/证据/假设/未决问题），避免把关键点藏在长段落里。

      **3) 可追溯（traceability）**  
      研究任务很少止步于“有个答案”，后续常要复核。压缩回传如果丢掉来源，系统会变得不可校验；如果回传大量原文，又会把 token 预算吃光。

      这也是为什么许多 multi-agent 系统会偏向 **artifact + 引用** 的回传方式：  
      worker 把完整产物写到外部（文件、表格、报告），orchestrator 拿到的是“引用 + 少量摘要 + 关键字段”。这样既减少 token 复制，也降低“传话导致的信息失真”。

  - type: md
    title: 长任务与上下文：为什么会需要“干净上下文”的 workers
    body: |
      生产环境里的研究型对话可能持续很多轮。随着轮次增加，context window 会被历史对话、工具输出与中间草稿逐步占满。

      原文提出的一个可迁移做法是：把长任务拆成“阶段”，阶段之间做一次上下文整理，然后继续推进：

      - **阶段性总结**：把已经完成的工作压缩成“可以继续执行的状态”，而不是保留所有过程细节。  
      - **外部 memory / artifact**：把关键计划、关键证据、关键中间结果写到对话之外（例如文件或数据库），并在需要时检索回来。  
      - **干净上下文的探索**：当主线上下文变得嘈杂或接近上限时，启动新的 worker，用干净上下文专注解决一个子问题；再通过 handoff 把结果交回主线。

      这里的直觉是：并行不只是“更快”，也是一种“隔离噪声”的手段——把探索细节隔离在 worker 的轨迹里，主线只保留可操作的压缩结果与引用。

  - type: md
    title: 同步 vs 异步：并行度提升后，新的麻烦从哪里来？
    body: |
      原文提到一个常见演进：系统最初往往选择“同步地跑完一批 workers”，因为这样更容易写对；但同步会形成瓶颈，于是会自然想到异步。

      **同步（synchronous）**  
      orchestrator 发起一批 workers，然后等待这一批全部完成，再进入下一步。优点是流程清晰、状态更容易保持一致；缺点是墙钟时间（wall-clock latency）容易被“最慢的那个 worker”拖住。

      **异步（asynchronous）**  
      orchestrator 发起 workers 后，不必等所有 worker 都完成；它可以在结果陆续返回时继续推进，甚至根据中间结果追加或取消后续探索。优点是更强并行与更灵活的调度；缺点是系统会更像“分布式系统”，需要处理更多协调问题。

      异步带来的两个抽象难点，放到具体系统里通常长这样：

      **难点 A：一致性（state consistency）**  
      “一致性”在这里不是数据库术语，而是一个更朴素的问题：系统里不同 agent 在做决定时，是否基于同一套关键约束与已决策信息？

      一个常见场景是：orchestrator 在第 3 轮决定了“只接受 2023 年之后的数据”，但某个早先启动、运行较慢的 worker 仍在按旧约束抓 2018 年的资料；结果被合并后，整份结论的时间范围变得混乱。  
      这种不一致往往不是“推理错误”，而是**信息到达顺序**与**状态更新顺序**导致的。

      **难点 B：错误传播复杂度（error propagation）**  
      在多 agent 系统里，一个局部错误可能通过“合并与迭代”被放大。

      例如：worker A 误把一个缩写解释错了，并据此产出一份结构化表格；orchestrator 把这份表格当作“可信中间结果”写入全局状态；后续 workers 又以这份全局状态为前提继续搜索与推理。  
      这时纠错不再是“修一个结论”，而是要追踪：哪些后续步骤被污染、哪些 artifact 需要重做、哪些评估用例会被误判。这就是“错误传播复杂度”在工程里的含义。

      因此异步并行常需要配套：版本化的 state、显式的决策日志、以及更严格的输出契约（否则系统会跑得更快，但更难复现与调试）。

  - type: md
    title: 评估与可靠性：为什么 end-state 往往比逐步检查更实用
    body: |
      当 agent 会调用工具、写文件、更新外部系统时，“过程每一步都对”未必是一个现实的评估目标：同一个任务可能存在多条可行路径。

      原文提出的一个可迁移做法是把关注点放在 **end-state（最终状态）** 上：

      - 先把任务的“正确结果”定义为可检查的最终状态（例如：报告是否包含必需字段；某个目录是否生成了预期文件；数据库是否写入了正确记录）。  
      - 对复杂流程，再切几个 **checkpoints（检查点）**：不需要逐步评判每一次工具调用，但希望在若干关键阶段看到“特定状态变化已经发生”。

      这种评估方式和 multi-agent 的关系在于：并行探索会产生更多分叉轨迹。如果评估仍坚持逐步对齐某个固定流程，系统越复杂反而越难稳定迭代；而 end-state + checkpoints 更接近“工程上可持续”的验收方式。

  - type: md
    title: 成本边界：token 预算如何影响“值不值得并行”
    body: |
      原文给出了一组非常直观的成本量级（作为当时系统观测）：  
      - 单 agent 的 agent 交互，平均 token 使用量约是 chat 的 **4×**  
      - multi-agent 系统平均约是 chat 的 **15×**

      如果把 token 粗略理解为“花费的计算与注意力”，这组数字表达的不是精确常数，而是一种常见现象：  
      一旦进入“循环 + 工具 + 状态维护”，成本会跳到一个新的量级；多开 agent 会进一步放大这一量级。

      原文还引用了一个与“预算”相关的观察：在某个浏览检索型评测（BrowseComp）里，性能差异的大部分可以由少数因素解释，其中 token 使用量本身占据很大比例；另外两个相关因素是工具调用次数与模型选择。  
      这更适合被当作设计直觉：在检索/研究类任务里，“给足够的阅读与推理容量”往往是关键变量之一；而 multi-agent 是把总 token 容量扩展到多个 context window 的一种方式。

      反过来，也能得到一个边界判断：当任务需要强共享上下文、并且各子部分高度耦合时，并行的协调成本与合并成本可能超过收益（编码任务里这种情况更常见）。

  - type: md
    title: 常见失败模式：它们通常看起来像什么？
    body: |
      multi-agent 的“难”经常不是模型能力本身，而是系统层面的信息组织。下面列出几种在工程里常见、也容易被误认为“模型不行”的失败形态：

      - **输出不可合并**：workers 各写各的，风格与假设不一致；orchestrator 没有足够的字段去对齐冲突、只能靠再次对话“拍脑袋合并”。  
      - **证据不可追溯**：回传只有结论，没有来源；后续复核做不起来，错误会在后续迭代里被反复放大。  
      - **传话游戏**：workers 把大量原文与过程塞回对话里，导致 token 爆炸；同时在多次转述里丢失关键信息。  
      - **异步污染**：慢 worker 的“旧状态结果”被合并进新状态，造成约束混乱；纠错需要回滚与重跑，但系统没有回滚粒度。

      这些问题大多可以被“更清晰的契约 + artifact 管道 + 更可观察的状态”缓解，但它们也解释了为什么 multi-agent 往往不是一开始就值得上的复杂度。

  - type: md
    title: 练习：把“并行探索 → 压缩回传”写成可实现的接口
    body: |
      练习目标不是复现某个产品，而是把模式落到“能写进代码”的形式。

      任选一个研究型问题（例如：整理某个方向 3 种主流方法并给出证据与反例），写出两样东西：

      1) 一份 worker 输出 schema（YAML/JSON 结构均可），至少包含：结论、证据引用、未决问题、artifact 引用。  
      2) 一段 orchestrator 的合并逻辑描述：如何去重、如何发现冲突、什么条件触发下一轮 fan-out（或停止）。

      写完后做一次自检：如果把 worker 的“完整探索过程”删掉，只保留 schema 字段，orchestrator 是否仍能做出下一步决策？如果不能，说明压缩信息还不够“可操作”。

  - type: md
    title: 原文阅读
    body: |
      - 日期：2025-06-13
      - 来源：Anthropic
      - 建议：阅读时可以重点核对三类细节：① worker 输出应保留哪些证据字段；② 同步/异步在文中的动机与风险描述；③ 附录里关于 end-state、长对话管理与 artifact 的工程做法。

  - type: url
    title: "原文：How we built our multi-agent research system"
    url: https://www.anthropic.com/engineering/multi-agent-research-system
    mode: open

  - type: md
    title: 时效性提示（可能过时）
    body: |
      原文包含若干与“当时系统测量”强相关的数字（例如提升幅度、4×/15× token 量级、特定模型组合）。这些量化结果在不同模型与不同实现下可能显著变化。
      本课更强调可迁移的结构：fan-out / fan-in 的组织方式、压缩回传的输出契约、以及并行带来的协调成本。

  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) “并行探索”更常见于研究类任务，一个经验原因是：很多子方向天然可独立推进，而且每个方向都可能带来会改变路线的新证据。  
      2) orchestrator–worker 的关键不在“多开几个 agent”，而在“把信息合并变成一个协议”：哪些字段需要回传、哪些需要可追溯、哪些产物适合落到 artifact。  
      3) “压缩回传”更像“把一段探索轨迹压缩成可合并的状态增量”，而不是“把原文写短一点”。  
      4) 同步/异步的差异可以粗略理解为：同步更像批处理，异步更像分布式系统；异步的收益来自更灵活的调度，代价来自一致性与纠错链路变长。  
      5) token 成本的判断可以先从任务的“可并行性”和“可合并性”出发：并行方向越独立、合并规则越清晰，multi-agent 越可能在单位成本下带来更好的覆盖与可靠性。
