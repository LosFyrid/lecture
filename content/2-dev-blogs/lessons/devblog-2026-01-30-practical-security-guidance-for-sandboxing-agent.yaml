summary: |
  威胁模型：coding agents/“computer use agents” 通过终端运行工具，常拿到与用户同等权限，因此攻击面大。主要威胁是 **indirect prompt injection**：恶意指令藏在被 LLM 读取的内容里（恶意 repo/PR、git history、`.cursorrules`、CLAUDE/AGENT.md、恶意 MCP 响应等），诱导 agent 以用户权限做危险动作（外泄、持久化、RCE 等）。
