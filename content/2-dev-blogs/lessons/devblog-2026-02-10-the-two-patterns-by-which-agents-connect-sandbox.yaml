title: "The two patterns by which agents connect sandboxes"
summary: |
  TL;DR：越来越多 agent 需要一个“工作电脑”（装包、跑代码、访问文件），但必须隔离以避免触碰宿主机凭据/文件/网络；文章总结了两种主流架构，把“agent 跑在哪里”作为分界。
