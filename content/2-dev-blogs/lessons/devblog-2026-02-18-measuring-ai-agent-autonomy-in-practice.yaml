id: devblog-2026-02-18-measuring-ai-agent-autonomy-in-practice
title: "如何测量 agent 自主性：把“放手程度”变成可追踪的指标"
summary: |
  用一套可落到日志与指标的测量框架回答工程问题：真实线上里，人们到底给 agent 多大自主性？监督方式如何随经验变化？模型会不会主动停下求助？以及这些行为在不同风险水平下呈现怎样的分布。
items:
  - type: md
    title: 导入：本课要回答的问题
    body: |
      做 agent 的人常会遇到一个尴尬现象：离线 benchmark 看起来“很强”，但一到真实产品里，你很难回答更现实的问题：

      - 用户到底让它“自己跑”到什么程度？是每一步都审批，还是一口气放行？
      - 用户是更信任了，还是更会打断了？这两件事能同时发生吗？
      - 在难任务里，监督是谁先踩刹车：人类打断，还是模型主动停下来问？
      - 这些“自主性”行为在更高风险的场景里分布怎样？有哪些动作即使比例很低，也值得重点防护？

      本课会把原文当作一个“真实世界测量案例”来拆解：它不是在推销某个分数，而是在展示如何把“放手程度”变成可追踪的指标体系。

  - type: md
    title: 概念对齐：自主性、监督与“停止”的三种来源
    body: |
      为了让后面的讨论能落到工程对象，这里先把几个容易“只剩感觉”的词，变成可以写进日志的定义。

      **agent（文中使用的可操作定义）**  
      *具备工具并能采取行动的 AI 系统*：例如能运行代码、调用外部 API、发消息、修改文件。这个定义的好处是：你可以绕开“它到底算不算 agent”的哲学争论，直接从 **tool use / actions** 来研究它在世界里做了什么。

      **autonomy（自主性）**  
      文中把它当作一个“程度”来使用：一个系统越能在较少人类指令与监督下独立推进任务，它的自主性就越高。  
      重要的是：自主性不是模型天生自带的常数，它往往会随着产品默认设置、权限系统、用户经验、任务难度而改变。

      **turn / session / tool call（为什么要分这三层）**  
      - *tool call*：一次工具调用（请求 + 参数 + 返回/错误）。它是“行动”的最小可观测单元。  
      - *turn*：在交互式产品里，模型开始工作到它停止（完成/等待/被打断）的一段连续执行。  
      - *session*：一个任务或一段对话的更长跨度，可能包含多个 turns。  
      文章强调：如果你只能看到零散 API 请求，而无法把它们串成 session，你对“自主性如何在多步任务里展开”的理解会受限。

      **auto-approve（自动放行）**  
      用户选择让 agent 的动作无需逐步人工确认就可以执行（例如“所有工具调用默认允许”）。它通常能提高速度，但也意味着监督从“逐步审批”转向“事中监控 + 必要时介入”。

      **interrupt（打断）**  
      用户在 agent 正在执行时主动停止它，并插入新的信息/纠正/约束。打断不是“失败”，它常常是有效监督的一部分：让系统在偏航前回到主线。

      **agent-initiated stop（模型主动停下）**  
      模型自己决定暂停推进，向人类发问澄清或确认。把它看成一种“自我监督”会更有帮助：它把不确定性显式化，而不是把不确定性带着跑进高风险动作里。

  - type: md
    title: 为什么“真实世界自主性”难测：定义、数据源与隐私
    body: |
      如果只做离线评测，你往往测到的是“模型在理想条件下能做到什么”。但部署到真实产品后，自主性会受到很多非模型因素影响：默认审批策略、工具权限、用户的耐心与信任、任务是否容易验证等。

      原文选择了两类第一方数据源，来平衡“看得广”和“看得深”：

      **数据源 A：公共 API 的 tool calls（广，但碎）**  
      他们不试图猜测客户的 agent 架构，而是把分析单位降到 *单次 tool call*：这让观察口径更一致、更可落地；代价是看不到多步行为如何组合成完整任务。

      **数据源 B：Claude Code 的交互式 sessions（窄，但连续）**  
      因为是自家产品，他们能把多次请求串成完整 session，看到 turn 如何展开、用户何时介入、模型何时自停。这对研究“自主性如何随经验变化”尤其关键。

      **隐私约束不是旁枝**  
      原文使用了隐私保护基础设施（文中称 CLIO）来分析数百万次交互：这意味着很多结论是 *聚合统计*，而不是“把每个客户的具体日志拿出来肉眼审”。对你更现实的启发是：如果你也想做“线上自主性测量”，就需要从一开始设计好采样、脱敏与聚合口径。

  - type: md
    title: 指标一：turn duration（看尾部，而不是看均值）
    body: |
      如果你要用一个“粗但可测”的指标刻画自主性，原文给出的第一个选择是：**turn duration**（一轮里 agent 连续工作多久才停下来）。

      作者明确提醒：turn duration 不是完美指标，因为它混合了很多因素：模型变快/变慢、任务变难/变简单、产品加了并行子流程都会影响时长。但它仍然能提供方向性信号，尤其是在分布的尾部。

      原文给出的关键数字是：

      - Claude Code 的多数 turns 很短：**中位数约 45 秒**（过去几个月在 40–55 秒间波动）。  
      - 真正“泄露自主性上限”的是长尾：**99.9 分位**在约三个月内几乎翻倍：从 **<25 分钟**到 **>45 分钟**（大致是 2025-10 到 2026-01 的窗口）。
      - 这条增长曲线在模型发布之间相对平滑。作者据此提出一个推断：自主性提升未必完全来自“模型更强”，也可能来自用户信任积累、任务更雄心、产品交互与执行效率逐步改善。

      这里的工程启发是：如果你只盯均值/中位数，很容易被“新用户涌入”等因素淹没；而当你关心“agent 是否开始承担更长任务”，尾部指标往往更敏感。

      原文还补了一条“自主性不只体现在更长，也体现在更少介入”的旁证：在 Anthropic 内部的 Claude Code 使用里，作者观察到（约 2025 年 8–12 月）最具挑战任务的成功率提升的同时，**每个 session 的平均人类介入次数从 5.4 降到 3.3**。这并不等价于“更长就更好”，但它提醒我们：测量时可以同时关注 *执行跨度* 与 *人类介入强度*，避免只用单一维度下结论。

  - type: md
    title: 指标二：监督策略会变——auto-approve 与 interrupt 的“同涨”
    body: |
      初学者常会把监督想成单一维度：要么“管得严”，要么“放得开”。原文用真实数据展示了一个更贴近产品现实的模式：**经验增长会让监督方式从“逐步审批”迁移到“放手跑 + 必要时介入”**。

      在 Claude Code 里，他们测了两条行为曲线：

      1) **auto-approve 率随经验上升**：新用户（<50 sessions）大约 **20%** 的 sessions 使用 full auto-approve；到更熟练（约 750 sessions）上升到 **>40%**。  
      2) **interrupt 率也随经验上升**：大约 10 次 session 经验的用户在 **5%** 的 turns 会打断；更有经验的用户大约在 **9%** 的 turns 打断。

      表面看这很矛盾：更信任了，为什么反而更常打断？作者的解释是：  
      新用户倾向于“每步先审批再走”，因此很少需要 mid-flight 打断；熟练用户更常一口气放行，但也更会在关键时刻插入纠正与重定向——**打断并不等于不信任，而可能是一种更轻量的持续监控**。

      这也解释了为什么“只把监督设计成每步点确认”可能并不符合熟练用户的工作方式：你需要同时支持“快跑”和“随时介入”。

      原文还给了一个“同类现象”的旁证：在他们对公共 API 的 tool calls 进行模型分类的口径下，**最小复杂度任务的 tool calls 里约 87% 看起来有人类参与**，而 **高复杂度任务约 67%**。作者认为这并不一定代表“人类更放任”，也可能是因为复杂任务步骤更多，“逐步审批”在结构上更难持续；因此产品更需要支持“可监控、可介入”，而不仅是“可审批”。

  - type: md
    title: 指标三：agent 也会“主动刹车”——agent-initiated stops
    body: |
      “监督”不只有人类这一条线。原文专门测了第三种停止来源：模型主动暂停，向人类提问澄清（agent-initiated stops）。

      他们观察到：任务越复杂，Claude Code 越倾向于停下来问问题；并且在最复杂任务上，**模型停下来澄清的频率超过人类打断的 2 倍**。

      这条结果更像一个“安全机制线索”而不是胜利宣言。作者也提醒不要过度解读：模型不一定在“正确的时刻”停下，它可能问了多余的问题，甚至会受到产品功能的影响。  
      但无论如何，它把一个可迁移的设计方向凸显出来：**训练/提示模型识别不确定性并主动求助**，可以与外部护栏（权限、审批、隔离）形成互补——尤其是在多步任务里，“早停下来问”往往比“跑到一半做错高风险动作”更可控。

  - type: md
    title: API 侧的视角：把 tool call 当作观测单位，测风险/可逆性/护栏
    body: |
      研究“线上 agent 行为”时，很多团队会卡在一个现实限制：你看得到 API 流量，但很难把它们拼成一个个完整 session。原文因此退而求其次：把 *单次 tool call* 当作“行动原子”，并用模型来做结构化标注。

      他们在公共 API 的随机 tool call 样本上，让 Claude 对每个 tool call 给出两类 1–10 的相对评分：

      - **risk（风险）**：1 代表几乎无后果；10 代表可能造成重大伤害的动作。  
      - **autonomy（自主性）**：低分更像在执行明确的人类指令；高分更像在自行决定怎么做。

      然后把相似 actions 聚成 clusters，观察“高风险 / 高自主性”是否同时出现。作者的总体判断是：右上角（高风险 + 高自主性）样本稀疏但并非不存在；并且他们看到一些“边缘但值得关注”的用例簇（例如带有安全红队性质的开发活动、或某些高后果领域的尝试）。

      为了让这个二维图更具体，可以看原文给出的 cluster 示例（这里摘两条做直觉锚点）：  
      - 低风险但高自主性的例子：自动化系统健康/状态监控（高自主、低风险）。  
      - 风险更高且自主性也高的例子：把 API key 外泄/后门植入伪装成“正常开发功能”的动作簇（高自主、较高风险）。  
      作者也强调：因为隐私与可见性限制，这些 cluster 里有一部分可能来自评测或安全演练；因此更适合用来提示“可能存在的前沿用法”，而不是用来断言真实部署规模。

      原文也给出了一组更直观、但需要谨慎解读的聚合统计：

      - **软件工程约占近 50%** 的 agentic activity（以其工具调用样本口径衡量），同时在医疗、金融、网络安全等领域出现早期探索。  
      - 大多数动作“低风险且可逆”。  
      - 他们估计：约 **80%** 的 tool calls 来自“看起来带有至少一种 safeguard”的 agent（例如权限限制或人工审批要求），约 **73%** “看起来有人类在环”，约 **0.8%** “看起来不可逆”（文中例子是对外发送客户邮件）。

      这些数字背后的关键不是百分比本身，而是口径：它们是基于 tool call 上下文的模型推断，作者强调应把它们当作**比较性指标**，而不是精确测量。

      另外，原文还提醒了一个容易忽略的抽样偏差：公共 API 的样本是按 **tool call** 抽的，这会让“需要很多连续工具调用的工作流”（例如反复编辑/运行/再编辑的软件工程流程）在样本里更占份额。换句话说，这更像是在测量“行动量的分布”，而不完全等价于“部署形态的分布”。

  - type: md
    title: 把结论变成工程动作：设计自己的 autonomy telemetry
    body: |
      把这篇文章当作“测量框架”来用时，一个可迁移的做法是：先问自己要支持哪一种监督策略，然后再决定记录什么。

      例如，如果你希望支持“放手跑 + 必要时介入”，那么你至少需要能回答：

      - 这次任务里，哪些动作在执行前需要明确授权？哪些可以默认放行？  
      - 用户打断发生在什么阶段？打断后提供了什么类型的纠正（补充信息/改目标/改约束/直接终止）？  
      - 模型是否主动停下？它停下的原因更像“信息缺失”，还是“风险上升”，或“工具失败需要人决策”？

      更具体一点，你可以把“自主性”拆成几条更可操作的指标：

      - **执行跨度**：turn duration 的分位数（尤其是尾部），以及每个 turn 的 tool call 数量分布。  
      - **监督形态**：auto-approve 开关使用率、interrupt 率、每 session 人类干预次数。  
      - **自我监督**：agent-initiated stop 的发生率、原因聚类（澄清/风险确认/不确定性）。  
      - **风险代理指标**：可逆 vs 不可逆动作占比；高风险动作是否被更强护栏（审批/权限/沙箱）覆盖。

      原文的“方法论底色”是：不要急着规定某一种交互模式是标准答案；更稳妥的是先测量真实使用方式，再围绕“人是否处在能有效监控与介入的位置”去做设计。

  - type: md
    title: 练习：给一个工具型 agent 设计“自主性仪表盘”
    body: |
      以“日历助理 / 工单助理 / coding agent”任意一种为例，写一个你愿意真正实现的最小仪表盘草图（不需要画 UI，写字段即可）：

      1) **事件日志（event log）字段**：你打算记录哪些事件？（例如 `tool_call_started`、`tool_call_succeeded`、`tool_call_failed`、`human_interrupt`、`agent_pause_for_clarification`、`approval_granted`）  
      2) **三条核心指标**：从执行跨度、监督形态、自我监督里各选一条，写出你会如何计算（分母/分子是什么）。  
      3) **一个风险护栏**：选一个“不可逆动作”（比如对外发信、改权限、写生产配置），设计它的审批/回滚/告警策略，并解释为什么它与“自主性指标”需要一起看。

  - type: md
    title: 原文阅读
    body: |
      - 日期：2026-02-18
      - 来源：Anthropic
      - 建议：阅读时可以重点看三条线：1) 为什么用 tool calls/turns 作为可操作测量单位；2) auto-approve 与 interrupt 同时上升意味着监督策略在迁移；3) agent-initiated stops 如何被视作一种重要的安全属性（以及作者对其边界提醒）。

  - type: url
    title: "原文：Measuring AI agent autonomy in practice"
    url: https://www.anthropic.com/research/measuring-agent-autonomy
    mode: open

  - type: md
    title: 时效性提示（数据窗口与口径）
    body: |
      文中的统计反映的是特定时间窗口（大致是 2025 年末到 2026 年初）的真实使用分布，并且很多指标是“在隐私约束下的模型推断 + 聚合统计”。把它迁移到自己的系统时，更建议把它当作“如何设计可测口径”的示例，而不是把某个百分比当作跨产品可复用的常数。

  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) 评估“自主性”时，单看离线能力不够，因为自主性往往由产品默认设置、权限系统、用户监督策略共同塑造；这也是作者强调 post-deployment monitoring（上线后测量）的原因。  
      2) 把自主性变成指标的一条路径是：在能串起 session 的产品里看 turn duration / auto-approve / interrupt / agent-initiated stops；在只能看到 API 流量时，把 tool call 当作最小动作单元，再做风险/自主性/护栏的相对标注与聚合。  
      3) “auto-approve 与 interrupt 同涨”可以理解为：监督并不是非黑即白；经验增长可能把监督从“逐步审批”迁移到“持续监控 + 必要时介入”。  
      4) “模型主动停下求助”可以被视为一种安全属性：它让不确定性显式化，并与外部护栏（审批/权限/隔离）形成互补；但它的有效性仍需通过数据与产品设计持续校准。  
      5) 如果你要把这套框架迁移到自己的系统，一个实用起点是：先定义事件日志与口径（turn/session/tool call），再定义三类指标（执行跨度、监督形态、自我监督），最后把它们与风险代理指标（可逆/不可逆、权限级别）一起看，而不是把“自主性”当作单一分数。
