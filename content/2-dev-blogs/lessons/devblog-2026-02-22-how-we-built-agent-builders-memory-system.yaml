id: devblog-2026-02-22-how-we-built-agent-builders-memory-system
title: "How we built Agent Builder’s memory system"
summary: |
  为什么 Agent Builder（任务型、非通用 agent）必须优先做 memory：它不是“什么都干的 ChatGPT”，而是同一类工作反复执行；跨会话复用率高，如果没有 memory，用户会不断重复同样的偏好/规则，体验会很差。
