id: devblog-2026-01-23-unrolling-the-codex-agent-loop
title: "Unrolling the Codex agent loop"
summary: |
  文章把“Codex（CLI）背后的 harness/安全带”拆成一个可复用的心智模型：harness 负责在**用户 ↔ 模型 ↔ 工具**之间编排循环（agent loop），并把工具执行带来的副作用（写文件/改代码）与最终给用户的 assistant message 一起当作“输出”。
