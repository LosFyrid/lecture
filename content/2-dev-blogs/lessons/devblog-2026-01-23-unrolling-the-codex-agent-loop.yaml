id: devblog-2026-01-23-unrolling-the-codex-agent-loop
title: "Agent Loop：harness 如何编排推理与工具（状态/缓存/压缩）"
summary: |
  这篇文章把 Codex CLI 背后的“harness（安全带/编排层）”拆成一个可复用心智模型：harness 负责在用户、模型与工具之间运行 agent loop（推理↔工具↔观察的循环），并把“最终 assistant message + 工具副作用（例如写文件/改代码）”一起视为一次 turn 的输出。原文同时把三个经常被低估的工程主题讲得很具体：SSE 事件流如何变成可回放的 items、prompt caching 为什么要求前缀稳定、以及如何在保持请求无状态（stateless、支持 ZDR）的前提下做 compaction 续航。
items:
  - type: md
    title: 导入：本课要回答的问题
    body: |
      很多新人会把“agent”想成：用户问一句，模型回一句，再调用几个工具。

      但一旦你做的是 coding agent（会读文件、跑命令、写补丁），你会发现：真正决定可靠性与成本的，往往不是“模型回了什么”，而是 **harness 如何组织 loop、如何记录中间过程、如何控成本、如何在上下文变长时续航**。

      这节课围绕原文回答几个具体问题：

      1) 一个对用户来说的“单次回合（turn）”，在系统内部可能包含哪些推理↔工具的迭代？  
      2) harness 在这个 loop 中承担什么职责？哪些问题更像系统工程而不是模型能力？  
      3) 为什么 Codex 如此在意 prompt caching？哪些“看似无害”的变化会导致 cache miss？  
      4) 当对话变长接近 context window 上限时，compaction 具体怎么做？为什么 Codex 选择保持请求无状态（stateless）？

  - type: md
    title: 概念对齐：turn、thread、items 与“无状态请求”
    body: |
      **Turn /  Agent Loop（回合 / 线程 ）**  

      原文把一次从用户输入到 agent 返回 assistant message 的过程称为一个 turn。在一个完整的 turn 中包含至少一次“模型推理 ↔ 工具调用”这样的Loop循环。
      
      **Thread （线程）**

      由这一个或多个按时间顺序发生的 Turn 串联而成的整体就是一个thread。

      **Harness（执行引擎）** 

      作为支撑智能体运转的底层执行逻辑，它是连接用户、模型与工具的“调度中枢”——它负责将用户指令、系统环境和可用工具精准打包发给模型，在循环执行工具调用时强制实施沙箱权限护栏，并时刻监控上下文窗口，通过自动压缩超载的对话历史来管理模型的记忆负荷，直到驱动模型产出最终面向用户的答复。      
      
      **Items（结构化输入/输出）**  

      原文以 Responses API 为例：输入不是一段纯文本，而是一组 items，包含消息、推理记录（reasoning）、工具调用指令（function_call）、工具调用结果（function_call_output 
      ）等。  
      这决定了一个重要工程事实：你怎么表示“工具调用与结果”，会直接影响后续推理与可调试性。

      **Stateless（无状态请求）**  

      服务端不保存会话状态；每次请求都携带完整的输入 items。它简化服务端并支持 ZDR（Zero Data Retention），但也造成了一个问题：随着消息，推理记录和工具调用增加，传输的JSON长度也显著增加。

  - type: md
    title: 拆开一个 turn：推理、工具调用、观察，再推理
    body: |
      我们知道turn是由多轮agent loop迭代组成的，而根据原文描述，一次agent loop有以下几个步骤：

      1. harness 把用户输入整理进 prompt（或更准确地说：整理进一组输入 items）。  
      2. 调用模型做一次推理。  
      3. 作为推理结果，模型会结合其内部的逻辑推演与当前可用的工具说明（Tools），生成以下两种输出之一：
        - 发起一次工具调用（Tool call）：指示底层 Harness 去执行特定的工具（例如运行 ls 命令并带回输出）。harness 在执行工具结束后，把 tool output 追加回输入 items，再次调用模型，返回步骤2。
        - 产出一条助手消息（Assistant message）：直接回答用户的原始请求，或者向用户提出后续追问。这条消息的出现标志着当前智能体循环（Agent loop）达到终止状态，控制权交还给用户，本轮交互（Turn）正式结束。  

      原文强调一个对软件 agent 很关键的点：**turn 的输出不只有一段话**。  
      在 coding agent 里，主要输出往往是“它在你机器上写了哪些文件/改了哪些代码”；assistant message 更像一个“终止状态信号”，告诉用户“这轮执行完成了”。

  - type: md
    title: SSE 事件流：不是“流式文本”，而是结构化事件日志
    body: |
      原文揭示了 Responses API 的 SSE 事件流（Streaming）对 Harness 架构的决定性意义：服务端会持续推送一系列 response.* 事件，而 Harness 必须对其中两类核心事件进行截然不同的分流处理：
      - response.output_text.delta：这类事件负责向前端传递增量文本，只是为了让用户在界面上看到“正在打字”的流畅体验。
      - response.output_item.added：这才是 Harness 底层运转的真正核心所在。它不仅是“执行日志”，更是驱动智能体自我迭代的“数据传送带”。Harness 必须精准捕获这类结构化事件，将其转化为内部对象（例如模型刚做出的 function_call 决策），并将其作为核心上下文追加到下一次 HTTP 请求的输入 Items 中。可以说，没有这类事件的持续捕获与回填，状态流转就会彻底断裂，整个 Agent Loop 根本无法运转。
      
      这就是为什么在 agent 系统里，streaming 不只是体验优化：它也是“把中间过程结构化并落盘”的入口。

  - type: md
    title: 无状态的代价与好处：为什么 Codex 不用 `previous_response_id`
    body: |
      我们在一开始讲Item时就提出了一个问题：每次请求都带完整 JSON，随着对话增长，传输量确实是“二次方”增长趋势。

      虽然Responses API 提供了一个可选参数 `previous_response_id` 来缓解这一问题，但 Codex 为了保持请求完全无状态，目前不使用它。这样就可以支持 ZDR（Zero Data Retention，零数据保留）即服务端完全不需要存储对话数据，保留其隐私性。

      原文也指出了一个细节，即在 ZDR 场景下，客户不必担心隐私内容被以明文保存和传输——服务端和客户端只传递加密内容（encrypted_content），且可以在服务端解密使用；OpenAI 仅仅存储了 ZDR 客户的解密密钥，而不是对话数据本身。

      对 agent-builder 来说，这段话的启发是：stateful 与 stateless 是一组架构取舍，你需要结合合规/隐私/缓存/成本一起权衡，而不是只看“网络传输更省”。


  - type: md
    title: 性能主题：prompt caching 为什么要求“前缀稳定”
    body: |
      原文把成本直觉讲得很坦率：推理（inference）的成本通常远高于网络传输，因此提升效率的关键是 prompt caching。

      缓存命中的必要条件非常苛刻：**新 prompt 的前缀必须与旧 prompt 完全一致**。  
      因此一个非常可迁移的设计原则是：把静态内容（指令/示例/工具定义）放在前面，把变化内容放在后面。

      原文也列举了一批会导致 cache miss 的“典型变更”：

      - 对话中途改变 `tools` 列表  
      - 切换 `model`  
      - 改变 sandbox 配置 / approval mode / 当前工作目录（cwd）

      它还给了一个真实踩坑：Codex 早期支持 MCP tools 时，曾出现“枚举工具列表顺序不一致”的 bug，导致缓存频繁 miss。更麻烦的是：MCP server 还可能通过 `notifications/tools/list_changed` 动态改变工具列表；如果在长对话中途响应这个变化，也可能触发一次昂贵的 cache miss。

  - type: md
    title: 如何在对话中途变更配置而不破坏缓存：追加新消息，而不是改旧消息
    body: |
      面对“中途配置变化”这种现实需求，原文给了一个很有启发的处理方式：尽量不修改旧输入项，而是追加新的 message 来表达变化，从而尽量保持前缀稳定。

      原文举了两个例子：

      - sandbox 配置或 approval mode 变了 → 追加一条新的 `role=developer` message，沿用原先 `<permissions instructions>` 的格式。  
      - cwd 变了 → 追加一条新的 `role=user` message，沿用原先 `<environment_context>` 的格式。

      这背后的工程动机是：你既满足了“配置真的变了”的语义，又尽量不破坏已有前缀带来的缓存收益。


  - type: md
    title: 上下文压缩：如何让 thread 能继续跑下去
    body: |
      对于codex这种持久场景，你的模型上下文再大也总有用完的时候，因此除了缓存，harness 还必须治理另一个硬资源：上下文窗口（context window）。

      Codex 的总体策略是：当 token 数超过某个阈值，就必须进行一次上下文压缩（context compaction）——用一组更小但“代表性足够”的 items 替换原 `input`，让 agent 仍能理解“到目前为止发生了什么”，并继续后续 turn。

      原文还讲了上下文压缩的演进：

      - 早期：需要用户手动执行 `/compact`，系统用现有对话 + 总结指令去调用一次模型，再把总结作为新 `input`。  
      - 后来：Responses API 提供 `/responses/compact` endpoint，更高效地返回一组可直接替换 `input` 的 items。返回中包含 `type=compaction` 的条目，并带不透明的 `encrypted_content`，用于保留模型对原始对话的“潜在理解”。  
      - Codex：当超过 `auto_compact_limit` 时自动触发 compaction。

      这段的可迁移点是：长任务续航不是“把窗口做大”就结束了，你需要一个能在真实 traces 上运转的压缩机制，并把它当成 harness 的一等能力。

  - type: md
    title: 练习：为你自己的 harness 写一个“缓存友好”的输入策略
    body: |
      选一个你正在做的工具型 agent，回答下面问题并写成 1 页设计笔记：

      1) 你的输入 items/消息里，哪些属于静态前缀（指令、工具定义），哪些属于频繁变化（对话、状态、观测）？  
      2) 当配置在对话中途变化时，你会“修改旧项”还是“追加新项”？为什么？  
      3) 你会如何保证工具列表的顺序稳定（尤其是动态工具来源，比如 MCP）？  
      4) 你会在什么阈值触发 compaction？压缩输出必须保留哪些字段（目标/约束/已做动作/关键产物入口）？

      检验标准：在长对话里，你的系统能否同时做到“可调试（有 trace）+ 成本可控（有缓存策略）+ 可续航（有 compaction）”？

  - type: md
    title: 原文阅读
    body: |
      - 日期：2026-01-23
      - 来源：OpenAI
      - 建议：阅读原文时可以重点对照四段：1) agent loop 的 turn/thread 定义；2) SSE 事件如何被转成内部事件并追加到下一次 input；3) prompt caching 的前缀稳定性与 cache miss 的真实坑（MCP tools 枚举顺序、list_changed）；4) stateless + ZDR 的取舍与 `/responses/compact` 的 compaction 演进。

  - type: url
    title: "原文：Unrolling the Codex agent loop"
    url: https://openai.com/index/unrolling-the-codex-agent-loop
    mode: open

  - type: md
    title: 时效性提示（可能过时）
    body: |
      原文涉及 Codex CLI 与 Responses API 在 2026-01-23 时点的实现细节（具体事件类型、compaction endpoint、参数命名、以及 MCP 集成行为）。这些细节可能会随 SDK/协议演进而变化。
      更可迁移的是 harness 工程原则：把 agent loop 表达成结构化 items 与事件流；围绕 prompt caching 维护前缀稳定；在合规约束下选择 stateful/stateless；并把 compaction 作为长任务的一等续航机制。

  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) 一个用户眼里的“单回合”，内部可能包含多次推理↔工具往返；harness 的职责是执行工具、回喂观测、直到产出 assistant message 作为终止信号。  
      2) harness 往往承担系统级工作：输入 items 组织、工具边界、错误恢复、trace 记录、成本控制（缓存）、上下文管理（compaction）。  
      3) prompt caching 的命中要求前缀完全一致，因此工具列表顺序、模型/沙箱/cwd 变化都可能引发 cache miss；追加新消息表达配置变化是一种更缓存友好的策略。  
      4) Codex 选择 stateless（不使用 `previous_response_id`）来支持 ZDR，并通过 `/responses/compact` 在 token 超阈值时压缩输入续航；这体现的是“合规/隐私/性能/续航”一起权衡的系统设计，而不是单点优化。
