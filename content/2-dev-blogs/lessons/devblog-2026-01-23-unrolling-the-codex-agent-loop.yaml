    mode: open

  - type: md
    title: 时效性提示（可能过时）
    body: |
      原文涉及 Codex CLI 与 Responses API 在 2026-01-23 时点的实现细节（具体事件类型、compaction endpoint、参数命名、以及 MCP 集成行为）。这些细节可能会随 SDK/协议演进而变化。
      更可迁移的是 harness 工程原则：把 agent loop 表达成结构化 items 与事件流；围绕 prompt caching 维护前缀稳定；在合规约束下选择 stateful/stateless；并把 compaction 作为长任务的一等续航机制。

  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) 一个用户眼里的“单回合”，内部可能包含多次推理↔工具往返；harness 的职责是执行工具、回喂观测、直到产出 assistant message 作为终止信号。  
      2) harness 往往承担系统级工作：输入 items 组织、工具边界、错误恢复、trace 记录、成本控制（缓存）、上下文管理（compaction）。  
      3) prompt caching 的命中要求前缀完全一致，因此工具列表顺序、模型/沙箱/cwd 变化都可能引发 cache miss；追加新消息表达配置变化是一种更缓存友好的策略。  
      4) Codex 选择 stateless（不使用 `previous_response_id`）来支持 ZDR，并通过 `/responses/compact` 在 token 超阈值时压缩输入续航；这体现的是“合规/隐私/性能/续航”一起权衡的系统设计，而不是单点优化。
