  - type: md
    title: 时效性提示（可能过时）
    body: |
      原文写作于 2024-03-15，示例围绕“消息列表 vs 自定义格式”展开；而 2025-2026 年一些平台/框架开始更强调 event-stream、items、response events 等更细粒度接口。
      不过可迁移的核心仍然稳定：把“执行历史”当作结构化数据（events），再把它渲染成对模型更友好的输入；并在进入模型前进行过滤、裁剪与必要的错误折叠。

  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) “给 LLM 的输入”本质上是：把你认为重要的历史与状态（what happened so far）组织成模型可用的表示，并明确把控制权收束到下一步决策（what’s the next step）。  
      2) 标准 message 列表的优势是通用与易接入；但当你需要更高的信息密度、更强的可控过滤、更好的可调试性时，自定义格式（尤其是 event log → prompt）会更自然。  
      3) event log 的关键改变是：你保存的是结构化事件，因此可以做“按事件裁剪/折叠/过滤”，而不必在一坨自由文本里硬做 regex 与摘要。  
      4) 最小落地路径通常不是“设计完美格式”，而是先定义 10 个以内的 Event Types（输入、工具、状态、异常），写一个稳定的渲染模板，然后在真实任务里迭代字段与压缩策略。
