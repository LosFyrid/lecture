  - type: md
    title: 核心内容摘要（中文压缩复述）
    body: |
      - 主题：subagents、context isolation、progressive disclosure、skills、tool minimization、multi-model delegation、parallelization
      - 要点：
        - 文章把“多 agent”落到两个一等公民原语：**subagents**（隔离上下文的委派执行）与 **skills**（能力的渐进披露），并把它们与 context rot/上下文膨胀问题直接关联。
        - subagents 的核心价值是解决 context bloat：当主 agent 需要做大量探索性工具调用（网页搜索/文件读取等），把这些步骤都留在主上下文会很快进入“高上下文低智区”；subagent 在自己的窗口里做 20 次工具调用，主 agent 只接收最终总结，从而保持主上下文干净。
        - subagents 适用的四类场景：
          - Context preservation：探索性步骤多、主上下文容易被淹没；
          - Specialization：给不同子 agent 配不同指令/工具，形成分工；
          - Multi-model：对子任务用更小/更快模型，主 agent 用更强模型；
          - Parallelization：子 agent 并行执行降低总体延迟。
        - subagent 配置的关键工程要点（可迁移）：
          - description 要清晰（主 agent 依赖描述选择子 agent）；
          - system prompt 要写出工具使用方式与输出格式，并对长度设限（例如要求 sources、限制 500 words）以减少回传噪音；
          - 工具集要最小化（只给子 agent 完成该子任务所需的工具，避免工具混淆）。
        - skills 的定位是 progressive disclosure：先把 skill 的 name/description 放进上下文；只有当 agent 判断需要时才读取 `SKILL.md` 正文，把具体步骤/命令/脚本加载进当前上下文，避免一开始就把几十个工具/流程塞满窗口。
        - 文章强调二者不是互斥：常见组合是“skills 定义可复用流程，subagents 执行复杂多步工作”；甚至子 agent 也可以按需加载 skills 来控制自己的上下文膨胀。
