title: "Effective context engineering for AI agents"
summary: |
  文章把“prompt engineering”扩展为更适合 agent 的概念：**context engineering**。核心问题从“怎么写一句好 prompt”变成“在每一步推理时，给模型什么样的 context 配置最可能产生期望行为”。
