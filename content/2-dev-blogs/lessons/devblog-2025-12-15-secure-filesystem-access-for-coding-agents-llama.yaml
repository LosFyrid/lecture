  - type: md
    title: 时效性提示（可能过时）
    body: |
      原文的具体实现依赖当时的库与 SDK（例如 AgentFS、某些 MCP wrapper、以及示例代码的 hooks 事件名/参数结构），这些 API 可能随版本变化。
      更可迁移的是边界设计：虚拟工作区隔离真实仓库、文件操作走统一工具面、运行时 hooks 防绕过、非结构化文档在导入阶段先解析成文本、以及用 workflow/harness 管理分步执行与恢复。

  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) 虚拟 FS 保护的是“真实仓库不被破坏”，同时保留 agent 的自治性：它可以在副本里大胆试错，而你只在落盘边界处做更强控制。  
      2) 仅靠 system prompt 很难阻止模型偶发调用内置工具；PreToolUse hook 把软约束变成硬约束，能稳定避免绕过。  
      3) MCP tools 的收益不仅是互操作，还包括：schema/错误语义让模型更易自修复，统一入口便于审计与限流。  
      4) 非结构化文档“先解析再入库”让 agent 读到高质量文本，从源头减少理解退化；解析应被视为工作区准备的一部分，而不是模型推理时的临时补丁。
