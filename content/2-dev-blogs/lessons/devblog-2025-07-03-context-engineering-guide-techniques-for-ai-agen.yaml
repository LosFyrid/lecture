  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) “像 RAG 但不止是 RAG”的意思是：检索只是 context 的一部分；工具定义、工具返回、状态与输出结构同样决定模型能否完成任务。  
      2) 两个核心挑战是 selection 与 fit：先选对资源，再把内容排序/压缩到窗口能承载的形态。  
      3) 结构化信息的价值不止在输出：把长文档先抽字段再入窗，本质上是在做更强的压缩。  
      4) workflow engineering 的作用是把上下文压力分摊到多步：每步输入更小、更容易校验，整体更可靠。  
      5) 一个落地检验是：你能否把“资源目录、选择策略、压缩策略、输出 schema”四件事写成代码或配置，而不是只写在 prompt 里？
