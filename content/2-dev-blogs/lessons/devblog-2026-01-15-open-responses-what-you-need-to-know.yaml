id: devblog-2026-01-15-open-responses-what-you-need-to-know
title: "Open Responses：面向 agent loop 的开放推理/事件接口"
summary: |
  这篇文章介绍 Open Responses：一个面向 agent 工作负载的开放推理标准。它基于 OpenAI 在 2025-03 推出的 Responses API 方向，但把接口格式开源并扩展为社区可共同实现的规范，目标是逐步替代仍占主流的 Chat Completions（回合式聊天格式）。原文强调几个对 agent-builder 很关键的变化：默认无状态（stateless）、reasoning 字段分层（raw/encrypted/summary）、流式输出是“语义事件序列”而非纯文本 delta、区分 Model Providers 与 Routers、以及工具与子 agent loop 的标准化（internal/external tools、max_tool_calls、tool_choice）。
items:
  - type: md
    title: 导入：本课要回答的问题
    body: |
      很多团队在做 agent 时都会遇到一个“不太像模型问题、但会卡死工程”的痛点：你明明已经有了工具调用、流式输出、结构化 JSON、甚至多模态需求，但生态里最通用的接口仍然是 Chat Completions 这种“回合式聊天格式”。

      这篇文章讨论的不是某个具体模型，而是一个更底层的接口标准：如果 agent 已经成为主要推理工作负载，那么我们是否需要一个更适配 agent loop 的推理协议？

      读完后，你应该能回答：

      1) Chat Completion 格式为什么不适合 agentic workflows？它具体缺在哪些结构？  
      2) Open Responses 试图标准化哪些东西：请求结构、响应结构、streaming 语义、reasoning 暴露方式、工具调用循环？  
      3) “语义事件流（semantic events）”相比“文本 delta”为什么更利于可观测性与 UI？  
      4) provider（推理提供方）与 router（路由/编排方）为什么要区分？这对你接入多家 inference provider 有什么意义？

  - type: md
    title: 概念对齐：把接口词汇翻译成工程对象
    body: |
      **Chat Completions（回合式聊天）**  
      以 “messages 列表 → 一段输出文本” 为中心的接口形态。它在聊天场景很好用，但当你需要工具调用、事件流、长任务状态与结构化产物时，往往要靠大量非标准扩展来“补洞”。

      **Responses / Open Responses（响应式接口）**  
      以“一个请求 → 一组 items（消息、工具调用、工具结果、reasoning、结构化输出）”为中心的接口形态，更贴近 agent loop 的真实数据结构。

      **Stateless by default（默认无状态）**  
      服务端不保存会话状态；每次请求都显式携带必要上下文。这更利于隔离与路由，但也要求客户端更会“组装上下文”。

      **Reasoning fields（推理内容分层）**  
      原文把 reasoning item 的可见性分成三类可选字段：
      - `content`：raw reasoning traces（原始推理痕迹）  
      - `encrypted_content`：提供方保护的推理内容（例如不希望暴露原始链路）  
      - `summary`：从 raw traces 净化后的摘要

      **Semantic streaming events（语义事件流）**  
      流式输出不是“不断追加字符串”，而是一个事件序列（例如某类 reasoning delta、某类状态变更、某类 tool call）。这让客户端更容易做可观测与可视化。

      **Model Providers vs Routers**  
      - Provider：真正执行推理的上游（模型在哪跑、怎么解码）  
      - Router：在多个 provider 之间编排请求、做路由与统一入口的中间层

  - type: md
    title: 动机：agent 时代的接口缺口
    body: |
      原文的出发点是一个“生态错配”：

      - agent 的推理负载更像“reason → plan → act”的循环，往往需要：多模态输入、结构化输出、工具调用、长任务状态、以及可观测事件流。  
      - 但 Chat Completion 格式是为“轮次对话”设计的：它天然把输出压扁成一段文本，很难表达“中间发生了哪些工具调用/状态变化/推理阶段”。

      原文认为 Responses API 的方向更适合 agent，但它是封闭的、采用范围有限；因此需要一个开放标准，让社区与不同 inference provider 可以共同实现与互操作。

  - type: md
    title: Open Responses 是什么：基于 Responses API 的开放推理标准
    body: |
      原文对 Open Responses 的定位很明确：它“扩展并开源 Responses API”，让 builder 与 routing provider 能在同一套格式上协作与互操作。

      原文列出几个关键点（这里用工程语言重述）：

      - 默认 stateless，并支持需要时的 encrypted reasoning  
      - 标准化模型配置参数（减少各家 provider 的隐式差异）  
      - streaming 用语义事件建模，而不是 raw text/object delta  
      - 允许 provider-specific 扩展参数，但目标是把成熟能力逐步沉淀进 base spec

      你可以把它理解成：让“agent 所需的接口语义”从各家私有扩展，收敛成一套社区共同语言。

  - type: md
    title: 客户端请求：与 Responses API 接近，但更强调版本与路由
    body: |
      原文给了一个 curl 示例：请求打到一个 proxy endpoint，由它路由到不同 inference providers，但请求/响应都遵循 Open Responses schema。

      其中两个细节值得注意：

      1) **版本头**：例如 `OpenResponses-Version: latest`，让客户端明确自己按哪个版本的 schema 说话。  
      2) **model 字段的表达**：可以包含 provider/路由相关的信息（原文示例里 model 字符串包含具体 provider 路由）。

      这类设计对“长期兼容”很重要：当生态要替代 chat completions 时，版本化与逐步迁移比“一刀切”更现实。

  - type: md
    title: Streaming：语义事件比文本 delta 更适合 agent 可观测
    body: |
      原文强调 streaming 的建模方式发生了变化：它是“语义事件序列”。

      这种设计对 agent-builder 的价值在于：你可以更自然地做三件事：

      1) **把 UI 与状态机写得更明确**：例如长运行工具可以发出明确的 “interpreting/working” 状态，而不是让用户盯着空白等待。  
      2) **把 trace 变成一等公民**：事件流本身就是结构化 trace，你可以落盘、回放、做回归。  
      3) **更细粒度地控制暴露**：reasoning 可以按 raw/encrypted/summary 分层输出。

      原文用 reasoning streaming 做了一个非常直观的对比：

      - 开源权重模型可以流式输出 raw reasoning（例如 `response.reasoning.delta`）  
      - 需要保护推理的模型可以输出摘要（例如 `response.reasoning_summary_text.delta`）

      这让“是否暴露 reasoning、暴露到什么粒度”变成协议层可选项，而不是每家 provider 私有约定。

  - type: md
    title: Tools：internal vs external，以及 provider-side 的 agent loop
    body: |
      原文把工具分成两类：

      - **External tools（外部托管）**：在 provider 之外执行，例如客户端函数、或 MCP servers。  
      - **Internal tools（内部托管）**：在 provider 内部执行，例如某些 provider 提供的文件搜索/网盘集成；模型发起调用、provider 执行并把结果回喂，开发者不必自己编排每一步。

      这一区分对系统设计很重要：它决定了“工具执行的信任边界”在哪里，也决定了你能否把一个多步工作流压缩成“一次请求”。

  - type: md
    title: Sub-agent loops：把多步循环标准化进接口语义
    body: |
      原文把 agentic loop 写成一个重复循环：推理 → 工具调用 → 工具结果回喂 → 继续推理 → 直到完成。

      Open Responses 将这种 loop 形式化，并允许在一次请求里完成多轮工具调用（尤其是 internal tools 场景）。

      客户端仍然保留控制权：原文提到两个关键控制参数：

      - `max_tool_calls`：限制最多工具调用次数，避免无限循环  
      - `tool_choice`：约束哪些工具可被调用（例如 auto / 必须用某个工具 / 禁止某类工具）

      同时，响应会包含中间 items：工具调用、工具结果、reasoning 等，这对调试与审计很关键。

  - type: md
    title: 迁移提示：从 Responses API 到 Open Responses，你需要改什么？
    body: |
      原文的态度比较乐观：如果你已经支持 Responses API，迁移到 Open Responses 的工作量相对小。

      变化主要集中在两处：

      1) **reasoning 的暴露方式**：客户端需要能处理 raw/encrypted/summary 三种字段的组合（以前很多 provider 只给 summary/encrypted）。  
      2) **更丰富的状态与 payload**：事件流更语义化后，你可以选择把这些事件落盘，或用来驱动更清晰的 UI/监控。

      换句话说，Open Responses 把很多“历史上靠私有扩展实现的东西”正规化了；你需要做的是：把数据模型与日志/trace 系统升级到能吃这些结构化事件。

  - type: md
    title: 练习：为你的 agent client 设计一份“事件日志 schema”
    body: |
      如果你要让 agent 真正可调试，Open Responses 这类语义事件流最有价值的地方在于：它逼着你把 trace 结构化。

      练习：写一份你自己的“事件日志 schema”（JSON/YAML 均可），至少包含：

      1) request 元信息：model/provider/router、版本、开始/结束时间、成本信息  
      2) event 序列：message、reasoning（raw/summary/encrypted）、tool_call、tool_result、state_change  
      3) 安全字段：哪些 event 可以落盘，哪些必须脱敏/不记录  

      检验标准：当一次 agent 任务失败时，你能否只靠事件日志复盘“它在哪个环节偏航、调用了什么工具、为什么停不下来”？

  - type: md
    title: 原文阅读
    body: |
      - 日期：2026-01-15
      - 来源：HuggingFace
      - 建议：阅读原文时建议按顺序抓三件事：1) 为什么 chat completions 不适合 agent；2) Open Responses 的四个关键点（stateless、reasoning 分层、语义事件流、可扩展参数）；3) tools 与 sub-agent loop 的标准化（internal/external tools、max_tool_calls、tool_choice、响应包含中间 items）。

  - type: url
    title: "原文：Open Responses: What you need to know"
    url: https://huggingface.co/blog/open-responses
    mode: open

  - type: md
    title: 时效性提示（可能过时）
    body: |
      Open Responses 仍处于快速演进期：字段、事件类型、以及各家 provider 对 reasoning/tools 的支持范围可能会变化。
      更可迁移的是接口方向：用“语义事件 + items 结构”表达 agent loop，把 reasoning 可见性与工具托管边界纳入协议层，使多 provider/多 router 的互操作更可实现。

  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) Chat Completion 的核心短板是结构不足：它把中间过程压扁成文本，不利于工具调用、状态机与可观测；Open Responses 把“agent 真实会发生的 items”作为一等结构。  
      2) 语义事件流能让 UI/监控/trace 更清晰：你不只看到一段文本，而能看到“发生了哪些 tool calls/状态变更/推理阶段”。  
      3) reasoning 分层（raw/encrypted/summary）让“暴露多少推理”成为协议层可选项，既支持开源模型的可见性，也兼容需要保护推理的 provider。  
      4) provider/router 区分 + 标准化 sub-agent loop，让你更容易在统一端点上编排多家推理提供方，并用 max_tool_calls/tool_choice 把循环风险与工具边界纳入请求参数。
