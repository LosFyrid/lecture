title: "Open Responses: What you need to know"
summary: |
  出发点：生态仍大量使用 Chat Completions 这种“回合式聊天接口”，但 agent 工作负载需要更丰富的结构（多模态、结构化输出、工具调用与事件流）；Responses API 方向正确但封闭，因此提出 Open Responses 作为开放推理标准。
items:
