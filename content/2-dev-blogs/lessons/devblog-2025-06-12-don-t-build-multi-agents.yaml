id: devblog-2025-06-12-don-t-build-multi-agents
title: "为什么默认不做 multi-agent：一致性成本与上下文传递难题"
summary: |
  用一个具体失败故事解释 multi-agent 的常见脆弱点：上下文传递不完整与隐含决策冲突会把“并行节省的时间”变成“合并与返工的时间”；把原文的两条原则（共享完整 trace、把隐含决策显式化）改写成可落地的系统设计选项。
items:
  - type: md
    title: 导入：本课要回答的问题
    body: |
      multi-agent 很诱人：看起来只要把任务拆开并行跑，就能更快、更强。但很多团队第一次上 multi-agent 的体验反而是：速度上去了，结果更不稳定了，调试也更痛苦。

      本课希望把这种“为什么会变脆”的原因拆清楚，并回答几个更可操作的问题：

      1) “一致性成本”指的是什么？它为什么会吞掉并行带来的收益？  
      2) 为什么“把原始任务描述复制给每个子 agent”仍然会失败？  
      3) 什么是 agent trace？为什么原文强调要共享 trace，而不是只共享几条消息？  
      4) “行动携带隐含决策”是什么意思？隐含决策冲突在工程上会如何表现？  
      5) 如果不做并行 multi-agent，还有哪些办法能把长任务做得更稳、更长？

  - type: md
    title: 概念对齐：multi-agent、trace 与隐含决策
    body: |
      **单线程（single-threaded）线性 agent（作为基线）**  
      这里的“单线程”不是 CPU 线程概念，而是决策流：一个 agent 沿着一条连续的对话与行动轨迹往前走，所有关键决策都在同一条上下文里累积。

      **multi-agent**  
      系统里存在多个 agent，每个 agent 都可能独立做“观察 → 决策 → 行动”的循环。它们可以并行，也可以分阶段运行。并行只是其中一种形态，但也是最容易引入不一致的一种。

      **agent trace（轨迹）**  
      trace 可以理解为“任务执行的完整记录”，通常包含：
      - 对话消息（用户/系统/模型输出）  
      - 工具调用请求与参数（tool calls）  
      - 工具返回结果（observations）  
      - 关键状态更新（例如写入了哪些文件、选定了哪些约束、做过哪些澄清）

      之所以强调 trace，是因为在真实系统里，“决定怎么做”经常发生在工具调用与中间步骤里，而不只在最初的任务描述里。

      **context passing（上下文传递）**  
      指把哪些信息从一个 agent 传给另一个 agent：是只传任务描述？还是传到目前为止的完整 trace？还是传一份结构化的状态快照（state snapshot）？
      传递粒度越小，不一致风险越高；传递粒度越大，token 成本与实现复杂度越高。

      **隐含决策（implicit decisions）**  
      很多“看起来只是行动”的步骤，其实已经做出了选择：风格、命名、框架、数据口径、默认假设等。  
      这些选择如果不被显式记录，很容易在并行协作时产生冲突。

  - type: md
    title: 一个失败故事：为什么“拆两个子任务”就足以出问题
    body: |
      原文用一个非常直观的例子说明 multi-agent 的脆弱性：

      - 总任务：做一个 Flappy Bird 克隆。  
      - 子任务 1：做背景与管道、碰撞盒。  
      - 子任务 2：做一只可上下移动的小鸟。

      并行后出现的问题不是“某个子 agent 完全做错”，而是更常见的那类偏差：  
      子任务 1 做出的背景像另一个游戏的风格；子任务 2 的小鸟不像统一的游戏资产、运动学也不匹配。最终主 agent 面对的是“两个都各自完成了，但合起来不成体系”的合并地狱。

      这个例子看起来有点刻意，但它抓住了真实工程里的共同点：  
      大多数任务都有很多层未写出的细节（视觉风格、数据口径、边界条件、代码结构、依赖版本）。并行拆分会把这些细节变成“需要显式对齐的协议”，否则不同 agent 会在缺省处各自做决定，最后把冲突固化进产物里。

  - type: md
    title: 根因 1：上下文切断（context passing 不完整）
    body: |
      第一类脆弱性来自：子 agent 在做决定时看不到“为什么这样拆分、前面已经决定了什么”。

      直觉上似乎可以通过“把原始任务描述也复制给每个子 agent”来解决误解，但真实系统里，关键上下文往往在后续步骤里逐步形成：

      - 对话多轮之后才出现的约束（例如“只用某个库”“必须兼容某个版本”“必须有可追溯引用”）  
      - 工具调用带来的新信息（例如检索到的资料改变了问题口径）  
      - 主 agent 在拆分前已经做过的取舍（例如优先做可运行原型还是先把资产体系定下来）

      当这些信息没有被显式打包并传递时，子 agent 即使“理解了自己的子任务”，也很难保证与主线的决策一致。

      这对应原文的第一条原则：共享上下文时，优先共享完整的 trace，而不是只共享几条消息。它不是为了“让子 agent 更聪明”，而是为了让子 agent 的行动建立在同一组已决策信息之上。

  - type: md
    title: 根因 2：行动携带隐含决策（冲突会被固化到产物里）
    body: |
      第二类脆弱性来自：并行不仅带来“不同结论”，还会带来“不同默认选择”。

      所谓“行动携带隐含决策”，可以用几个工程上更常见的例子理解：

      - 写代码时选择了某个框架/目录结构/命名习惯，这些选择会影响后续所有文件。  
      - 写报告时选择了某种口径与章节结构，后续补充内容会被迫沿着这个结构生长。  
      - 做检索时默认了某个时间范围或数据来源，后续结论会在这个默认假设上被“建起来”。

      当两个子 agent 并行行动时，它们会在这些未显式说明的地方做出不同选择。更麻烦的是：这些选择一旦写进文件、代码、表格或报告，就不再是“讨论一下就能统一”的文字差异，而是会触发大量返工与合并冲突。

      这对应原文的第二条原则：隐含决策如果冲突，结果往往很糟。把它翻译成系统设计语言，就是：  
      **越是会把决定固化到外部世界（写文件/改代码/改状态）的动作，越需要在更集中、更一致的上下文里做出。**

  - type: md
    title: 把原则变成系统设计：三条收敛路线（从简单到复杂）
    body: |
      原文的语气比较保守，但它背后的建议可以被翻译成三种“收敛路线”，每条路线解决的问题不同、成本也不同：

      - **路线 A：保持单线程决策流**  
        用一个线性 agent 解决尽可能多的问题，让关键决策天然在同一条上下文里累积。它的优势是：一致性成本低、调试链路短、复现更容易。

      - **路线 B：引入子 agent，但限制其职责与并行度**  
        子 agent 更像“专门的调查员/查证员”：负责回答一个定义清楚的问题，输出结构化结果与引用；而不是在并行分支里同时写代码或做大量会固化隐含决策的行动。  
        这种做法的收益常常是“减轻主线上下文负担”，而不是“追求并行吞吐”。

      - **路线 C：真正并行的 multi-agent，但把它当作分布式系统来治理**  
        如果并行收益非常明确（例如大量可独立检索的子问题），那么并行 multi-agent 需要配套的工程机制：共享状态的真相源、决策日志、冲突处理策略、artifact 管道与可观察性。  
        这条路线能带来覆盖与吞吐，但通常也会把一致性成本显著抬高。

      三条路线不是互斥的，更像常见的演进路径：先把路线 A 做稳，再用路线 B 扩展上下文容量；只有在“任务结构真的适合并行”时才会考虑路线 C。

  - type: md
    title: 长任务的另一条路：压缩“决策历史”，而不是分裂决策者
    body: |
      线性 agent 的天然瓶颈是 context window：任务越长，历史越多，越容易溢出。

      原文给出一个有启发的升级方向：引入一个专门负责“压缩历史”的模型，把行动与对话压缩成关键细节、关键事件与关键决策，再把这份压缩结果作为后续上下文。

      关键点在于：这里的压缩目标不是“把字变少”，而是“把后续需要继续执行的状态保留下来”。一份面向 agent 的压缩，通常需要至少包含：

      - 已确认的目标与约束（哪些不可变、哪些可变）  
      - 已做出的关键选择（框架/口径/风格/版本等）  
      - 已产出的 artifacts 与它们的入口（文件、表格、报告）  
      - 仍未解决的分歧与风险点

      原文也强调这件事不容易：如果压缩丢掉了关键决策，后续行为会变得漂移；如果压缩保留得太多，又回到 token 负担过重的问题。这也是为什么有些团队会把“压缩器”当成一等模块去打磨，甚至在特定领域投入额外训练。

  - type: md
    title: 什么时候考虑并行：从“可合并性”与“决策集中度”出发
    body: |
      这篇文章反复围绕的核心，其实是一个很工程化的问题：并行之后，结果能不能可靠地合并？

      一个可迁移的判断维度是“可合并性（mergeability）”：

      - 如果 workers 的产出主要是“互相独立的证据块”（例如不同信息源的检索结果、不同方向的文献列表），并且合并规则相对清晰（去重、对齐字段、补洞），并行更容易成立。  
      - 如果 workers 的产出会大量固化隐含决策（例如并行写代码、并行改同一份状态），那么合并往往不是技术上的 merge，而是语义上的再设计；一致性成本会迅速上升。

      从这个角度看，multi-agent 并不是一个二元选择，而是一个连续谱：  
      从“线性 agent + 偶尔调用一个只回答问题的子 agent”，到“并行 workers + 严格契约 + artifact 管道”，中间有很多可调的设计点。

  - type: md
    title: 常见误区：读完后可以用来做自检
    body: |
      - **把 multi-agent 当成纯性能优化**：只讨论吞吐与并行度，不讨论一致性成本与合并机制。  
      - **上下文只传任务描述**：忽略了关键决策往往藏在 trace 与工具结果里。  
      - **让并行分支同时“写世界”**：并行写代码/写状态会把隐含决策冲突固化到外部产物，返工成本很高。  
      - **没有决策日志与证据字段**：最后只能靠聊天回忆“当时为什么这么做”，复现与回归都很困难。

  - type: md
    title: 练习：设计一份最小“决策日志（decision log）”
    body: |
      练习目标：把“隐含决策”变成系统里的显式对象，从而降低并行带来的语义冲突。

      以一个会写文件/写代码的任务为例，写一份最小 decision log 模板（YAML/JSON 形式均可），至少包含：

      - decisions：每条决策的内容、时间点、影响范围（例如风格/依赖/数据口径）  
      - rationale：为什么这么选（可以很短，但要能解释取舍）  
      - artifacts：哪些产物体现了这个决策（文件路径/报告章节/表格）  
      - invariants：后续不希望被改变的硬约束

      然后思考：如果把这份 decision log 传给一个新启动的 worker，它是否能在不读取完整历史的情况下继续推进且不偏航？

  - type: md
    title: 原文阅读
    body: |
      - 日期：2025-06-12
      - 来源：Cognition
      - 建议：阅读时可以重点抓两条原则（共享完整 trace、显式化隐含决策），并对照文中的 Flappy Bird 例子思考：在自己的任务里，“隐含决策”通常藏在哪些动作里？

  - type: url
    title: "原文：Don't Build Multi-Agents"
    url: https://cognition.ai/blog/dont-build-multi-agents
    mode: open

  - type: md
    title: 时效性提示（可能过时）
    body: |
      原文对 2025 年的并行 multi-agent 给出偏保守的判断：它认为跨 agent 的上下文传递与决策对齐在当时仍很难做稳。
      随着模型能力、编排工具与工程实践演进，这个判断的“适用范围”可能变化；但一致性成本与隐含决策冲突这两类问题，往往不会因为换模型就自动消失。

  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) “一致性成本”可以理解为：为了让多个 agent 在同一套约束与决策下工作，需要额外付出的工程代价（传递更完整上下文、维护共享状态、处理冲突、返工与回滚）。  
      2) “复制原始任务描述仍会失败”的根因在于：关键决策往往出现在多轮对话与工具调用之后，子 agent 不看见这些决策就会在缺省处自行补全。  
      3) 强调共享 trace，是为了把“任务为什么这样做”这类信息也共享出去，而不只共享表面文字。  
      4) “行动携带隐含决策”意味着：并行分支越早开始写外部产物，越容易把冲突固化进文件/代码/状态，导致合并成本上升。  
      5) 如果目标是把任务做得更长、更稳，一种替代路线是：把“历史压缩成可继续执行的状态”（目标/约束/决策/artifacts/未决问题），而不是把决策者分裂成多个并行分支。
