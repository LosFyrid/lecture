  - type: md
    title: 时效性提示（可能过时）
    body: |
      文中使用的具体模型（Gemini 3 Flash）、上下文窗口大小、以及作者实现的工具/栈（Qdrant、embedding provider、解析器）可能会随时间变化。
      更可迁移的是实验设计与趋势判断：小规模高保真阅读更容易受 chunking/召回影响；规模变大时，固定路径的检索管线（RAG）在延迟与扩展性上更占优；filesystem exploration 需要配合更强的上下文工程（例如 compaction）才能持续运行。

  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) fs-explorer 与 RAG 的核心差别不在“谁更聪明”，而在“信息如何进入模型”：RAG 依赖 chunking+召回，fs-explorer 依赖多轮工具交互与更完整语境。  
      2) 小规模任务里 fs-explorer 可能更准，是因为它更容易让模型看到整篇语境；但它更慢，因为需要更多轮 LLM 调用与工具往返。  
      3) 规模扩到 100/1000 后，RAG 更容易扩展，延迟优势更明显；fs-explorer 需要元数据筛选与 compaction 等工程才能不在规模上崩溃。  
      4) 最可靠的选型方式是做对照实验：同时度量延迟、质量与成本，并在“规模扩大”这一维度上观察趋势是否反转。
