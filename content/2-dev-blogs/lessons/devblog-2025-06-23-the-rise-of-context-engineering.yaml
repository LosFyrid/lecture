id: devblog-2025-06-23-the-rise-of-context-engineering
title: "Context Engineering 的定义与诊断：context failure vs model failure"
summary: |
  给出一个面向工程的定义：context engineering 是构建一个“动态系统”，在合适的时间用合适的格式把合适的信息与工具交给模型，使任务对模型来说是“可合理完成的（plausibly accomplishable）”。本课把这一定义拆开讲清，并把“是不是模型不够强”改写成一套更可执行的诊断方法：先排查 context failure，再讨论 model failure。
items:
  - type: md
    title: 导入：本课要回答的问题
    body: |
      很多 agent 项目会遇到一个反复出现的现象：效果不稳定时，团队第一反应是“换更强模型 / 改 prompt”。但往往改了半天，问题并没有真正被定位：到底是模型能力不够，还是系统没有把任务变成“模型有机会做对”的形式？

      这篇文章把这个问题收敛成一个非常工程化的定义与诊断框架。

      带着这些问题阅读会更有抓手：

      1) context engineering 的工作对象到底是什么：一句 prompt，还是一个运行时输入系统？  
      2) 为什么作者强调它是“动态系统”？动态在哪里？  
      3) “right information / right tools / right format” 分别指什么？它们如何导致不同的失败模式？  
      4) “任务是否 plausibly accomplishable（可合理完成）”为什么是一个很好的诊断问题？它如何区分 context failure 与 model failure？  

  - type: md
    title: 概念对齐：把定义中的关键词翻译成可操作检查项
    body: |
      **Context engineering（上下文工程）**  
      不是“写得更巧的 prompt”，而是：在每次调用模型前，动态组装一份输入，让模型在当前约束下更可能完成任务。

      **Context failure vs model failure**  
      - context failure：模型没被给到足够的信息/工具，或信息组织方式不利于它做对；这类问题的修复通常是“补信息、补工具、改格式、改输入组装逻辑”。  
      - model failure：在信息与工具都合理齐全的前提下，模型仍做错；这类问题才更像“换模型、加验证、改分解、加约束”。

      **Dynamic system（动态系统）**  
      任务输入不是常量：用户输入、历史对话、工具调用结果、外部数据都会在运行时出现；因此“把什么放进模型输入、以什么格式放、放多少”也必须随状态变化。

      **Format matters（格式很重要）**  
      模型并不是“读了就懂”。同一份信息，结构化、短而清晰的表达，往往比一大坨 JSON 更可用；工具 schema、参数命名、错误返回的可读性都会影响模型能否正确使用工具。

      **Plausibly accomplishable（可合理完成）**  
      一个非常实用的问题：在当前输入与工具条件下，这个任务对模型来说“有没有可能做对”？  
      如果答案是否定的，继续调 prompt 往往是在用模型弥补系统缺口。

  - type: md
    title: 把定义拆开：为什么这不是一句口号，而是一份工程规范
    body: |
      文章给出的定义是：

      > context engineering 是构建动态系统，在正确的时间以正确的格式把正确的信息与工具交给 LLM，使其能够“可合理地完成任务”。

      这句话可以被拆成 6 个可执行的检查点（每个点都对应一类常见失败）：

      **1) 它是“系统”**  
      context 不只来自开发者写的 prompt，还来自用户、历史、工具调用结果、外部数据源。只要你的 agent 不是一次性问答，就一定是在跑一个“输入管道”。

      **2) 它必须“动态”**  
      同一个任务在不同阶段需要的信息不同：早期需要澄清目标与约束，中期需要证据与工具反馈，收尾需要产物与验收标准。静态 prompt 很难覆盖这些阶段差异。

      **3) 需要“正确的信息”**  
      模型不是读心术：缺少关键约束（时间范围、口径、单位、允许的动作）时，模型往往会用默认假设补全——而这些默认假设未必符合你的系统需求。

      **4) 需要“正确的工具”**  
      任务本身如果需要访问外部世界（检索、写入、执行），不给工具就相当于让模型凭空完成。很多“模型做错”其实是“系统没有把该做的动作变成可调用工具”。

      **5) 格式决定可用性**  
      工具返回如果是巨大 blob，模型不仅读起来贵，还更容易抓错重点；相反，短而结构化的错误信息往往能让模型更快自修复。

      **6) 它是否 plausibly accomplishable？**  
      这是一个把“玄学调参”拉回工程诊断的关键问题：  
      - 如果任务在信息论意义上就不够（没给关键信息/没给必要工具），那更强模型也只能“更自信地猜”。  
      - 如果任务信息充足且格式合理，模型仍错，才更像能力或推理链问题。

  - type: md
    title: 诊断：把“模型不行”改写成一个可排查的流程
    body: |
      文章给出的一个重要价值，是把 agent 失败拆成两类，并提示它们有不同的修复路径。

      你可以用一个非常粗但实用的诊断顺序：

      **第一步：检查是否 plausibly accomplishable（可合理完成）**  
      - 模型是否拿到了完成任务所需的关键信息？（约束/口径/输入数据）  
      - 模型是否拿到了完成任务所需的工具？（检索/执行/写入）  
      - 工具是否真的可用？（schema 清晰、错误可读、权限允许、返回值可消费）

      **第二步：如果可合理完成，再区分是“信息组织问题”还是“推理问题”**  
      - 如果失败集中在工具调用：很可能是 tool schema/格式/路由问题  
      - 如果失败集中在长任务漂移：很可能是上下文组装/压缩/记忆选择问题  
      - 如果信息与工具都齐全且可用，仍出现稳定错误：再考虑模型能力、分解方式、验证机制

      这套顺序的好处是：它把“换模型”放到了更后面，先把最常见也最可控的系统问题排干净。

  - type: md
    title: Format matters：为什么短错误比大 JSON 更能帮模型自修复
    body: |
      文章用了一个简单但非常常见的对比来说明“格式”的重要性：

      - 工具返回一大坨 JSON：字段多、噪声多、模型需要自己找重点；一旦抓错字段，就会沿着错误前提继续推理。  
      - 工具返回短而清晰的错误：告诉模型“哪里错了、下一步该怎么改”，模型更容易在下一轮自修复。

      这背后隐含的工程要求是：工具不仅要“能跑”，还要“能教模型怎么用”。  
      schema、参数命名、错误语义，都是 context engineering 的组成部分。

  - type: md
    title: 把框架落到你的系统：三件能立刻做的事
    body: |
      文章后半部分用自家工具（框架与可观测平台）做例子，但其中可迁移的点可以抽象成三件事：

      **1) 让输入可见（trace inputs）**  
      你需要能看到“模型到底收到了什么”：不仅是最后的 prompt 文本，还包括工具列表、工具返回、压缩后的摘要、被选中的记忆。

      **2) 让输入可控（control assembly）**  
      把“组装输入”当作一等模块：哪些步骤先跑、哪些数据源先查、哪些字段写进 state、哪些只留在环境里。

      **3) 让失败可归因（separate failure modes）**  
      每次失败尽量回答：是信息缺失、工具不可用、格式不友好、还是推理链断裂？  
      只有能归因，才谈得上稳定迭代。

  - type: md
    title: 常见误区：读完后可以用来做自检
    body: |
      - 把 prompt 当成唯一杠杆：反复改措辞，但不检查“模型是否拿到必要信息/工具”。  
      - 只看最终回答，不看输入：没有 traces 时，很难判断是 context failure 还是 model failure。  
      - 工具返回不讲错误语义：返回巨大 blob，让模型自己猜怎么修；结果是“失败不可恢复”。  
      - 把“不可完成的任务”当成模型问题：实际上可能是权限、数据源、接口契约没准备好。

  - type: md
    title: 练习：为你的 agent 写一份“plausibly accomplishable”检查单
    body: |
      选一个你正在做的 agent 任务，写一个最小检查单（可以是一页纸），至少包含：

      1) 关键信息：完成任务需要哪些硬约束？（时间范围、单位、口径、允许的动作）  
      2) 必要工具：缺哪一个工具就无法完成？（检索/执行/写入）  
      3) 工具契约：每个工具成功/失败时返回什么？失败信息是否足够短且可行动？  
      4) 输入组装：每一轮把哪些 state 字段放进模型输入？哪些信息只留在窗外？  

      写完后，用它去解释一次失败案例：你能否把失败归因到 checklist 的某一项？如果不能，说明你的系统还缺少可观测或缺少明确契约。

  - type: md
    title: 原文阅读
    body: |
      - 日期：2025-06-23
      - 来源：LangChain
      - 建议：阅读原文时可以逐段对照它对定义的拆解（system / dynamic / right information / right tools / format / plausibly accomplishable），并留意它如何用“失败原因分流”来解释为什么 context engineering 比 prompt engineering 更像一等工程能力。

  - type: url
    title: "原文：The rise of \"context engineering\""
    url: https://blog.langchain.com/the-rise-of-context-engineering
    mode: open

  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) context engineering 更像“输入系统工程”：它关心的是运行时如何组装输入，而不是一句静态 prompt。  
      2) “动态”指的是：随着状态变化，你需要改变输入的组成与格式；把所有信息永远塞进 prompt 往往会带来新的失败模式。  
      3) right information / right tools / right format 是三条不同的修复路径：补信息、补工具、改格式（尤其是工具 schema 与错误语义）。  
      4) plausibly accomplishable 是一个很好的诊断问题：如果在当前上下文与工具条件下就不可能做对，那么更强模型也只会更自信地猜。  
      5) 如果要把这篇文章落到代码里，一个直接的起点是：记录并展示“模型收到的输入”，并把“输入组装逻辑”当作可测试模块，而不是散落在 prompt 里的经验做法。
