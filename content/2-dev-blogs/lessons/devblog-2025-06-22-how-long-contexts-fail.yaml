id: devblog-2025-06-22-how-long-contexts-fail
title: "长上下文失败模式词典：poisoning / distraction / confusion / clash"
summary: |
  把“长上下文”从一个容量问题，改看成一个可靠性问题：当你把历史、工具、文档和中间尝试都塞进 prompt，系统会出现四类常见失败（poisoning / distraction / confusion / clash）。本课用具体例子解释它们如何发生、在 agent trace 里通常长什么样，以及如何用 context engineering 做缓解。
items:
  - type: md
    title: 导入：本课要回答的问题
    body: |
      很多新人会把“更长的 context window”理解成更强的记忆、更好的 agent：既然能塞进 100k/1M tokens，那就把所有工具、所有文档、所有历史都放进去，让模型自己搞定。

      这篇文章的核心提醒是：**长上下文并不自动带来更好表现**；相反，过载的上下文会让 agent 以多种方式“看起来在努力，但越跑越偏”。

      读这节课时，可以带着下面问题：

      1) 为什么“多放点上下文”会让输出更差？它差在“信息缺失”，还是差在“信息太多”？  
      2) 四种 context failure（poisoning / distraction / confusion / clash）分别是什么意思？它们在 trace 里通常有哪些信号？  
      3) 对 agent 系统来说，哪些内容最容易把上下文带坏：工具输出、子 agent 总结，还是模型早期的错误尝试？  
      4) 工程上有哪些可迁移的缓解手段：压缩、JIT 检索、动态工具加载、隔离（quarantine）分别解决什么问题？  

  - type: md
    title: 概念对齐：先把“四种失败”说清楚
    body: |
      这篇文章最有用的地方，是把“长上下文会变差”拆成四种不同的失败机制。为了避免把它们混成一句空话，这里先用可操作的方式定义：

      **Context Poisoning（上下文投毒）**  
      错误信息（幻觉、误解析、旧数据）进入上下文后，被后续步骤当成“事实”反复引用，导致错误不断被放大；而且越往后越难纠正，因为错误已经渗透进目标、计划或关键中间结论。

      **Context Distraction（上下文分心）**  
      上下文变得很长时，模型会过度依赖历史片段（“照着以前的做法重复”），反而更少使用训练中学到的通用策略去综合新计划；在 agent 场景里，常表现为卡在重复动作或低价值循环里。

      **Context Confusion（上下文混淆）**  
      上下文里出现大量“看起来相关但其实多余”的信息（最典型是工具太多、文档太多），模型会把它们当作需要注意的信号，导致错误调用工具、抓错资料、输出变得不聚焦。

      **Context Clash（上下文冲突）**  
      上下文里出现互相矛盾的说法、约束或中间答案；模型在冲突里做推理时容易被早期错误牵引，最终输出受到“旧假设残留”的影响。

      你可以把这四个词当作一个 debug 词典：当 agent 结果异常时，先判断更像哪一类，再决定优先修哪条链路（压缩、隔离、工具路由、证据回溯等）。

  - type: md
    title: 为什么长上下文容易让人误判：容量 ≠ 注意力
    body: |
      “上下文窗口更大”带来的第一个错觉是：既然能放得下，那模型就能用得好。

      文章用了一个非常工程化的提醒来戳破这个错觉：**只要某段信息被放进上下文，模型就需要在推理时为它分配注意力**。  
      这意味着：

      - 把工具定义放进去，会占用注意力；工具越多，负担越大。  
      - 把历史对话放进去，会占用注意力；历史越长，噪声与早期错误也越容易残留。  
      - 把“探索性尝试”和“草稿推理”放进去，同样会占用注意力；如果其中包含误假设，它还可能直接影响最终结论。

      agent 场景是“上下文过载”的高发区：多轮对话 + 多次工具调用 + 多来源检索 + 可能的子 agent 输出，会在不知不觉间把 prompt 变成一个混杂的日志堆。

  - type: md
    title: 失败模式 1：Context Poisoning（错误如何被写进“事实”）
    body: |
      文章用一个游戏型 agent 的案例解释了 poisoning 的典型形态：当模型对环境状态产生幻觉，并把这个幻觉写进了 context 的“目标/总结/状态”区域后，后续就会围绕一个不存在的事实继续行动。

      在工程上，poisoning 往往不是“某一句话错了”，而是“错的东西进入了高权重位置”：

      - 写进了任务目标（goal）或硬约束（invariants）  
      - 写进了全局状态（state）  
      - 写进了后续会被反复引用的总结（summary/compaction）  

      你在 trace 里常会看到类似信号：

      - 后续多轮都在引用同一个错误前提（“因为 X，所以继续做 Y”），即使工具结果已经暗示 X 不对  
      - 行为出现执念（不断尝试修复一个不存在的问题、追逐一个无法达成的目标）

      可迁移的缓解直觉是：把“推测”与“事实”分开存放，避免把未验证的内容写进高权重的 state/summary；当错误一旦进入 summary，纠错会变得更像“重写历史”。

  - type: md
    title: 失败模式 2：Context Distraction（为什么会开始重复动作）
    body: |
      distraction 的关键词是：上下文太长后，模型更像在“复读历史”，而不是“综合计划”。

      文章引用了一个观察：在某些 agentic 设置里，当上下文增长到很长（例如超过 100k tokens），agent 会更倾向重复历史动作，而不是产生新的策略。  
      文章也提醒：对小模型来说，“分心上限（distraction ceiling）”往往更低——并不是把窗口填满才会退化。

      从工程角度理解，这种退化通常来自两件事叠加：

      - **历史的吸引力**：历史里有大量看起来可复用的步骤（尤其是工具调用序列），模型容易把它当成“捷径”。  
      - **长任务的噪声**：当上下文里同时存在多条未收敛尝试，模型很难判断哪些是“已验证的稳定策略”，哪些只是早期探索。

      一个实用的缓解方向是：把上下文改造成“可继续执行的状态”，而不是“完整日志”。也就是在需要时进行压缩/阶段性总结，把历史动作压成决策与证据入口，让下一轮输入更像一份干净的工作计划。

  - type: md
    title: 失败模式 3：Context Confusion（工具太多时会发生什么）
    body: |
      confusion 在工具型 agent 里非常常见：你把一堆工具定义塞进 prompt，希望模型“自由选择”，结果模型要么选错工具，要么在不该调用工具时也要调用。

      文章引用了 Berkeley Function-Calling Leaderboard 的一个现象：当提供多个工具时，模型整体表现会下降；并且即使“没有任何工具相关”，模型也可能仍然错误地发起工具调用。  
      它还引用另一个例子：在一个包含 46 个工具的 benchmark 上，小模型在上下文并未超限的情况下仍会失败；当工具数量减少到 19 个时反而成功。

      把这段现象翻译成系统设计语言，就是一句话：

      **工具越多，不是“能力越强”，而是“路由问题越难”。**

      常见的缓解手段通常不是“让模型更努力”，而是：

      - 动态工具加载：只把本轮真正可能相关的少量工具放进上下文  
      - 两阶段决策：先做 tool selection（选工具/不选工具），再做 tool call（填参数/执行）  
      - 把工具返回结构化，减少无关 blob 重新污染上下文

  - type: md
    title: 失败模式 4：Context Clash（为什么多轮对话会变得更难）
    body: |
      clash 的关键不是“信息多”，而是“信息互相矛盾”。

      文章引用了一项研究：把原本单轮 benchmark prompt 的信息拆到多轮对话中（信息总量相同），模型表现显著下降（报告的平均下降为 39%，某些模型下降更大）。  
      一个解释是：模型在早期轮次会基于不完整信息提前做出假设并尝试给出答案；这些错误尝试残留在历史里，会影响后续最终回答。

      这对 agent-builder 是一个很具体的风险提示：agent 的上下文不仅来自“用户给的信息”，还来自：

      - 模型早期的错误尝试  
      - 工具返回的噪声片段  
      - 子 agent 的总结（可能口径不同、证据不足）  
      - 来自不同来源的文档片段（可能互相冲突）

      如果系统没有把这些内容分层（已验证/未验证、硬约束/软假设、事实/推测），冲突会被直接堆叠在同一层上下文里，最终体现在输出质量上。

  - type: md
    title: 对 agent 系统的含义：长上下文更适合做什么？
    body: |
      文章给了一个非常“收敛”的建议：对长上下文保持谨慎，尤其当你的任务不是这两类：

      1) **Summarization（总结/压缩）**：把长历史压成后续可执行的状态与证据入口。  
      2) **Fact retrieval（事实检索）**：用长窗口承载大量证据，再从中抽取与核对事实。

      换句话说，长上下文更像一个“原料池”，而不是一个“无脑把一切塞进去就更强”的升级件。  
      agent 的关键工程能力仍然是：选择、排序、压缩、隔离——让每一轮输入都更像“刚好够用的工作台”。

  - type: md
    title: 工程化落地：把失败模式变成可修的机制
    body: |
      读完这篇文章后，一个可迁移的落地方式是：把四类失败模式各自绑定到一条“修复杠杆”。

      - poisoning 更像“错误写进了高权重 state”：优先做 **证据回溯/状态校验/把推测与事实分层**  
      - distraction 更像“历史过长导致复读”：优先做 **分阶段 compaction/计划外置/减少历史噪声**  
      - confusion 更像“工具路由失败”：优先做 **动态工具加载/两阶段 tool selection/工具返回结构化**  
      - clash 更像“冲突信息堆叠”：优先做 **隔离未验证内容/冲突检测/决策日志（哪些口径已选定）**

      这些手段不要求绑定某个供应商或框架，它们更像是 agent runtime 的基本能力：让上下文成为可控资源，而不是自然增长的日志堆。

  - type: md
    title: 常见误区：读完后可以用来做自检
    body: |
      - 把长上下文当作“免设计”的捷径：认为只要窗口够大，就不需要 context engineering。  
      - 工具一次性全加载：把几十个工具定义长期塞进 prompt，希望模型自己学会路由。  
      - 把探索性尝试写进主线：让早期草率答案与错误假设长期残留在上下文里。  
      - 压缩只追求“更短”：总结时丢掉关键口径、决策与证据入口，导致后续漂移更隐蔽、更难纠错。

  - type: md
    title: 练习：把“失败模式词典”变成你的回归用例
    body: |
      练习目标：不是背四个英文词，而是把它们变成可复现、可回归的测试。

      1) 选一个你正在做的工具型 agent，构造一个 **confusion** 用例：给它一堆相似工具，看看它是否会在“无相关工具”时仍然调用。  
      2) 构造一个 **clash** 用例：在多轮对话里先给一个误导性的早期假设，再在后续给出纠正信息，观察系统能否真正“改口径而不是继续复读”。  
      3) 为你的 compaction/summary 模板写一个自检清单：总结里是否保留了目标、硬约束、已选口径、证据入口、未决问题？

  - type: md
    title: 原文阅读
    body: |
      - 日期：2025-06-22
      - 来源：DBreunig
      - 建议：阅读原文时可以重点对照四个 failure mode 的原始定义与例子（poisoning/distraction/confusion/clash），并留意作者对“工具太多”与“多轮分片 prompt”这两类实证现象的解释。

  - type: url
    title: "原文：How Long Contexts Fail"
    url: https://www.dbreunig.com/2025/06/22/how-contexts-fail-and-how-to-fix-them.html
    mode: open

  - type: md
    title: 时效性提示（可能过时）
    body: |
      文中引用的具体模型分数、阈值与排行榜位置会随模型迭代而变化。
      更可迁移的是失败模式本身，以及它们对应的工程手段（压缩、动态工具加载、隔离与证据回溯）。

  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) “多放上下文会变差”的关键原因往往不是信息不足，而是注意力被噪声与早期错误占用；对 agent 来说，上下文更像不断增长的执行日志。  
      2) 四种失败模式可以用一个粗粒度自检来区分：poisoning（错误被写进高权重 state）、distraction（复读历史动作）、confusion（工具/资料路由失败）、clash（冲突信息堆叠）。  
      3) 在真实系统里，最容易把上下文带坏的三类内容通常是：工具输出的 blob、子 agent 的低质量总结、以及模型早期的错误尝试。  
      4) 缓解手段并不神秘：压缩负责“降低历史噪声”、JIT 负责“按需引入信息”、动态工具加载负责“把路由问题缩小”、隔离负责“把未验证内容关进沙箱”。  
      5) 一个落地检验是：当你把四类失败分别写成回归用例时，你的系统是否能稳定复现并稳定修复？如果不能，说明问题可能不在模型，而在上下文组织方式。
