title: "Under the Hood: Universal Commerce Protocol (UCP)"
summary: |
  UCP 的问题定义很“agent 工程化”：传统商业系统存在 N×N 集成瓶颈（每个 agent surface 都要和每个商家后端做 bespoke 对接）；协议化的目标是把“发现→加购→支付→订单管理”等能力抽象成可发现的 primitives，让 agent 能动态对接。
