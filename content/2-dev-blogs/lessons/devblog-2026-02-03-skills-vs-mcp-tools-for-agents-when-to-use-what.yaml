  - type: md
    title: 时效性提示（可能过时）
    body: |
      原文对 skills 的目录结构、示例命令与具体框架细节可能会随生态变化而变化。
      更可迁移的是权衡框架：把 MCP 视为确定性工具接口，把 skills 视为可版本化的流程说明书；当领域快速演进且你需要 single source of truth 时，集中维护的 MCP 往往更省心。

  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) MCP 与 skills 的本质差别在执行模型：MCP 是“选 tool 后走确定性 API”，skills 是“读说明书后由模型解释执行”。  
      2) MCP 的典型代价是：工具多时 discovery 变难、不优化输出会造成 context bloat、以及每次调用的网络延迟。  
      3) skills 的典型风险是误解与幻觉：难点从“选哪个工具”升级为“选哪个 skill + 何时用 + 如何按步骤做”。  
      4) 在快速演进领域，single source of truth 很关键：集中更新的 MCP 更容易保持最新；skills 若不持续维护则更容易过时。
