id: devblog-2025-12-20-the-open-evaluation-standard-benchmarking-nvidia
title: "The Open Evaluation Standard: Benchmarking NVIDIA Nemotron 3 Nano with NeMo Evaluator"
summary: |
  文章讨论的不是“某个模型分数有多高”，而是**为什么需要开放、可复现的评估配方（evaluation recipe）**：很多评估只给最终分数，不给 configs/prompts/harness 版本/运行设置/logs；而这些细小差异足以导致结果不可比，甚至误把“评测条件变化/数据泄漏”当成“模型进步”。
