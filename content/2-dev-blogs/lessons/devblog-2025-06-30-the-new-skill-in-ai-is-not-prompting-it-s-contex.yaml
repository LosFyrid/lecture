id: devblog-2025-06-30-the-new-skill-in-ai-is-not-prompting-it-s-contex
title: "从 demo 到产品：context 的组成与动态构建系统"
summary: |
  用一个“安排会议”的对比例子说明：从便宜 demo 到“像魔法一样”的 agent，差异常常不在模型有多强，而在系统是否能在调用 LLM 前把关键上下文（日历、历史沟通、联系人信息、可执行工具、输出格式）补齐。本文同时给出更宽的 context 定义：context 是模型在生成前能看到的一切，而不仅是一段 prompt。
items:
  - type: md
    title: 导入：本课要回答的问题
    body: |
      这篇文章讨论的不是“如何把 prompt 写得更聪明”，而是一个更贴近产品的现象：同样调用 LLM，为什么有的 agent 让人觉得只是个 demo，有的 agent 看起来“像真的助理”？

      作者用一个非常日常的任务来解释差异：收到一封邮件——“明天方便快速同步一下吗？”  
      - demo 往往只会机械追问；  
      - 产品级 agent 往往能直接提出可执行选项并采取动作（例如发邀请）。

      本课围绕以下问题展开：

      1) 在这个例子里，demo 缺的到底是什么？是“更强模型”，还是“关键上下文”？  
      2) context 的边界在哪里：除了 system/user prompt，还包括哪些输入（状态、记忆、检索、工具、结构化输出）？  
      3) 为什么作者说“很多失败是 context failure，而不是 model failure”？这句话在工程上怎么理解？  
      4) 如果把“收集上下文”当成主要工作，我们的系统需要哪些模块与接口？  

  - type: md
    title: 概念对齐：context 是“模型看到的一切”
    body: |
      文章首先扩展了 context 的定义：它不是一句 prompt，而是模型在生成前能看到的一切输入。

      你可以把这些输入拆成一个更可操作的清单（对照你的系统是否都有对应数据源/模块）：

      **Instructions / System Prompt**  
      行为规则、示例、风格约束、禁止事项等。

      **User Prompt**  
      用户此刻提出的任务或问题。

      **State / History（短期记忆）**  
      当前会话内的对话历史、已做过的步骤、已确认的约束。

      **Long-Term Memory（长期记忆）**  
      跨会话保存的偏好、项目摘要、可复用事实（例如“我喜欢邮件用半正式语气”）。

      **Retrieved Information（检索信息 / RAG）**  
      来自文档、数据库、API 的外部证据，通常是按需拉取的。

      **Available Tools（可用工具）**  
      允许模型调用的能力定义（例如读取日历、发送邮件、创建日程）。

      **Structured Output（结构化输出约束）**  
      你希望模型输出的格式（例如 JSON schema），便于下游自动化执行或校验。

      这份清单的一个隐含结论是：所谓 context engineering，往往是在设计一条“在调用 LLM 之前运行的系统”，负责收集、过滤、格式化这些输入。

  - type: md
    title: 从“便宜 demo”到“魔法产品”：差异发生在 LLM 调用之前
    body: |
      文章的核心例子是安排会议。

      用户邮件只有一句话：

      > “Hey, just checking if you’re around for a quick sync tomorrow.”

      **便宜 demo 的典型行为**  
      系统几乎不提供额外上下文，只把这句话发给模型，于是模型只能做一个“合理但很弱”的追问：  
      - “明天可以。你想几点？”  
      这种回答不是错，而是缺乏行动性：它没有利用你在现实世界里的状态（例如日历已经满了），也没有利用与对方的关系信息来选择更合适的语气与建议。

      **“像魔法一样”的产品级行为**  
      关键变化不是模型突然更聪明，而是系统在调用模型前先补齐上下文，例如：

      - 读取日历：发现明天其实已经排满  
      - 检索历史邮件：判断沟通语气更偏随和还是正式  
      - 读取联系人信息：识别对方的重要性与称呼  
      - 提供工具：`send_invite` / `send_email` 等，让模型不仅能“说”，还能“做”

      当这些上下文进入模型输入后，模型更容易给出一个“可执行”的结果：  
      - 直接说明明天不行，提出可替代时间，并发出邀请。

      文章想强调的直觉是：**产品体验的差异，往往来自上下文的质量与组织方式，而不是某个神奇 prompt。**

  - type: md
    title: “Context failure”在工程上通常意味着什么
    body: |
      作者提出一个判断：随着模型与工具调用能力提升，很多 agent 的失败越来越像 context failure，而不是 model failure。

      把它翻译成工程语言，可以是下面几类问题：

      - 缺信息：模型没有拿到关键约束（例如“明天其实已满”）  
      - 缺工具：模型只能生成文字，不能读取日历或执行发送邀请  
      - 格式差：给了信息，但以原始 dump 形式塞进上下文，模型难以抓重点  
      - 时机错：信息/工具出现得太晚（模型已经做了错误假设并沿着错误路径行动）

      这类问题的修复路径往往是“补上下文系统”，而不是“更换模型”。

  - type: md
    title: 工程化落地：把“收集上下文”变成一等模块
    body: |
      读完这篇文章后，一个可迁移的落地方式是把系统拆成两层：

      **1) 上下文收集层（pre-LLM pipeline）**  
      负责：查日历/读历史/检索文档/选工具/生成结构化约束，并把结果整理成模型易消费的输入。

      **2) 模型执行层（LLM call + tool calls）**  
      在已有上下文条件下做推理与行动。

      这会改变你的优化重点：与其不断“调 prompt”，不如问：

      - 在这个任务里，哪些上下文是决定性的？  
      - 我是否能把它们做成可重复、可测试的数据源与工具？  
      - 输出是否足够结构化，让系统能自动执行或自动校验？

  - type: md
    title: 常见误区：读完后可以用来做自检
    body: |
      - 把 context 等同于 system prompt：忽略了状态、记忆、检索、工具与结构化输出同样属于 context。  
      - 只做“回答更像人”，不做“能采取动作”：不给工具或不给工具权限，系统只能停在对话层。  
      - 给了信息但不做格式化：把原始 dump 塞进 prompt，模型很难抓住关键约束。  
      - 在缺上下文时追求“更强模型”：更强模型可能只是更自信地补默认假设，并不一定更符合你的业务口径。

  - type: md
    title: 练习：把一个日常请求改写成“上下文收集清单”
    body: |
      任选一个日常请求（例如“帮我安排一个下周的会”或“帮我写一封回复邮件”），写一份上下文收集清单：

      1) 需要哪些信息源？（日历、联系人、历史沟通、公司规则、项目背景）  
      2) 需要哪些工具？（读日历、创建日程、发邮件、查联系人）  
      3) 输出需要什么结构？（例如：候选时间列表 + 推荐理由 + 已执行的动作）  
      4) 哪些信息属于硬约束（不可随意猜），哪些可以让模型自由发挥（语气、措辞）？

      写完后自检：如果不给这些上下文，模型是否仍有可能“合理完成任务”？如果答案是否定的，那你遇到的往往是 context failure。

  - type: md
    title: 原文阅读
    body: |
      - 日期：2025-06-30
      - 来源：PhilSchmid
      - 建议：阅读原文时可以重点看两块：① context 的组成清单（哪些输入属于“模型看到的一切”）；② demo vs magical agent 的会议安排对比（差异发生在 LLM 调用之前的上下文收集层）。

  - type: url
    title: "原文：The New Skill in AI is Not Prompting, It's Context Engineering"
    url: https://www.philschmid.de/context-engineering
    mode: open

  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) demo 与产品的差异往往不在“更强模型”，而在“调用 LLM 前是否补齐关键上下文”（状态、记忆、检索、工具、输出约束）。  
      2) 把 context 定义扩展为“模型看到的一切”，会迫使你把上下文来源与格式显式化：信息从哪来、什么时候注入、怎么呈现。  
      3) “context failure”常见形态是缺信息/缺工具/格式差/时机错；它们通常比“换模型”更可控。  
      4) 一个落地起点是：为高频任务写出上下文收集清单，并把清单里的信息源与工具变成可测试的模块。
