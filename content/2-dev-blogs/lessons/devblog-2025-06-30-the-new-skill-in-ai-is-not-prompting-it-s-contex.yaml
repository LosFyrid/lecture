title: "The New Skill in AI is Not Prompting, It's Context Engineering"
summary: |
  文章用一句话把“context engineering”的工程直觉说清：决定 agent 成败的往往不是模型能力，而是你给它的“工作记忆”（context）质量；很多失败是 context failure 而非 model failure。
