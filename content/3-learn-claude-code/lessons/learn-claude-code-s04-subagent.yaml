  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) 探索性任务污染主上下文，是因为它产出大量“当时需要、之后不需要”的中间观测（长文件、长日志、失败尝试）。  
      2) 这节课的隔离主要是消息隔离：子智能体有自己的 messages 历史，但仍共享文件系统；它不是安全沙箱。  
      3) 摘要回传的收益是主上下文更干净、成本更可控；代价是细节丢失与可追溯性下降，需要用更严格的输出契约弥补。  
      4) 禁止递归与步数上限，是为了在不可控行为下给系统设边界，避免无限分叉与无限循环。
