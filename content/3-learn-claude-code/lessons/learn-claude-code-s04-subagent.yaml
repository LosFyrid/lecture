      你可以把本课当成一个小实验：
      
      1) 先按文档里的 `试一试` 跑通一次（确保能复现）。
      2) 再做一次**微改动**（例如：添加一个新的提示、改一个阈值、加一个危险命令拦截），观察行为差异。
      
      检查点（你应该能回答）：
      
      - 这节课新增的“机制”是什么？它解决了什么具体失败模式？
      - 这套机制的状态/真实来源是什么（内存、messages[]、文件系统、线程）？

