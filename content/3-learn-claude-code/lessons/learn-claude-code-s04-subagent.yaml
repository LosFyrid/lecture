id: learn-claude-code-s04-subagent
title: "第 4 课：Subagent——用“新 messages[]”做上下文隔离，并把结果压缩回传"
summary: |
  探索性任务会把大量无关细节塞进上下文，拖慢长任务并诱发漂移。本课引入 subagent：子智能体用全新的 messages[] 运行，
  共享文件系统但不共享对话历史，只把最终摘要返回给父智能体，从而保持主上下文干净。
items:
  - type: md
    title: 导入：本课要回答的问题
    body: |
      当 agent 开始频繁读文件、跑命令、打印日志时，你会看到一个非常具体的工程问题：**上下文被“探索痕迹”填满**。
      例如，为了回答“这个项目用了什么测试框架”，模型可能读 5 个文件、跑 3 条命令；但主 agent 真正需要的也许只有一句结论和一两个证据线索。

      本课围绕以下问题展开：

      1) 为什么“探索性阅读/搜索”特别容易污染主上下文？  
      2) subagent 的隔离到底隔离了什么（消息？文件？进程？）  
      3) “只返回摘要”这种压缩回传，工程上带来哪些收益与代价？  
      4) 为什么要禁止子智能体递归生成？为什么要设置最大迭代次数？

  - type: md
    title: 概念对齐：上下文隔离 ≠ 进程隔离
    body: |
      这节课里，“隔离”主要指 **对话历史的隔离**，而不是操作系统意义上的隔离。

      **消息隔离（conversation isolation）**  
      子智能体从 `messages=[]`（准确说是只包含一条委派 prompt）开始运行。它读文件、跑命令产生的中间输出只存在于它自己的 messages 里。
      当它结束时，这段历史会被丢弃——父智能体看不到全过程，只收到一个压缩后的结果。

      **共享的部分（shared state）**  
      子智能体和父智能体仍共享同一个工作目录（文件系统）。也就是说，子智能体写文件、修改文件，父智能体是能看到这些变化的。

      **进程隔离（process isolation / sandbox）**  
      如果你要把“写文件/执行命令”的风险隔离到一个真正受控的环境，通常需要进程/容器/虚拟机级别的隔离。
      本课的 subagent 并不提供这种安全隔离；它解决的是“上下文容量与注意力”的问题。

  - type: md
    title: 机制拆解：task 工具如何“生成”一个子智能体？
    body: |
      s04 的关键改动，是给父智能体新增一个工具：`task`。

      从父智能体视角看，`task` 是一个普通工具调用：
      - 输入：`prompt`（让子智能体做什么），可选 `description`（人类可读的短描述）  
      - 输出：一段文本摘要

      但在 harness 侧，这个工具的实现不是读文件/写文件，而是“启动另一个 loop”：
      - 创建一份新的 `sub_messages`，只放入委派 prompt  
      - 用一套子智能体 system prompt（强调完成任务后总结）  
      - 允许子智能体使用一组基础工具（bash/read/write/edit），但**不允许**使用 `task`（避免递归生成）  
      - 循环执行工具直到停止或达到安全上限（示例里最多 30 轮）

      子智能体结束后，系统只把最终输出里的文本拼起来作为 summary 返回给父智能体。

  - type: md
    title: 为什么“只回传摘要”能保持主上下文干净？
    body: |
      把探索放进子智能体，有两个直接效果：

      **1) 主上下文不再永久保存探索痕迹**  
      以前父智能体可能需要把 500 行文件内容读进 messages 才能得到一个结论；现在这些 500 行只存在于子智能体的临时上下文里。

      **2) 结果以“压缩状态增量”回到主线**  
      父智能体收到的是一段摘要，它更接近“可用于下一步决策的信息”，而不是完整过程。
      这会让主上下文更像“项目进展记录”，而不是“所有探索日志的大杂烩”。

      但代价也很明确：  
      - 你失去了细粒度可追溯性（摘要可能遗漏证据或误读）；  
      - 如果父智能体需要细节，往往只能再次委派或让子智能体带上更严格的输出格式；  
      - 子智能体自身也会消耗 token 与时间，只是把消耗从主线程迁移到了子线程。

  - type: md
    title: 两个安全阀：禁止递归与最大步数上限
    body: |
      代码里有两个很“工程味”的保护：

      **1) 子智能体工具集里没有 task**  
      这等价于禁止递归生成子智能体，避免出现无限分叉（以及不可控的成本/延迟）。

      **2) 子智能体 loop 有最大迭代次数**  
      示例里最多 30 轮。如果子智能体陷入“反复尝试但没有进展”的循环，这个上限能让它终止并把问题暴露出来。

      这两个阀门不是为了“让模型更聪明”，而是为了让系统在不可预测行为下仍有边界。

  - type: md
    title: 动手练习：把“探索任务”交给 subagent
    body: |
      1) 运行：

      ```bash
      python agents/s04_subagent.py
      ```

      2) 试三个典型委派（任选其一）：
      - 让 subagent 找出项目使用的测试框架，并给出 1-2 个证据线索（例如文件名/关键词）。  
      - 让 subagent 浏览 `agents/` 下的脚本，并给出“每个脚本新增的机制一句话”。  
      - 让 subagent 创建一个小模块（写文件），父智能体再用 read_file 验证结果是否存在。

      3) 微改动（建议）：
      - 让 subagent 的输出带上“引用”：例如在摘要里包含 `file_path:line_range` 或关键命令输出片段，提升可复核性。  
      - 或者让 subagent 输出一个 JSON 结构（结论/证据/不确定点），观察父智能体合并信息是否更容易。

