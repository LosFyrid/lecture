id: learn-claude-code-s10-team-protocols
title: "第 10 课：Team Protocols——用 request_id 把异步协作变成可追踪的 FSM"
summary: |
  有了队友与消息通道之后，协作仍然可能“无序”：怎么优雅关机？怎么在高风险改动前做计划门控？
  本课用同一个 request_id 关联模式实现两种协议（关机、计划审批）：用一个小 FSM（pending→approved/rejected）追踪请求状态。
items:
  - type: md
    title: 导入：本课要回答的问题
    body: |
      s09 让队友能工作、能发消息，但它仍然缺少“结构化协调”：
      - 你可以告诉队友做什么，但很难在关键节点要求它“先停一下、等我确认”；  
      - 你也很难让队友“干净地停止”，而不是粗暴地杀掉线程。

      本课要回答：

      1) 为什么“直接停掉线程”不是一个好关机方式？优雅关机需要什么交互？  
      2) 为什么计划审批（plan approval）是团队协作里常见的门控机制？  
      3) request_id 关联模式到底解决了什么问题？它如何对抗乱序与延迟？  
      4) 如何用一个有限状态机（FSM）把“请求→响应→结论”变成可追踪状态？

  - type: md
    title: 概念对齐：异步消息里最难的是“关联”
    body: |
      在文件邮箱/队列式通信里，消息常见特征是：
      - 到达有延迟（接收方轮询才看到）  
      - 可能乱序（多个请求/响应交织）  
      - 发送方与接收方各自维护自己的局部上下文

      这会带来一个工程难题：当你收到一条响应时，你如何知道它对应“哪一次请求”？

      request_id 的作用就是提供一个稳定的关联键（correlation id）：
      - 发起方生成 request_id，放进请求消息  
      - 响应方在回复时原样带回 request_id  
      - 系统可以用 request_id 把一条异步消息链串成一件“可追踪的事务”

  - type: md
    title: 一个小 FSM，两种协议：pending → approved / rejected
    body: |
      本课把两类协作问题抽象成同一个状态机：

      - 初始：`pending`（请求已发出，等待回复）  
      - 终态：`approved` 或 `rejected`

      状态机本身不关心“审批的是什么”（关机、计划、别的未来协议）。
      它只关心：有没有 request_id、当前处于哪个状态、以及状态如何被某条消息推进。

      这就是“一个模式能复用到多个协议”的原因：复用的是关联与追踪，而不是业务语义。

  - type: md
    title: 协议一：优雅关机（Shutdown Handshake）
    body: |
      **问题**：如果你直接杀掉队友线程，它可能正在写文件或更新 config，留下半成品与错误状态。

      **协议结构**：
      1) lead 生成 request_id，通过 inbox 发送 `shutdown_request` 给指定队友。  
      2) 队友收到后，调用 `shutdown_response` 工具，选择 approve/reject，并把同一个 request_id 回传。  
      3) lead 用 tracker 记录该 request_id 的状态变化；队友如果批准，会在 loop 中设置 should_exit 并把状态写为 shutdown。

      **关键点**：关机不是“命令”，而是一次“协商”。队友可以拒绝（例如它正在关键步骤）。

  - type: md
    title: 协议二：计划审批（Plan Approval Gate）
    body: |
      **问题**：如果队友一收到“重构认证模块”就直接开干，高风险改动可能在你反应过来之前就造成大范围变更。

      **协议结构**：
      1) 队友用 `plan_approval` 提交计划文本：系统生成 request_id，并把计划通过 inbox 发给 lead。  
      2) lead 审阅后，用同一个 request_id 做出 approve/reject，并把反馈回传给队友。  
      3) tracker 把该 request_id 的状态从 pending 推进到 approved/rejected。

      **一个实现细节**：在教学代码里，计划提交与审批复用了同一个工具名 `plan_approval`，但输入形状不同：  
      - 队友侧：提供 `plan` 文本，生成 request_id  
      - lead 侧：提供 `request_id + approve (+ feedback)`，完成审批

      你可以把它理解成“同一个协议在两个角色的两个入口”。

      备注：阅读源码时你可能会看到“计划提交”也使用了 `plan_approval_response` 这类消息类型命名。
      这里更想强调的是 **request_id 关联模式**：只要请求与响应都携带同一个 request_id，tracker 就能把异步往返串起来；消息类型字符串本身可以随实现调整。

  - type: md
    title: 追踪器（tracker）：为什么需要一个集中记录的字典？
    body: |
      request_id 让消息可关联，但系统还需要一个地方记录“当前状态是什么”。

      教学实现使用两个字典作为 tracker：
      - `shutdown_requests[request_id] = {target, status}`  
      - `plan_requests[request_id] = {from, plan, status}`

      它们让 lead 可以：
      - 查询某个 request_id 的最新状态  
      - 把“收到响应”转化为“状态更新”

      同时，因为 lead 与队友在不同线程里更新 tracker，代码用一把 lock 保护这些结构，避免竞态。

      需要注意的边界：tracker 是内存态的。如果 lead 重启，这些 pending 请求就会丢失；更完整实现需要把 tracker 持久化或从消息日志重建。

  - type: md
    title: 动手练习：关机与计划门控各走一遍
    body: |
      1) 运行：

      ```bash
      python agents/s10_team_protocols.py
      ```

      2) 练习 A：关机协议  
      - spawn `alice`  
      - 发起 shutdown_request  
      - 观察 alice 是否会 approve 并进入 shutdown 状态

      3) 练习 B：计划审批  
      - spawn `bob`，给一个“高风险”的重构任务  
      - 观察 bob 是否先提交计划  
      - lead 选择 reject，并给出一条明确反馈（例如要求分阶段或先补测试）  
      - 看 bob 是否会调整计划再提交

      4) 微改动（建议）：
      - 把 tracker 的条目写入文件（例如 `.team/requests.json`），让状态能跨重启存活。  
      - 给 plan_approval 增加一个 “scope / files” 字段，观察结构化计划是否更易审批。

  - type: md
    title: 原文阅读
    body: |
      - 日期：2026-02-26（仓库快照）
