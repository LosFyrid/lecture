  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) 优雅关机需要握手，是因为队友可能正处在不可安全中断的动作中；协议允许它批准/拒绝，并把停止变成可控状态变更。  
      2) 计划审批是一种执行门控：把“先做什么、风险在哪里、如何验证”显式化，避免高风险改动直接落到执行面。  
      3) request_id 解决的是异步系统里的关联问题：让乱序/延迟环境下的请求与响应仍能被稳定匹配。  
      4) FSM + tracker 把协作变成可追踪状态：pending→approved/rejected，让系统能查询、能监控、也更容易做后续扩展（超时、重试、撤销等）。
