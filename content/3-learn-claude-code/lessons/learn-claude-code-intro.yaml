id: learn-claude-code-intro
title: "导论：如何用 12 个“可运行机制”搭出一个终端编程 Agent"
summary: |
  这是一门项目驱动课程：从最小 agent loop 开始，每一课只增加一个机制（工具路由、可见计划、子智能体隔离、按需技能、上下文压缩、任务落盘、后台执行、团队协议、自治与 worktree 隔离）。
  本导论说明学习方式、边界与环境准备，帮助你把后续 12 课当作“可复现的小实验”来学。
items:
  - type: md
    title: 导入：你将要解决的问题
    body: |
      如果你只把 LLM 当作“更聪明的代码生成器”，你会卡在一个很现实的地方：它很会说，但它不一定能把事情做完。

      这门课想训练的是另一种能力：**把模型放进一个可执行系统里**，让它能在真实项目环境中读取文件、运行命令、修复错误，并把过程组织成可持续迭代的闭环。

      开始之前，先带着这几个问题：

      1) coding agent 的“最小骨架”是什么？哪些东西是可选层？  
      2) 为什么这门课坚持“每课只新增一个机制”？这种拆法在工程迭代里意味着什么？  
      3) 这套实现哪些地方是教学简化，哪些地方可以迁移到真实系统？  
      4) 在本地运行 agent 时，最容易踩的安全坑是什么？

  - type: md
    title: 课程结构：12 课递进，但 loop 始终不变
    body: |
      上游仓库把一个终端编程 agent 拆成 12 个可运行的脚本（s01→s12）。
      课程的设计意图是：**循环（loop）始终不变，变化的是你每一节课叠加的机制**。

      你可以把它看成“搭积木”：
      - s01-s02 先把闭环与工具路由固定下来（能跑通、能扩展）；  
      - s03-s06 处理“多步任务的认知负担”（计划、隔离、按需知识、上下文压缩）；  
      - s07-s08 处理“跨轮次的可持续性”（状态落盘、后台执行）；  
      - s09-s12 处理“多执行体协作与并行风险”（队友、协议、自治、worktree 隔离）。

      每一节课都可以被当作一个独立实验：你能明确指出“本课新增的机制是什么”，并在代码中定位它。

  - type: md
    title: 学习方式：把每一课当成可复现的小实验
    body: |
      这类课程最容易变成“读完觉得懂、真正写时不会”。一个更稳的学习方式是把每一课当作小实验：

      1) 先读 lesson：把“本课新增机制”用一句话写下来。  
      2) 再跑脚本：确认你能稳定复现（同一提示能跑出相似轨迹）。  
      3) 做一个微改动：改一个阈值、改一个输出格式、加一个小工具或一个约束。  
      4) 记录观察：行为变化来自哪里？变化是否符合你的预期？

      这样学的好处是：你不会只记住结论，而是掌握“机制→行为→边界”的映射。

  - type: md
    title: 环境准备（本地运行）
    body: |
      上游项目是 Python 实现。你需要：
      - Python 环境  
      - 一个可用的模型 API key（示例代码使用 Anthropic SDK，也支持设置兼容的 base_url）

      基本步骤（示例）：

      ```bash
      git clone https://github.com/shareAI-lab/learn-claude-code
      cd learn-claude-code
      pip install -r requirements.txt
      cp .env.example .env
      # 编辑 .env：至少配置 API key 与模型 ID
      python agents/s01_agent_loop.py
      ```

      备注：如果你希望把课程内容“锁定到一个固定版本”，建议在课程发布/学习时使用特定 commit，而不是跟随 main 分支漂移。

  - type: md
    title: 安全边界：把 agent 当作“会犯错的自动化操作者”
    body: |
      这些脚本会执行命令、读写文件。即使代码里有一些危险命令拦截，它们仍然是学习型实现。

      一个更稳的安全默认是：
      - 在隔离目录（或专门的练习仓库）里运行，不要直接对真实项目动手  
      - 在第一次运行每个脚本前，先读一遍新增的工具与执行边界  
      - 把密钥留在本地环境变量/`.env`，不要写进代码与提交记录

      你可以把“发现潜在危险并补上边界”当成练习的一部分：这本身也是 agent 工程的重要能力。

  - type: md
    title: 范围说明：这不是生产级实现（刻意缺省了很多东西）
    body: |
      上游仓库明确把自己定位为 0→1 的教学实现，因此会刻意省略部分生产机制，例如：
      - 更完整的事件/Hook 总线（PreToolUse、SessionStart/End 等）  
      - 更严格的权限治理与信任流程  
      - 更完整的会话生命周期（resume/fork）  
      - 完整的 MCP 运行时细节

      这些缺省并不表示“不重要”，只是为了让你先看清主干：loop、状态、隔离与协作协议。
      当你把这些模式迁移到真实系统时，上述机制通常会重新变得重要。

