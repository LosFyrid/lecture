  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) 最小骨架是 agent loop + 工具执行 + 结果回流；其余（规划、压缩、持久化、协作）是为了让它在长任务与真实环境中可持续。  
      2) “每课只加一个机制”是一种工程迭代策略：让你能把行为变化归因到单一改动，也更容易做回归与调参。  
      3) 教学实现可迁移的是结构与边界（路由、隔离、协议、状态外置），不保证具体阈值/实现细节就是生产最佳解。  
      4) 本地运行的最大风险来自执行面（命令与写文件）；隔离工作区、审慎管理密钥、以及逐课理解新增机制，是更稳的默认。
