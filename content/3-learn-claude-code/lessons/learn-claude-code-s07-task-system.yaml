id: learn-claude-code-s07-task-system
title: "第 7 课：Task System——把进度落盘，让状态穿越压缩与多智能体"
summary: |
  s03 的 Todo 是内存态：一旦做上下文压缩，就只能靠摘要“猜回去”。本课把任务做成文件系统中的 JSON 工件（.tasks/），
  并引入依赖图（blockedBy / blocks），让进度能在压缩后存活、也能被多个 agent 共享。
items:
  - type: md
    title: 导入：本课要回答的问题
    body: |
      s03 的 TodoManager 解决了“计划可见”，但它有一个致命的工程边界：它活在内存里。
      一旦你在 s06 里压缩对话、重置 messages，todo 就不见了——系统只能从摘要文本里“恢复”它，而这是有损的。

      更进一步：当我们开始做团队协作（后续 s09+），队友需要看到同一块任务看板；而内存结构天然是“进程私有”的。

      本课要回答：

      1) 为什么“可持续的长任务”需要把状态搬出对话？  
      2) 为什么把任务做成文件（JSON）是一种简单但有效的持久化方式？  
      3) 依赖图（blockedBy/blocks）在任务系统里解决了什么协调问题？  
      4) 文件作为 source of truth 时，并发写入会带来哪些新风险？

  - type: md
    title: 概念对齐：Todo vs Task（什么时候用哪个）
    body: |
      **Todo（内存态清单）** 更适合：
      - 短时、单会话、线性推进  
      - 你主要想要“让模型别忘了下一步”

      **Task（持久化任务）** 更适合：
      - 跨会话、需要压缩上下文的长任务  
      - 有依赖关系（先搭脚手架再写代码再写测试）  
      - 多智能体协作（多个进程需要看到同一份状态）

      从工程角度看，Task 的优势不在于“更聪明”，而在于它把“进度”变成了一个可共享、可恢复、可审计的外部状态。

  - type: md
    title: 机制：把任务持久化为 .tasks/task_<id>.json
    body: |
      s07 的核心设计是：让文件系统成为任务状态的真实来源（source of truth）。

      每个任务对应一个 JSON 文件，包含：
      - `id`：整数 ID  
      - `subject` / `description`：任务主题与说明  
      - `status`：`pending / in_progress / completed`  
      - `blockedBy`：被哪些任务阻塞（依赖前置任务）  
      - `blocks`：它阻塞哪些任务（后置任务）  
      - `owner`：可用于多人协作时标注负责人（后续课程会用到类似概念）

      这样做的直接好处是：即使对话被压缩、messages 被替换，任务文件仍在；任何 agent 只要能读文件，就能“重新进入任务现场”。

  - type: md
    title: 依赖图：完成任务时，系统如何自动“解锁”后续任务？
    body: |
      仅仅把 task 落盘还不够：长任务通常需要约束顺序，否则模型会同时推进多个互相依赖的步骤。

      s07 用一个很轻量的依赖图表达顺序：
      - 如果任务 B 的 `blockedBy` 包含任务 A，那么 B 在逻辑上应当等待 A 完成。  
      - 当你把任务 A 标记为 `completed` 时，系统会遍历其他任务，把 A 从它们的 `blockedBy` 列表里移除。

      这相当于把“解锁逻辑”从模型脑内，迁移到一个可执行、可验证的规则里。

      同时，`blocks` 与 `blockedBy` 在更新时会做一部分双向同步：  
      当你声明 “A blocks B”，系统会尝试把 A 写进 B 的 blockedBy，避免图只更新一边导致不一致。

  - type: md
    title: 工具层：task_create / task_update / task_list / task_get
    body: |
      为了让模型操作这些 JSON 文件，s07 提供了 4 个任务工具：
      - `task_create`：创建任务  
      - `task_update`：更新状态与依赖（例如完成任务、添加 blockedBy/blocks）  
      - `task_list`：列出简表（便于“现在该做什么”的决策）  
      - `task_get`：读取单个任务的全量 JSON（便于理解依赖与详情）

      这组工具在结构上继承了 s02 的思想：loop 不变，新增的是一组 handlers 与 schema。
      任务系统的“真实状态”不再藏在 messages 里，而是由文件决定。

  - type: md
    title: 一个必须提前知道的坑：文件持久化带来并发一致性问题
    body: |
      把任务写进文件系统，会带来一个新的工程问题：并发写入时的覆盖与竞态。

      例如两个 agent 同时更新同一个任务文件，如果都按“读取→修改→写回”执行：
      - A 先读到旧状态  
      - B 完成并写回新状态  
      - A 再把它基于旧状态的修改写回，可能把 B 的更新覆盖掉

      教学实现为了清晰，并没有把并发治理做完整（比如原子写、文件锁、乐观并发控制）。
      但有一个边界值得记住：当任务系统走向多人/多进程时，一致性策略会变成必要机制。

  - type: md
    title: 动手练习：做一个带依赖的任务看板，并“完成→解锁”
    body: |
      1) 运行：

      ```bash
      python agents/s07_task_system.py
      ```

      2) 创建 3 个任务并串成依赖（示例思路）：
      - 任务 1：Setup project  
      - 任务 2：Write code（blockedBy: [1]）  
      - 任务 3：Write tests（blockedBy: [2]）

      3) 观察：
      - `task_list` 是否显示阻塞关系？  
      - 当你把任务 1 标记为 completed 后，任务 2 的 blockedBy 是否自动清空？  
      - `.tasks/` 下的 JSON 文件是否如预期更新？

      4) 微改动（建议）：
      - 给 `task_list` 输出加上 “blocks” 信息，形成更清晰的图视图；  
      - 或者增加一个 “task_graph” 工具专门输出 DOT/mermaid，观察结构化视图对模型决策是否更友好。

