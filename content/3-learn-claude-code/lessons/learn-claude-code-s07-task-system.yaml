  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) 长任务需要把状态搬出对话，是因为 messages 会被压缩/替换；内存态结构很难在压缩后无损恢复。  
      2) 文件（JSON）是一种低门槛但有效的持久化：可读、可审计、可被多个进程共享，适合作为教学实现的 source of truth。  
      3) 依赖图把“顺序约束”变成系统规则：完成任务自动解锁后续任务，避免全靠模型记忆与自觉。  
      4) 文件持久化并不自动解决一致性；当多 agent 并发更新时，必须引入锁/原子写/乐观并发控制等机制，否则容易互相覆盖。
