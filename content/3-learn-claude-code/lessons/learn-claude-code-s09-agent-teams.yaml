id: learn-claude-code-s09-agent-teams
title: "第 9 课：Agent Teams——持久化队友 + 文件邮箱，让多个 agent 能协调"
summary: |
  s04 的 subagent 是一次性的“临时工”，s08 的后台任务只会跑命令。真正的团队协作需要：持久化身份、生命周期管理、以及通信通道。
  本课用 .team/config.json 维护名册，用 JSONL 收件箱实现 message bus，让队友在独立线程里运行自己的 agent loop 并互相发消息。
items:
  - type: md
    title: 导入：本课要回答的问题
    body: |
      当你开始把一个复杂任务拆给多个执行体时，很快会发现两种“并行”都不够：
      - subagent（s04）能探索，但它结束就消失，无法持续跟进；  
      - background task（s08）能并行跑命令，但它不会做 LLM 驱动的决策，也无法对话协调。

      本课要回答：

      1) 从“一个 agent”走向“一个团队”，最缺的三个基础设施是什么？  
      2) 什么是“持久化队友”？它与 subagent 的差别在哪里？  
      3) 为什么用 JSONL 收件箱可以作为教学版的通信协议？  
      4) 轮询收件箱、读取后排空（drain-on-read）会带来哪些行为特征与边界？

  - type: md
    title: 概念对齐：Subagent、Teammate 与“协作最小件”
    body: |
      **Subagent（子智能体）**  
      更像一次性委派：给它一个 prompt，它用新 messages[] 做探索，回传摘要，然后结束。

      **Teammate（队友）**  
      更像一个长期存在的执行体：它有名字、有角色、有状态（working/idle/…），可以被反复唤醒去做不同任务。

      **团队协作的三个最小件**  
      1) **生命周期**：队友需要能“活过一个 prompt”，否则无法持续推进与复盘。  
      2) **身份与名册**：你需要知道队友是谁、现在在做什么、是否空闲。  
      3) **消息通道**：没有通信，再多并行执行体也只是“各干各的”，很难协调依赖与交接。

  - type: md
    title: 协议与存储：.team/ 目录承载“团队状态”
    body: |
      s09 把团队做成文件系统里的一个小“控制面”目录：

      - `.team/config.json`：团队名册（成员列表、角色、状态）  
      - `.team/inbox/<name>.jsonl`：每个成员一个收件箱（追加式 JSONL）

      这里沿用了 s07 的同一个思想：把关键状态放到对话之外，让它能被多个执行体共享、也能在上下文压缩后存活。

  - type: md
    title: MessageBus：JSONL 收件箱的 send / read / broadcast
    body: |
      MessageBus 的核心是两个动作：

      **send(sender, to, content, type)**  
      - 把一条消息序列化为 JSON  
      - 追加写入 `inbox/<to>.jsonl`（append-only）

      **read_inbox(name)**  
      - 读取收件箱文件的所有行  
      - 逐行解析 JSON  
      - 然后把文件清空（drain）

      “读完就排空”让收件箱表现得像一个简单队列：消息不会被重复消费，但也意味着如果你希望“可回放”，需要另外的归档机制。

      **broadcast** 则只是 send 的循环：给所有队友各写一份相同消息（排除发送者）。

      这是一种刻意选择的教学协议：不用引入外部 MQ/数据库，你也能看到消息文件里到底写了什么，从而更容易调试。

  - type: md
    title: TeammateManager：spawn / status / idle 的生命周期
    body: |
      TeammateManager 负责把“队友”从抽象概念变成可管理对象：

      - `spawn(name, role, prompt)` 会把成员写进 config（或更新其状态为 working），然后启动一个线程运行该队友的 loop。  
      - 如果同名成员已存在但处于 idle/shutdown，spawn 会把它“重新激活”。  
      - 队友 loop 结束后，会把状态写回为 idle（除非它被标记为 shutdown）。

      这种“idle ↔ working”的切换，使得队友更像一个可复用的 worker，而不是一次性 subagent。

  - type: md
    title: 队友如何“看到消息”？——每轮先读 inbox，再推理
    body: |
      队友线程里运行的是一个熟悉的模式：循环调用 LLM + 工具。

      关键差异是：在每次 LLM 调用前，队友会先读取自己的 inbox。
      如果 inbox 里有消息，就把它们注入到自己的 messages[] 里，作为下一轮推理的输入。

      这让通信具备一个自然节奏：  
      - 发送方只负责把消息写入文件；  
      - 接收方在下一轮“抬头看一眼邮箱”，再决定如何行动与回复。

      这种轮询延迟在教学系统里通常是可接受的：因为每轮推理本身就可能需要几秒。

  - type: md
    title: 一个重要边界：文件邮箱的并发与一致性
    body: |
      文件邮箱的简洁性也带来一些边界：

      - 追加写入如果出现多个写入者并发，需要更强的原子性保障（例如文件锁）。  
      - “读完排空”会让你失去历史消息；如果你需要审计与回放，需要把消息另存一份。  
      - 收件箱只提供“最终送达”，不提供“立即送达”——队友必须轮询才能看到消息。

      教学实现有意保持简单，让你先建立“协作=生命周期+名册+消息通道”的心智模型；生产系统往往会引入更成熟的消息基础设施。

  - type: md
    title: 动手练习：让两个队友分工，并用消息完成交接
    body: |
      1) 运行：

      ```bash
      python agents/s09_agent_teams.py
      ```

      2) 建议的分工任务（任选其一）：
      - spawn `alice`（coder）和 `bob`（tester）：让 alice 改一个小功能，让 bob 跑测试并把失败信息发回。  
      - 广播一个状态更新（broadcast），观察每个队友是否会把它当作新约束。  
      - 用 `/team` 看团队名册的状态变化，用 `/inbox` 看 lead 的收件箱。

      3) 微改动（建议）：
      - 让 send_message 的 payload 附带 `task_id` 或 `file_paths`（extra 字段），提高交接时的可追溯性。  
      - 把 inbox 注入格式从“逐条 JSON dump”改成“统一包裹在 <inbox>…</inbox>”，观察模型处理多条消息时的稳定性变化。

