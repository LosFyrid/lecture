  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) 团队协作的三件基础设施是：持久化生命周期、身份/名册、消息通道；没有消息，协作只剩“并行但不协调”。  
      2) teammate 与 subagent 的差别在于“可被再次唤醒”：它有名字与状态，能持续接收后续指令。  
      3) JSONL 收件箱是一种可观察的教学协议：append 写入、read 后 drain，足以搭起 send/broadcast 的最小消息总线。  
      4) 轮询与 drain-on-read 带来延迟与一致性边界：生产系统通常需要更强的锁、归档与投递语义。
