  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) 我们不把整个 loop 多线程化，是为了保持推理与状态的可理解性；并发的目标是避免在长 I/O 上干等。  
      2) background_run 的最小语义是“启动→立即返回 id”；后续用 check_background 或通知回流拿到结果。  
      3) 在下一次 LLM 调用前排空队列，是一种事件循环设计：把异步结果变成下一轮的新观测，避免打断模型生成。  
      4) 并发会引入可追溯性与一致性问题：结果归属、输出截断、共享工作区副作用、以及任务生命周期治理，都需要额外机制支撑。
