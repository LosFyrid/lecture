id: learn-claude-code-s08-background-tasks
title: "第 8 课：Background Tasks——让长命令并行跑，结果在下一轮自然回流"
summary: |
  安装依赖、跑测试、构建镜像往往需要几十秒到几分钟；如果 agent loop 只能阻塞等待，吞吐与体验都会变差。
  本课用后台线程 + 通知队列：background_run 立即返回 task_id；命令完成后结果进入队列，并在下一次 LLM 调用前被注入上下文。
items:
  - type: md
    title: 导入：本课要回答的问题
    body: |
      你在真实项目里很快会遇到这类命令：
      - `npm install`  
      - `pytest` / `cargo test`  
      - `docker build`

      它们不是“复杂”，而是“慢”。如果 agent 每次都用阻塞式 bash 等待执行完，它会陷入一种尴尬：
      同一段时间里它既不能继续做别的工作，也无法提前准备下一步动作。

      本课要回答：

      1) 为什么我们不把整个 agent loop 多线程化，而是只把“长 I/O”放到后台？  
      2) background_run 的最小语义是什么？和 bash 的差别在哪里？  
      3) 结果是怎样回到对话里的？为什么选择“在下一次 LLM 调用前排空队列”？  
      4) 并发带来的新问题是什么（任务状态、一致性、注入格式、可追溯性）？

  - type: md
    title: 概念对齐：并发不是为了“更聪明”，而是为了“别干等”
    body: |
      这节课的并发模型非常克制：  
      - LLM 调用仍然是单线程、顺序执行的（一次只跑一个 model call）。  
      - 只把“外部执行”并行化（子进程在后台跑）。

      这背后的直觉是：  
      - 模型推理本身不适合被随机打断（否则状态难以维护）；  
      - 但安装/测试/构建这类 I/O 工作非常适合异步执行，因为它们的主要成本是等待外部系统。

      所以，本课讨论的不是“多 agent 协作”，而是“把工具执行从阻塞改成可等待”。

  - type: md
    title: 机制：BackgroundManager = 线程执行 + 通知队列
    body: |
      s08 引入一个 `BackgroundManager`，它维护三类状态：
      - `tasks`：task_id -> {status, result, command}  
      - `_notification_queue`：已完成任务的通知列表（用于回流）  
      - `_lock`：保证队列操作的线程安全

      background_run 的行为可以概括为：
      1) 生成一个短 task_id（UUID 截断）并记录状态为 running  
      2) 启动一个守护线程（daemon thread）去执行子进程  
      3) 立即返回，让主 loop 继续推进其他工作

      后台线程执行结束后，会把：
      - 状态（completed/timeout/error）  
      - 截断后的结果片段（用于快速反馈）
      推入通知队列，等待主 loop 下一次取走。

  - type: md
    title: “排空队列再调用模型”：结果为什么这样注入？
    body: |
      主 loop 在每次调用 LLM 之前，会先 `drain_notifications()`：
      - 取出当前所有完成通知  
      - 清空队列（避免重复注入）

      如果有通知，它会把通知拼成一段 `<background-results> ... </background-results>` 文本，
      作为一条新的 user 消息追加进 messages，并再追加一条简短的 assistant 确认（“已记录后台结果”）。

      这种“在下一次 LLM 调用前注入”的设计有两个工程好处：
      - **不打断推理**：结果不会在模型生成中途突然插入，避免状态割裂。  
      - **形成自然节奏**：模型每一轮推理的开头都能看到“最近有哪些后台任务完成了”，更像一个可预测的事件循环。

      你可以把它看成：把异步事件转换成下一轮的“新观测”。

  - type: md
    title: 工具层：background_run 与 check_background
    body: |
      s08 提供了两类工具入口：

      **background_run**  
      - 输入：command  
      - 输出：立即返回 “Background task <id> started …”

      **check_background**  
      - 输入：可选 task_id  
      - 输出：如果给 task_id，返回该任务状态与结果；如果不提供，列出全部任务简表

      一个容易忽略的实现细节是：**注入到对话里的 background results 往往是截断片段**（为了不把长日志塞爆上下文）。
      如果你需要更完整的输出，通常可以再用 `check_background(task_id)` 拉取一次（仍建议保留长度上限，避免把长日志全部注入）。

      从可迁移角度看，这是一种“任务句柄（handle）”模式：先拿到 id，再用 id 查询状态/结果。
      在更复杂系统里，这个模式还能扩展到：取消任务、重试、流式日志等。

  - type: md
    title: 并发带来的新问题：最小实现里哪些风险还没被完全处理？
    body: |
      引入后台任务后，系统会多出一些“分布式系统味道”的问题（即使你还在单机上）：

      **1) 结果归属与可追溯性**  
      多个任务并行跑时，你需要靠 task_id 把结果对回“当初是谁启动的、为什么启动的、期望是什么”。
      仅靠一段截断文本容易丢关键信息。

      **2) 输出截断与摘要质量**  
      实现里把注入结果截断到一定长度（例如 500 字符）。这对可控性有利，但也可能丢掉关键报错行。

      **3) 共享工作区的副作用**  
      多个后台命令同时读写同一目录，可能互相影响（例如并行写 lockfile、并行编译产物）。
      这类一致性问题需要更强的隔离策略（后续 worktree 课会回到这个主题）。

      **4) 生命周期治理**  
      后台线程用了超时（300s）与 daemon thread 简化生命周期，但更复杂系统往往需要更显式的取消/回收机制。
      另外，示例实现的任务表（`BG.tasks`）是内存态：进程退出后任务与结果不会自动持久化；如果你希望“可恢复的后台任务”，需要把状态写到文件或数据库里。

  - type: md
    title: 动手练习：后台跑命令，同时做另一件事
    body: |
      1) 运行：

      ```bash
      python agents/s08_background_tasks.py
      ```

      2) 试一个可观察的并行例子：
      - 先启动后台：`sleep 5 && echo done`  
      - 在它运行期间，让 agent 创建/编辑一个文件  
      - 等下一轮，看 background results 是否被注入

      3) 微改动（建议）：
      - 在通知注入里加入 `command` 字段（代码里已经保存了 command 截断），观察可追溯性是否更好。  
      - 把 `<background-results>` 改成更结构化的 JSON（例如数组），观察模型是否更容易解析与采取行动。

