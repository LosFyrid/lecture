  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) bash-only 的主要问题不是“不能做”，而是把复杂性塞回模型：输出不稳定、字符串拼接脆弱、工具边界过宽。  
      2) 工具扩展的理想形态是：loop 稳定，变化集中在 handlers 与 tools schema；这能让系统更容易测试与迭代。  
      3) dispatch map 是一种“把变化点集中起来”的工程组织方式：它让新增工具变成局部改动，而不是在控制流里不断加分支。  
      4) safe_path 解决的是“目录逃逸”这一类最基础的问题；更完整的权限与隔离还需要更强的沙箱与审计机制配合。
