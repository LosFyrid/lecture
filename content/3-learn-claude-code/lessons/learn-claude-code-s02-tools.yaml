id: learn-claude-code-s02-tools
title: "第 2 课：工具与分发——用 Dispatch Map 扩展能力，而不重写循环"
summary: |
  把 s01 的“只有 bash”升级为“多工具体系”：工具只是一组 schema + 一组处理函数（handlers）。
  你将学会用 dispatch map 进行工具路由，并理解为什么专用工具能同时提升稳定性与安全边界。
items:
  - type: md
    title: 导入：本课要回答的问题
    body: |
      s01 里我们用 bash 证明了“闭环是可行的”。但当你真的让 agent 写代码时，很快会遇到两个现实问题：
      1) 让模型用 shell 去读/写/改文件，既脆弱又昂贵；  
      2) “能执行任何命令”的工具边界太大，很难把风险收住。

      本课围绕下面几个问题展开：

      1) 为什么“只有 bash”会让系统在可靠性与成本上都变差？  
      2) 添加新工具时，哪些代码属于“循环控制流”，哪些属于“工具能力”？  
      3) 什么是 dispatch map？它解决的不是性能问题，而是什么工程问题？  
      4) 路径沙箱（path sandbox）在工具层怎么做？它能防住哪些逃逸，防不住哪些？

  - type: md
    title: 概念对齐：工具 schema、handler 与 dispatch map
    body: |
      **工具 schema（tools[]）**  
      工具 schema 是你提供给模型的一份“能力说明书”。最常见的字段是：
      - `name`：工具名（模型用它来引用工具）  
      - `description`：模型该在什么场景使用它  
      - `input_schema`：参数结构（哪些字段必填、类型是什么）

      schema 的作用不只是“让模型知道工具存在”，更重要的是让工具调用变得**结构化、可验证、可调试**。

      **handler（处理函数）**  
      handler 是你在代码里真正执行动作的地方：读文件、写文件、编辑文件、运行命令……它接收工具输入，返回字符串或结构化结果（在这个项目里先用字符串简化）。

      **dispatch map（分发映射表）**  
      dispatch map 是一个字典：`{tool_name -> handler}`。  
      它的价值在于把“工具扩展”从“控制流改造”里分离出去：你增加工具时主要改两处——新增 handler、把它挂到 map 上；而 agent loop 本身可以保持稳定。

      这是一种很典型的可维护性设计：让“变化”集中在一个局部，而不是让 `if/elif` 逻辑在循环里越长越难管。

  - type: md
    title: 为什么专用工具通常比 bash 更可靠？
    body: |
      bash 是一种“万能但粗糙”的执行面：它能做很多事，但它把复杂性留给了模型。

      在代码/文档任务里，bash-only 往往会触发三类不稳定：

      **1) 输出与错误不稳定**  
      命令输出可能很长、可能分页、可能混在 stderr 里；模型需要猜“哪些行是关键信息”，而且还要处理被截断的情况。

      **2) 字符串拼接极其脆弱**  
      让模型拼 `sed`/引号/转义在遇到特殊字符时很容易失败。失败以后又会产生更长的“修复尝试”，进一步消耗上下文预算。

      **3) 安全边界太宽**  
      bash 工具天然等价于“允许模型执行一切你能执行的命令”。这会让风险治理变成一句提示词或一个黑名单，而不是一条可审计的权限策略。

      反过来，像 `read_file / write_file / edit_file` 这样的专用工具，把行为收敛到几个明确操作：
      读什么、写什么、替换什么——更容易验证，也更容易限制。

  - type: md
    title: 机制拆解：loop 不变，变的是“工具路由”
    body: |
      这节课最重要的结构性结论是：**循环控制流不需要因为工具变多而变复杂**。

      你可以把 s02 的改动理解成三步：

      1) 为每个工具写一个 handler（例如 `run_read()` / `run_write()` / `run_edit()`）。  
      2) 建立 `TOOL_HANDLERS`：把工具名映射到 handler。  
      3) 在循环里遇到 `tool_use` 时，用 `block.name` 去查 handler 并调用；把结果仍然以 tool_result 回填。

      这意味着：工具扩展主要是一种“数据扩展”（tools 数组 + handlers 字典），而不是“流程扩展”（在 loop 里再加很多分支）。

  - type: md
    title: 工具层的最小安全边界：safe_path() 在防什么？
    body: |
      s02 的一个关键补丁是 `safe_path()`：它把“文件工具能访问的路径”限制在工作目录（workspace）内。

      你可以把它理解成两步检查：
      1) 把用户/模型提供的相对路径拼到 WORKDIR 上，并 `resolve()` 成绝对路径；  
      2) 检查这个路径是否仍然属于 WORKDIR（否则说明它通过 `../` 等方式试图逃逸）。

      这类检查能防住的典型场景是：模型试图读 `../../.ssh/id_rsa` 之类的敏感文件。

      但它防不住的事情也很重要：  
      - 如果 workspace 里本来就有敏感文件，它仍然可以读到；  
      - 如果你提供的工具允许写入，它仍然可能覆写关键文件（只是在 workspace 内）；  
      - 如果你把执行环境直接连到真实机器，bash 仍然是高风险工具（后续课程/其他 track 会讨论更强的沙箱化）。

      因此，safe_path 更像是“工具层最小必要条件”，而不是完整的安全方案。

  - type: md
    title: 动手练习：新增一个“低风险工具”体验扩展方式
    body: |
      目标：在不改 agent loop 主体结构的前提下，新增一个工具并让模型学会用它。

      一个相对低风险、也容易验证的工具是 `list_dir`：
      - 输入：`path`（可选，默认 `.`）  
      - 输出：目录下文件名列表（限制条数，避免爆上下文）

      练习步骤（建议）：
      1) 先跑通 `python agents/s02_tool_use.py`。  
      2) 添加 handler（例如 `run_list_dir()`），并把它挂到 `TOOL_HANDLERS`。  
      3) 在 `TOOLS` 里加上 schema（name/description/input_schema）。  
      4) 用提示测试：“List files in this directory” 并观察模型是否会优先选择 `list_dir` 而不是 bash。

      写下你的观察：当 description 更明确、schema 更结构化时，模型的工具选择会发生什么变化？

