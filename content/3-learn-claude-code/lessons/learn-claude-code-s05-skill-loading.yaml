  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) system prompt 膨胀后容易失效，本质是注意力预算与相关性问题：每轮都携带大量不相关规则，会稀释关键指令。  
      2) 两层注入把“目录”与“正文”分开：让模型低成本知道可用技能，再在需要时通过工具把全文拉进来。  
      3) Layer 1 适合放名称与短描述（帮助选择）；Layer 2 适合放可执行的流程、清单与规范（帮助行动）。  
      4) tool_result 注入长文本时，要留意上下文污染：必要时可以分段加载、结构化输出、或把技能拆成更小模块。
