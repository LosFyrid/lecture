id: learn-claude-code-s05-skill-loading
title: "第 5 课：Skill Loading——两层注入，让知识按需进入上下文"
summary: |
  直接把所有工作流/规范塞进 system prompt，会造成注意力稀释与成本膨胀。本课用“两层技能注入”：
  第一层在 system prompt 里只放技能清单与短描述；第二层通过 load_skill 工具按需把完整技能内容注入到 tool_result。
items:
  - type: md
    title: 导入：本课要回答的问题
    body: |
      当你把 agent 用在更多真实工作流里，你会自然地想给它“规矩”：git 提交流程、测试约定、代码审查清单、项目架构说明……
      最直觉的做法是把这些内容全部写进 system prompt。

      但很快你会遇到两个副作用：
      - system prompt 变得很长，模型对其中部分规则开始“视而不见”；  
      - 其中大多数知识在当前任务里并不相关，却依然占用上下文与成本。

      本课要回答：

      1) 为什么 system prompt 会“膨胀失效”？这和注意力预算有什么关系？  
      2) 怎样让模型“知道有哪些技能可用”，但只在需要时才加载细节？  
      3) 两层注入的边界在哪里：什么该放在 Layer 1，什么该放在 Layer 2？  
      4) 用 tool_result 注入长文本时，怎样降低“污染上下文”的风险？

  - type: md
    title: 概念对齐：Skill 是什么？它和工具、记忆有什么关系？
    body: |
      **Skill（技能）**  
      在本课程语境里，skill 更像一段“可复用的工作法/知识块”：它通常是 Markdown 文档（带元数据），描述你希望 agent 在某类任务里遵循的流程与检查点。

      **Skill vs Tool（知识 vs 能力）**  
      - tool 是“能做什么动作”（读文件、写文件、运行命令）。  
      - skill 是“该怎么做”（流程、规范、清单、偏好）。

      **Skill vs Memory（按需知识 vs 长期记忆）**  
      - memory 更像系统从历史中积累的事实/偏好（可能会变化、会更新）。  
      - skill 更像人为编写的、相对稳定的“作业指导书”（也可以版本化）。

      这节课的重点是：把 skill 当作一种**可加载的知识模块**，而不是一段永远常驻的提示词。

  - type: md
    title: 为什么“全塞进 system prompt”会出问题？
    body: |
      system prompt 并不是“越长越强”的地方。

      从工程角度看，长 system prompt 至少带来三类问题：

      **1) 注意力稀释**  
      规则越多，模型越难在当前任务里判断“哪条规则最重要”，于是会出现选择性忽略。

      **2) 成本与延迟**  
      system prompt 是每一轮调用都会携带的输入。把大量不相关内容常驻，会让每轮 token 成本上升。

      **3) 相关性反而下降**  
      你往往只需要其中一小段（例如 code review 清单），但它被埋在大量无关内容里。

      因此，与其把所有知识前置，不如让模型“先看到目录”，需要时再翻到正文。

  - type: md
    title: 两层注入：目录常驻，正文按需
    body: |
      这节课的核心结构是“两层注入”：

      **Layer 1（常驻、低成本）**  
      在 system prompt 里只放技能清单：技能名 + 简短描述（可带 tags）。
      目标是让模型知道“有哪些选项”，但不强迫它每轮都阅读技能全文。

      **Layer 2（按需、高成本）**  
      提供一个 `load_skill` 工具。当模型判断某个技能相关时，它调用该工具。
      工具返回完整技能正文，并用明确的边界标签包裹（示例里使用 `<skill name="..."> ... </skill>`）。

      你可以把这理解成软件工程里常见的 **lazy loading（懒加载）**：先加载索引，只有真正访问时才加载内容。

  - type: md
    title: 代码走读：SkillLoader 做了什么？
    body: |
      `agents/s05_skill_loading.py` 里有一个 `SkillLoader`，主要做三件事：

      1) **加载技能文件**：遍历某个目录下的 `*.md` 文件，把每个文件当作一个 skill。  
      2) **解析元数据**：用 frontmatter（`--- ... ---`）解析出 `description/tags` 等字段。  
      3) **提供两种视图**：  
         - `get_descriptions()`：用于 Layer 1，把每个 skill 的短描述拼成清单；  
         - `get_content(name)`：用于 Layer 2，返回完整正文并加上边界标签。

      注意一个容易忽略的细节：当 skill 不存在时，返回的错误信息会列出可用 skill 名称。
      这能帮助模型“纠正拼写”和“重新选择”，也让调试更容易。

  - type: md
    title: 一个实践问题：.skills 目录与 skill 组织方式
    body: |
      在这份教学实现里，脚本默认从工作目录下的 `.skills/` 读取 `*.md`。
      如果目录不存在，技能清单会显示为 “(no skills available)”。

      你在 clone 上游仓库后，可能会注意到：仓库里自带的是 `skills/` 目录（通常是 `skills/<name>/SKILL.md` 这种分目录结构），而不是 `.skills/`。
      这不是“概念冲突”，而是**教学代码为了简化读取逻辑**做的一种文件组织取舍：s05 的脚本只需要演示“两层注入”的机制，所以用平铺的 `.skills/*.md` 来降低实现复杂度。

      为了复现本课，你可以用两种等价做法（选一种即可）：

      - **做法 A（更推荐，教学更清晰）**：新建 `.skills/`，手写 1-2 个很短的 skill，让你能清楚观察“目录常驻 + 正文按需加载”的行为变化。  
      - **做法 B（利用仓库自带内容）**：把 `skills/<name>/SKILL.md` 复制并重命名到 `.skills/<name>.md`（或做一个软链接）。  
        只要文件包含 YAML frontmatter（`--- ... ---`），SkillLoader 就能解析出 description/tags 并按需注入正文。

      这提醒了一个可迁移的工程点：skill 的“存放位置与组织方式”本质上是产品设计的一部分。
      你可以用很多等价方案：
      - 平铺文件（`.skills/*.md`）  
      - 分目录组织（`skills/<name>/SKILL.md`）  
      - 远端拉取与缓存（把 skill 变成可更新资源）

      不同组织方式的权衡是：可维护性、可版本化、以及“模型能否稳定找到它要的那一份”。

  - type: md
    title: 动手练习：写一个你自己的 skill，并观察按需加载是否发生
    body: |
      目标：让模型先看到“技能目录”，再主动调用 `load_skill` 拉取全文。

      1) 准备一个最小 skill（示例思路）：
      - 名称：`pytest`  
      - description：如何为 Python 模块补最小单元测试  
      - 正文：一个 5 步 checklist（写测试→运行→修失败→再运行→提交）

      2) 创建目录并写入文件（示例）：

      ```bash
      mkdir -p .skills
      ```

      然后创建 `.skills/pytest.md`，确保带有 frontmatter（哪怕只有 description 也可以）：

      ```md
      ---
      description: Minimal pytest workflow
      ---

      # Pytest workflow (minimal)

      1) Write the smallest failing test
      2) Run pytest
      3) Fix the implementation
      4) Run pytest again
      5) Commit with a clear message
      ```

      3) 运行：

      ```bash
      python agents/s05_skill_loading.py
      ```

      4) 用一个提示触发：
      - “I need to add tests for this function. Load the relevant skill first.”

      观察点：
      - 模型是否先列出/引用技能清单？  
      - 它是否真的调用了 `load_skill`？  
      - 加载的技能是否在后续行为里体现为具体步骤，而不是一句口号？

