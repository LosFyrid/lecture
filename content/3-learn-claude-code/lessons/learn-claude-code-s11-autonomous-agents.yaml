id: learn-claude-code-s11-autonomous-agents
title: "第 11 课：Autonomous Agents——空闲轮询 + 自动认领，让队友自己找活干"
summary: |
  在 s09-s10 中，队友需要被明确指派才能工作。要扩展到更多任务，队友需要具备“自找工作”的机制。
  本课引入 idle cycle：队友在空闲阶段轮询收件箱与任务看板，发现未认领任务就自动 claim 并进入工作阶段；
  同时加入身份重注入，避免上下文被压缩/重置后忘记自己是谁。
items:
  - type: md
    title: 导入：本课要回答的问题
    body: |
      让多个队友协作之后，一个新的瓶颈会出现：lead 的分配成本。
      如果任务看板上有 10 个待办，而你必须逐个 spawn/逐个发指令，团队并不会真正“自治”，只是把执行分散到了多个线程。

      本课要回答：

      1) “自治”在工程上意味着什么？它不是“模型更强”，而是什么机制更完整？  
      2) 队友如何在没有新指令时进入空闲，又如何在出现新工作时恢复？  
      3) 任务自动认领（auto-claim）具体认领了什么状态？怎么避免两个队友抢同一个任务？  
      4) 为什么上下文压缩后，队友可能会忘记自己的身份？身份重注入解决的是什么问题？

  - type: md
    title: 概念对齐：自治 = 任务来源外置 + 可重复的认领规则
    body: |
      这节课的“自治”不是让模型凭空产生目标，而是让工作从一个外部可观察来源中产生：
      - inbox（别人发来的请求）  
      - task board（共享任务看板）

      队友在空闲时重复执行同一个规则：
      - 有消息就处理消息；  
      - 没消息就看任务看板；  
      - 有可认领任务就认领并开始做；  
      - 都没有就等待一段时间，超时后自行关机。

      这让自治看起来更像“事件循环 + 工作窃取”，而不是“完全自由的智能体”。

  - type: md
    title: 机制：WORK / IDLE 两阶段循环
    body: |
      s11 把队友的生命周期拆成两个阶段：

      **WORK 阶段**  
      仍然是熟悉的 agent loop：读 inbox、调用 LLM、执行工具、回填 tool_result。
      当出现两种情况之一，就从 WORK 进入 IDLE：
      - 模型不再请求工具（stop_reason != tool_use）  
      - 模型显式调用 `idle` 工具，表示“我暂时没有更多工作”

      **IDLE 阶段**  
      队友不调用 LLM，而是每隔固定间隔（示例里 5 秒）轮询：
      - 收件箱是否有新消息  
      - 任务看板是否有可认领任务

      如果在空闲窗口（示例里 60 秒）内找到工作，就恢复到 WORK；否则进入 shutdown。

  - type: md
    title: 任务看板轮询：哪些任务算“可认领”？
    body: |
      s11 复用 s07 的 `.tasks/` 作为共享看板，并定义了一个非常明确的“可认领”过滤条件：
      - `status == "pending"`  
      - `owner` 为空（未认领）  
      - `blockedBy` 为空（没有前置依赖阻塞）

      这三个条件让队友避免做两件事：
      - 抢别人的活（owner 已有值）  
      - 抢一个还没轮到做的活（blockedBy 非空）

      你可以把这看成：自治的前提是“任务状态足够结构化”，否则队友很难稳定判断下一步。

  - type: md
    title: claim_task：认领动作如何落到文件系统状态？
    body: |
      认领不是一句话，而是一次状态写入：
      - 把任务 JSON 的 `owner` 写成自己的名字  
      - 把 `status` 改成 `in_progress`

      这样，其他队友在下一次扫描时就会看到 owner 已存在，从而跳过它。

      为了降低“两个队友同时认领同一任务”的风险，教学实现使用了一把 `_claim_lock`，
      在同一进程内让 claim 操作互斥执行。

      需要注意：这把锁只在单进程内有效。如果你把队友放到多个进程/多机上运行，还需要更强的原子认领机制（例如文件锁、CAS、或把任务状态搬进支持并发的存储）。

  - type: md
    title: 身份重注入：为什么要把“你是谁”写回上下文？
    body: |
      当上下文被压缩、或者被某种机制重置为很短的摘要时，队友可能出现一种微妙漂移：
      - 它忘了自己是 alice 还是 bob  
      - 它忘了自己的 role（coder/tester）  
      - 它开始用不符合角色的方式行动（例如 tester 去改大量业务逻辑）

      s11 的做法是：当 messages 变得很短（示例里用 `len(messages) <= 3` 作为启发式），
      在 messages 开头插入一个 `<identity>...</identity>` 块，显式提醒：
      “你是谁、角色是什么、属于哪个 team、请继续工作”。

      这不是万能方案，但它表达了一个可迁移原则：当你会做对话级压缩时，**关键身份与约束需要被重新注入**，
      否则 agent 可能在“失忆”后重新定义自己的目标。

  - type: md
    title: 动手练习：创建任务看板，让两个队友自动认领
    body: |
      1) 运行：

      ```bash
      python agents/s11_autonomous_agents.py
      ```

      2) 在看板上创建 3 个任务（可以用上一课的 task 工具，或直接写 JSON 文件），然后 spawn 两个队友。

      3) 观察：
      - 队友是否会进入 idle 并开始轮询？  
      - 是否会自动认领一个 `pending + 无 owner + 无 blockedBy` 的任务？  
      - 认领后 `.tasks/task_*.json` 是否出现 owner 与 in_progress？  
      - 在 `/tasks` 视图里，任务是否被正确标注 owner？

      4) 微改动（建议）：
      - 把 `POLL_INTERVAL` 改小或改大，观察自治反应速度与资源消耗的权衡。  
      - 在 claim 时额外写入一个 `claimed_at` 时间戳，观察这是否有助于调试与审计。

