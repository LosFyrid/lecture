  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) 自治的工程含义是：任务来源外置（inbox/task board），认领规则稳定可重复；不是让模型凭空发明目标。  
      2) WORK/IDLE 两阶段把“推理”与“等待事件”分开：工作时调用 LLM，空闲时轮询外部状态并在有新工作时恢复。  
      3) auto-claim 的本质是对共享状态的写入：owner + in_progress；避免抢任务需要互斥与更强的原子认领（单进程 lock 只是教学近似）。  
      4) 身份重注入解决的是“压缩/重置后的角色遗忘”：当上下文变短时，关键身份与约束需要显式写回 messages。
