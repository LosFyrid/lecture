  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) 长对话的 drift 更像“注意力被新信息稀释”：工具结果变多、上下文变长，计划与约束更容易被挤到边缘。  
      2) TodoManager 的价值在于把计划变成结构化状态：可验证、可渲染、可反复更新，既给模型看也给人看。  
      3) nag reminder 的关键不是一句提醒文本，而是“运行时注入”这件事：当系统检测到偏离（多轮不更新）时，把提醒放到模型下一轮一定会看到的位置。  
      4) “单一 in_progress”是一种对抗上下文切换的简化策略：让系统先学会稳定推进，再考虑并行化。
