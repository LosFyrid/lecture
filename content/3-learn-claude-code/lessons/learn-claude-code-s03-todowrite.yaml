id: learn-claude-code-s03-todowrite
title: "第 3 课：TodoWrite——把“计划与进度”外化成可更新的状态"
summary: |
  多步任务里，agent 容易重复、跑偏或半途改计划。本课用一个可见的 TodoManager 让模型把计划写成结构化状态，
  并通过 nag reminder 在它“忘了更新计划”时把提醒注入上下文，降低长对话漂移带来的失控。
items:
  - type: md
    title: 导入：本课要回答的问题
    body: |
      当任务只有两三步时，模型通常能“凭感觉”把它做完；但一旦任务变成十几步（重构、迁移、补测试、修 CI），你会看到一些典型现象：
      - 它做了 1-3 步之后开始即兴发挥，忘了后面的目标；
      - 它重复做已经完成的事（反复读同一个文件、反复改同一段代码）；
      - 你很难知道它现在“认为自己在做什么”，更难在中途纠偏。

      本课要回答：

      1) 为什么长对话会让 agent 更容易“漂移”（drift）？这和上下文窗口有什么关系？  
      2) 怎样让“计划”从一段自然语言，变成一个可检查、可更新的状态？  
      3) nag reminder 注入在机制上做了什么？为什么它不是单纯的提示词？  
      4) “同一时间只允许一个 in_progress”这种约束，工程上在防什么？

  - type: md
    title: 概念对齐：计划、状态与漂移（drift）
    body: |
      **计划（plan）**  
      这里的“计划”不是指模型说几句“我将先做 A 再做 B”，而是一个能被重复更新的对象：哪些待办存在、当前正在做哪一项、哪些已经完成。

      **结构化状态（structured state）**  
      结构化状态指：它有固定字段（例如 `id/text/status`），可以验证（合法值/数量限制），可以渲染成一致的视图。
      它的价值在于：即使对话变长、上下文变复杂，你仍然能用“字段级”的方式把进度带回模型的注意力中心。

      **漂移（drift）**  
      drift 可以粗略理解为：随着对话轮次与工具结果增多，模型在局部噪声里投入了更多注意力，
      早期指令（例如“你的目标是什么”“你应该按什么顺序做”）的影响逐步被稀释，导致行为偏离原先的轨道。

      这不是“模型突然变笨”，更像是“工作记忆被新信息挤占”。因此，解决方案往往不是加更多信息，
      而是让关键状态以更强的形式反复出现。

  - type: md
    title: 机制一：TodoManager——让模型把计划写成可验证的对象
    body: |
      s03 引入了一个新的工具：`todo`。它背后是一个 `TodoManager`，负责做两件事：

      1) **验证（validate）**：检查每一项是否有文本、状态是否合法、数量是否超限。  
      2) **存储与渲染（store & render）**：把 todo 列表保存到内存里，并渲染为一段清晰的进度视图返回给模型与用户。

      在实现里，每个 todo item 形如：
      - `id`：字符串 ID（例如 "1"）  
      - `text`：待办描述  
      - `status`：`pending / in_progress / completed`

      你可以把它理解成：把“工作记忆”外置到一个很小的状态机里，让模型每隔一段时间就把“我现在在做什么”写回去。

  - type: md
    title: 机制二：nag reminder——把“忘了更新”变成可见事件
    body: |
      仅仅“提供 todo 工具”还不够：模型可能在执行中途忘记更新 todo，于是 todo 逐步失真，最后又回到 drift 的问题上。

      s03 的做法是加一个非常小的控制机制：**计数器 + 注入**。

      - 代码维护一个 `rounds_since_todo` 计数器：记录“连续多少轮没有调用 todo”。  
      - 当计数器达到阈值（示例里是 3），就把一段 `<reminder>...</reminder>` 文本插入到最近一条 user 消息的内容块里，
        让模型在下一次推理时“必然看到”这条提醒。

      这和“在 system prompt 里写一句‘记得更新 todo’”的差别在于：  
      **注入发生在运行时、发生在失败出现之后，并且以更强的上下文位置出现**。
      它属于 harness/控制层的动作，而不是模型自己“自觉遵守”。

      这里的阈值（3 轮）主要是为了教学可见性：让你在短对话里也能观察到注入发生；在更长任务里，阈值与策略通常会随系统而调整。

  - type: md
    title: 一个看似“苛刻”的约束：为什么只允许一个 in_progress？
    body: |
      TodoManager 里有一个规则：同一时刻最多只能有一个 `in_progress`。

      你可以把它理解成一种“上下文切换成本治理”：
      - 如果同时有多个 in_progress，模型更容易在多个子任务之间来回跳，导致每个子任务都推进很慢；  
      - 工具结果与局部上下文会交织在一起，长任务里更容易出现“我刚才做到哪了”的遗忘；  
      - 当你要评估/调试时，也很难判断“当前这一轮到底应该推进哪个目标”。

      当然，这不是唯一合理约束；但它很适合作为学习阶段的默认：先让系统形成稳定节奏，再谈并行与分叉。

  - type: md
    title: 动手练习：把 todo 变成你自己的“任务仪表盘”
    body: |
      1) 运行：

      ```bash
      python agents/s03_todo_write.py
      ```

      2) 观察（建议）：
      - 模型是否会在开始前先列 todo？  
      - 它是否会把当前项标记为 in_progress，并在完成后改成 completed？  
      - 当它连续几轮不更新 todo 时，你能否看到 reminder 被注入？

      3) 微改动（任选其一）：
      - 把 “3 轮” 阈值改为 1 或 5，观察 agent 的节奏如何变化。  
      - 在 `TodoManager.update()` 里把最大 todo 数从 20 改小（例如 8），观察模型会不会学会合并/抽象任务。  
      - 把 `render()` 的格式改成更紧凑的版本（例如每行更短），观察这会不会让模型更愿意频繁更新。

      练习自检：你能否用一句话说清楚 nag reminder “注入”的具体位置与触发条件？

  - type: md
    title: 原文阅读
    body: |
      - 日期：2026-02-26（仓库快照）
