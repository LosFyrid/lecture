id: learn-claude-code-references
title: "参考与下一步：从教学实现迁移到你的 Agent 项目"
summary: |
  提供上游仓库索引、目录导览与迁移路线：你可以把本 track 当作一套“可运行的设计模式库”，再按需求把机制移植到自己的代码库中。
items:
  - type: md
    title: 导入：学完 12 课之后，下一步关心什么？
    body: |
      学完 s01-s12，你已经见过一套终端编程 agent 的关键机制：loop、工具路由、计划、隔离、压缩、持久化、并发、团队协议、自治与 worktree 隔离。

      下一步通常会出现两类问题：

      1) 如果我要把这些机制迁移到我自己的项目里，应该从哪里开始？怎样避免一次性引入过多复杂度？  
      2) 教学实现刻意简化了很多生产机制（权限、审计、评估、恢复）；我应该如何补齐？

      本节把这些问题整理成一个可执行的迁移路线与目录索引。

  - type: md
    title: 上游仓库导览：优先看哪些目录？
    body: |
      上游仓库的关键目录可以这样理解：

      - `agents/`：每一课对应一个 Python 脚本（s01→s12），以及 `s_full.py` 的整合版。  
      - `docs/{zh,en,ja}/`：每一课的讲解文档（问题→方案→图→最小代码）。  
      - `web/`：可选的交互式学习平台（Next.js），不影响命令行脚本运行。  
      - `skills/`：示例技能库（用于“按需知识注入”的概念演示）。  

      如果你的目标是“理解机制并迁移”，优先级通常是：先 agents（可运行）→ 再 docs（解释与动机）→ 再 web（交互展示）。

  - type: md
    title: 迁移路线：每次只引入一个机制
    body: |
      把教学实现迁移到真实项目时，一个常见风险是：你一次性把所有机制都搬过去，结果系统复杂度飙升，难以定位行为变化来自哪里。

      更稳的路线通常是“按问题驱动引入”：

      1) **先固定骨架（s01+s02）**：loop + tools + dispatch map。先让“能执行、能回流、能扩展”成立。  
      2) **再补可见进度（s03）**：当你发现多步任务在中途跑偏或重复时，再引入结构化计划/进度。  
      3) **再补上下文治理（s04+s06）**：当探索污染主上下文、长任务开始漂时，引入 subagent 隔离与 compaction。  
      4) **再补持久化与并发（s07+s08）**：当你需要跨会话/跨 agent 的状态，或需要并行跑慢命令时再引入。  
      5) **最后再做团队协议与隔离执行面（s09-s12）**：当你确实需要多人/多线程协作与并行改动时，再把协议、自治与 worktree lane 引入。

      这条路线的核心不是“严格按课号”，而是把每个机制当作对一种失败模式的补丁：先遇到问题，再引入对应机制。

  - type: md
    title: 生产化补齐：哪些能力在教学实现里是“留白”的？
    body: |
      上游仓库刻意省略了一些生产关键件。迁移时，你通常需要补齐：

      - **权限与隔离**：更强的沙箱、最小权限、危险操作的显式确认与审计。  
      - **评估与回归**：离线回归集、在线监控、trace 采样与故障复盘机制。  
      - **一致性治理**：文件持久化状态在并发写入下的锁/原子写/乐观并发控制。  
      - **生命周期管理**：会话恢复、任务恢复、worktree 回收策略，以及更可靠的停机/取消语义。

      这些能力和 s01-s12 的主线关系是：它们不是替代 loop 的“新架构”，而是让 loop 在真实世界里可持续运行的工程层。

