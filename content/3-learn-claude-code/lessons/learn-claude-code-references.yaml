  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) 迁移的更稳策略是“问题驱动 + 单一改动”：先固定 loop 与工具，再根据失败模式逐步引入计划、隔离、压缩、持久化、协作协议与 worktree。  
      2) 教学实现的留白（权限、评估、一致性、生命周期）往往是生产落地的主要成本；把它们当作独立的工程模块补齐，会比重写整个 agent loop 更可控。
