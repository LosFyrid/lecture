  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) 编程任务需要多轮闭环，核心原因不是“模型不够聪明”，而是任务需要**真实反馈**：运行结果、报错、文件状态，都会改变下一步动作。  
      2) agent loop 循环的不是“同一句话”，而是一段可观测的状态：messages 里记录了意图与结果，外部世界提供了新的观测。  
      3) `stop_reason` 只是一个实现层信号；可迁移的概念是：你需要清晰判断“这一轮是否产生了待执行动作”。  
      4) 把 bash 当工具最大的风险是“执行面的破坏性”；最小闸门可以是超时、危险命令拦截、以及（更重要的）把执行放进受控的沙箱边界里。
