id: learn-claude-code-s01-agent-loop
title: "第 1 课：Agent Loop——把一次对话变成可执行的闭环"
summary: |
  认识 coding agent 的最小形态：一个循环负责“调用模型→执行工具→回填结果→继续/停止”。
  你将理解 stop_reason / tool_use / tool_result 的控制语义，并用代码读懂这套闭环如何落到 messages[] 上。
items:
  - type: md
    title: 导入：本课要回答的问题
    body: |
      如果你把 LLM 当作“能写代码的聊天机器人”，你很快会遇到一种挫败：它能解释、能建议，但**它无法自己去做**。
      coding agent 的第一件事，就是把“建议”变成“行动”，并且让行动的结果能反过来改变下一步决策。

      读完本课，你可以尝试回答：

      1) 为什么写代码这类任务通常需要多轮“观察→行动→再观察”，而不只是一次生成？  
      2) 所谓 *agent loop* 到底循环了什么？循环的“状态”存在哪里？  
      3) 模型什么时候想调用工具？代码里用什么信号判断“该停了”？  
      4) 把 shell（bash）当工具有什么天然风险？最小的安全闸门可以是什么？

  - type: md
    title: 概念对齐：Chat 调用、Tool Use 与 Agent Loop
    body: |
      先把几个术语对齐到工程可实现的含义上。

      **Chat 调用（一次性对话基线）**  
      这里把 “chat” 当作一种常见基线：你给模型一个输入，它给你一个输出，中间没有“可执行动作”与“动作结果回流”这条链路。
      它适合解释与头脑风暴，但对“需要在真实环境里试错”的任务天然受限。

      **Tool use（工具调用）**  
      Tool use 指模型在输出里不直接给最终答案，而是提出一个“请执行这个工具”的请求，例如：
      - 运行一条命令（bash）
      - 读一个文件
      - 调用一个函数

      执行工具得到的结果（tool result）会成为新的“观测”，再喂回给模型。

      **Agent loop（智能体循环）**  
      Agent loop 是把上面两件事组织成控制流的一层：重复执行“调用模型→如果有工具请求就执行→把结果写回上下文→继续”，直到模型不再请求工具。

      **stop_reason（停止原因）**  
      在这份实现里，SDK 会给出 `stop_reason` 字段：  
      - `stop_reason == "tool_use"`：表示模型的输出包含工具请求（需要你执行工具）。  
      - `stop_reason != "tool_use"`：表示模型此轮不需要工具（通常意味着它认为可以收尾或给出回答）。

      不同供应商/SDK 对这个信号的命名与暴露方式可能不同，但概念是类似的：你需要一个明确的“是否还有动作要做”的判据。

  - type: md
    title: 最小闭环：messages[] 如何承载“状态”
    body: |
      这门课的一个关键取舍是：**把状态尽量压在 `messages[]` 里**。
      这样你可以直观看到循环每一轮到底发生了什么：模型看到了什么、提出了什么动作、工具返回了什么、下一轮又怎样继续。

      一个最小闭环可以用这张图理解：

      ```
      User prompt
         ↓
      messages[]  --(LLM + tools schema)-->  assistant response (text + tool_use blocks)
         ↑                                               ↓
         |                                       execute tools
         |                                               ↓
      append tool_result blocks  <-------------------  observations
      ```

      这里的“状态”不是一个神秘对象，它主要由两类东西组成：
      1) 累积对话与中间产物（写在 messages 里）  
      2) 外部世界的变化（文件、进程输出、测试结果等），以 tool_result 的形式被“搬运”回 messages

      你可以把它类比成：模型在做决策，工具在改变世界；而 messages 是两者之间的“唯一通信总线”。

  - type: md
    title: 机制拆解：一次循环里到底发生了什么？
    body: |
      把“循环”拆成可实现的 6 个动作，会更容易读懂代码（并在后续课程里逐步改造它）：

      1) **把用户输入写进 messages**：让模型看到任务。  
      2) **携带 tools schema 调用模型**：让模型知道“它能做什么动作”。  
      3) **把 assistant 输出追加回 messages**：保留模型当轮的思考产物（文本/工具请求）。  
      4) **判断是否需要执行工具**：这一份实现使用 `stop_reason == "tool_use"` 作为信号。  
      5) **执行每个 tool_use**：把请求翻译成实际执行（这里是运行 bash 命令）。  
      6) **把 tool_result 写回 messages**：让下一轮模型基于真实结果继续推进。

      这 6 步的顺序有两个细节值得注意：
      - **先记录再执行**：先把模型输出写进 messages，再去执行工具。这样后续你做 tracing/回放时能看到“当时它是怎么想的”。  
      - **结果要可关联**：tool_result 需要带上 `tool_use_id`，否则多工具、多并发时你会丢失“哪个结果对应哪个请求”。

  - type: md
    title: 代码走读：这个最小实现在哪里“刻意简化”？
    body: |
      在 `agents/s01_agent_loop.py` 里，你会看到三个对后续课程非常重要的“刻意简化”：

      **1) 只有一个工具：bash**  
      这能把注意力集中在“闭环控制流”上，而不是工具路由。但也意味着：在真实系统里你需要更细的工具边界与权限。

      **2) 退出条件非常单一**  
      只要模型不请求工具就停。生产系统往往还会加：最大轮次、超时、预算（token/费用）、异常重试、人工确认等。

      **3) 安全闸门是最小的字符串黑名单**  
      `run_bash()` 里用危险命令片段做拦截，并设置了 120 秒超时。这足够让学习时“不至于一键把机器搞坏”，但并不等价于生产沙箱。

      这三点并不是缺陷，而是教学策略：先把骨架搭出来，再逐步增加“系统要为不确定性付出的工程成本”。

  - type: md
    title: 动手练习：用一个小改动验证你真的理解了 loop
    body: |
      本课的练习目标不是“写更多代码”，而是确认你能把 loop 的关键机制说清楚、改对、并解释行为变化。

      1) 运行（先跑通一次）：

      ```bash
      python agents/s01_agent_loop.py
      ```

      2) 做一个微改动（任选其一）：
      - 把 `run_bash()` 的 `timeout` 改成更短（例如 10 秒），观察长命令会如何失败、错误怎样回流到模型。  
      - 在危险命令列表里加一条你认为也应该被拦截的模式（例如写入某个敏感路径），观察模型如何调整策略。  
      - 给 tool schema 增加更清晰的描述（description），观察模型的工具使用是否更稳定。

      3) 用两三句话写下你的观察（建议写在自己的实验笔记里）：
      - “模型的下一步决策”是如何依赖 tool_result 的？  
      - 哪个信息如果不回填，它会开始瞎猜？

