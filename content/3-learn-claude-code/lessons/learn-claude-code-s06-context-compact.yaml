id: learn-claude-code-s06-context-compact
title: "第 6 课：Context Compact——分层压缩，让长任务不断档"
summary: |
  长任务会把 messages[] 撑爆：工具输出越多，上下文越长，成本越高、行为越漂。本课实现一个三层压缩管线：
  micro-compact 静默清理旧 tool_result，auto-compact 接近阈值时自动摘要，manual compact 允许模型按需触发压缩。
items:
  - type: md
    title: 导入：本课要回答的问题
    body: |
      当你让 agent 在一个稍大的代码库上工作时，它的工作方式往往是：
      读文件 → 跑测试 → 看到错误 → 再读文件 → 再改 → 再跑……
      每一步都会把新的输出塞进 messages[]。很快你会遇到两类问题：

      - **硬失败**：上下文超过模型上限，API 调用直接报错。  
      - **软退化**：还没到上限，但模型开始变慢、变“健忘”、开始忽略早期约束。

      本课要回答：

      1) 为什么“把所有工具输出都保留”会让长任务不可持续？  
      2) 压缩到底压缩的是什么？哪些信息适合被遗忘，哪些必须保留？  
      3) micro / auto / manual 三层分别解决什么问题？为什么需要分层？  
      4) 把完整历史写入磁盘 transcript，有什么工程意义？

  - type: md
    title: 概念对齐：context window、token 预算与“软退化”
    body: |
      **context window（上下文窗口）**  
      指一次模型调用能处理的输入 + 输出 token 总量上限。超过上限就会硬失败。

      **token 预算（token budget）**  
      指你愿意为一个任务花多少钱、等多久。即使没超过上限，token 过大也会带来延迟与成本上升。

      **软退化（soft degradation）**  
      指在长上下文里常见的一类现象：模型仍能工作，但更容易：
      - 忽略早期提示（目标/约束被稀释）  
      - 被最近的噪声牵着走（例如长日志、长文件片段）  
      - 在“看似相关”的片段间产生冲突或混淆

      因此，长任务的关键不是“无限加上下文”，而是让上下文随任务推进被持续整理。

  - type: md
    title: 三层压缩管线：从“静默清理”到“对话重置”
    body: |
      这节课把压缩做成三层，按“激进程度”递增：

      **Layer 1：micro-compact（每轮静默执行）**  
      目标：不改变对话结构，只把很旧、很长的 tool_result 替换成占位符，避免它们永久占用上下文。
      例如把一段旧的 read_file 输出替换成：`[Previous: used read_file]`。

      **Layer 2：auto-compact（超过阈值自动触发）**  
      目标：在接近上下文上限之前做一次“对话级摘要”，把全量 messages 压缩成一段 continuity summary，
      然后用这段 summary 作为新的起点继续工作。

      **Layer 3：manual compact（模型/用户按需触发）**  
      目标：允许模型在它“感觉到上下文开始混乱”时主动触发压缩，而不是等系统阈值触发。

      你可以把它类比成：垃圾回收（micro）+ 快照压缩（auto）+ 手动清理（manual）。

  - type: md
    title: Layer 1（micro）：替换旧 tool_result，而不是删掉一切
    body: |
      micro-compact 的关键策略是：**保留最近的少量工具结果细节，其余用可识别的占位符替换**。

      在实现里有两个参数：
      - `KEEP_RECENT = 3`：保留最近 3 个 tool_result 的完整内容  
      - “长度阈值”：只有当 tool_result 内容超过一定长度（示例里 > 100 字符）才会被替换

      为什么不是“删掉旧结果”？
      - 占位符仍然能告诉模型“发生过一次工具调用”，并且工具名是什么；  
      - 这让摘要与回放更容易：你知道这里曾经读过文件/跑过命令，只是细节被移出了活跃上下文。

      另一个容易忽略的工程点是：为了生成占位符中的 `{tool_name}`，代码需要从 assistant 的 tool_use 块里反向建立 `tool_use_id -> tool_name` 的映射。
      这就是“可关联性”在长任务里的价值：没有 id，你很难把结果和调用对上。

  - type: md
    title: Layer 2（auto）：保存 transcript，再让模型写 continuity summary
    body: |
      当估算 token 超过阈值（示例里 `THRESHOLD = 50000`）时，auto-compact 做两件事：

      **1) 把完整历史写入磁盘**  
      保存为 `.transcripts/transcript_<timestamp>.jsonl`。这一步的意义是：  
      “遗忘”发生在活跃上下文里，但系统仍保留可追溯的全量记录，便于你后续调试或回放。

      **2) 调用模型做摘要，并重置 messages**  
      代码会把对话序列化成 JSON（截断到一定长度），要求模型输出一个摘要，包含：
      - 已完成了什么  
      - 当前状态是什么  
      - 做过哪些关键决策

      然后系统用两条新消息替换全部历史：  
      - user：带着 “[Conversation compressed …] + summary”  
      - assistant：确认“我理解了，将继续”

      这等价于把长对话“折叠”为一个更短的状态描述，再继续推进任务。

  - type: md
    title: Layer 3（manual）：把“压缩”做成一个工具
    body: |
      manual compact 的设计点在于：让“我要压缩一下”变成模型可以触发的动作。

      在实现里，这个动作体现为一个工具：`compact`。
      当模型调用该工具时，系统会在本轮结束后立即运行同样的 `auto_compact()` 流程（保存 transcript + 摘要 + 重置 messages）。

      这种设计有一个可迁移的意义：压缩不必总是由系统阈值驱动，它也可以是模型的自我调节行为。
      在更复杂系统里，你还可以把 `focus` 之类的字段用于指导摘要“保留哪些状态信息”。

  - type: md
    title: 重要但容易误读的细节：token 估算是启发式
    body: |
      这份实现用 `len(str(messages)) // 4` 估算 token。
      这不是精确计数，只是为了教学与演示。

      在真实系统里，如果你用这个启发式直接做预算与门控，可能会出现两类偏差：
      - 对不同语言/不同格式的文本估算不稳定（JSON 往往更“吃 token”）  
      - 对模型的真实上限缺乏精确对齐（可能过早压缩，也可能压缩不及时）

      但启发式依然能说明关键思想：**你需要把“上下文管理”做成工程机制，而不是靠运气**。

  - type: md
    title: 动手练习：触发一次 auto-compact，并检查 transcript
    body: |
      1) 运行：

      ```bash
      python agents/s06_context_compact.py
      ```

      2) 让它产生大量 tool_result（示例思路）：
      - “Read every Python file in agents/ directory one by one, then summarize what you saw.”

      3) 观察两类现象：
      - micro-compact 是否开始把旧 tool_result 替换为占位符？  
      - 当 token 估算超过阈值时，是否出现 “[auto_compact triggered]” 并生成 `.transcripts/transcript_*.jsonl`？

      4) 微改动（任选其一）：
      - 把 `THRESHOLD` 改小（例如 5000），更容易触发 auto-compact；  
      - 修改摘要提示词，让它额外保留“当前正在修改哪些文件、下一步要跑哪些测试”；观察摘要质量如何影响后续行为。

  - type: md
    title: 原文阅读
    body: |
      - 日期：2026-02-26（仓库快照）
      - 来源：shareAI-lab/learn-claude-code（MIT，commit: ff8acd8）
