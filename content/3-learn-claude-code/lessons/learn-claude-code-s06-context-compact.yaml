  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) 长任务不可持续的根因不是“任务太难”，而是上下文累积：工具输出把注意力预算占满，最终导致硬失败或软退化。  
      2) 压缩压的是“中间观测的细节”，不是压掉一切：micro-compact 用占位符保留“发生过什么”，同时释放 token。  
      3) 分层的原因是不同粒度的问题需要不同力度：日常清理（micro）与必要时的对话重置（auto/manual）是两种机制。  
      4) transcript 的意义在于把“活跃上下文的遗忘”与“系统可追溯性”分离：你可以让模型忘，但系统不必真的丢历史。
