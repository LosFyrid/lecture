id: learn-claude-code-s12-worktree-task-isolation
title: "第 12 课：Worktree + Task Isolation——控制面/执行面分离，避免并行改动互相污染"
summary: |
  当多个 agent 并行改同一个工作目录时，未提交变更会互相干扰，任务状态也会和实际修改脱节。
  本课用 git worktree 做目录级隔离：任务板（.tasks/）作为控制面定义“做什么”，worktree（.worktrees/）作为执行面定义“在哪做”，两者用 task_id 显式绑定，并用事件流记录生命周期。
items:
  - type: md
    title: 导入：本课要回答的问题
    body: |
      到了 s11，你已经能让队友自动认领任务并协同推进。
      但如果所有任务仍然共享同一个工作目录，“并行”很容易变成“互相污染”：
      - 两个任务同时改同一个文件，彼此的未提交变更会出现在对方视野里；  
      - 一个队友跑 `git status` 看到了另一个队友的半成品，很难判断该保留还是清理；  
      - 最终你可能既无法干净收尾，也很难复盘每个任务到底改了什么。

      本课要回答：

      1) 并行改动的根因问题是什么？它不是“多线程难”，而是哪里共享得太多？  
      2) 为什么把“任务（What）”与“执行目录（Where）”分开，会显著降低协调成本？  
      3) git worktree 在这里提供的最核心能力是什么？  
      4) 为什么需要 index.json 与 events.jsonl 这两类“旁路状态”？

  - type: md
    title: 概念对齐：控制面（What）与执行面（Where）
    body: |
      这节课的核心模式是 **控制面/执行面分离**：

      **控制面：Task Board（.tasks/）**  
      任务板描述“要做什么”：目标、状态、负责人、以及（在本课之后）它绑定到哪个 worktree。

      **执行面：Worktrees（.worktrees/）**  
      worktree 描述“在哪里做”：一个独立目录 + 对应分支。它承载实际的文件修改、构建产物与局部 git 状态。

      当两者分离后，你可以做到：
      - 一个任务还在规划阶段时，不必立即创建 worktree  
      - 需要并行或高风险改动时，为任务分配一条独立 worktree “车道”  
      - 收尾时显式决定 keep/remove，而不是在共享目录里做隐式清理

  - type: md
    title: 为什么共享目录会让并行任务“状态对不上”？
    body: |
      在共享目录里，任务 A 与任务 B 的修改会交织在一起，导致两类错位：

      **1) 任务状态 vs 实际改动错位**  
      任务板说 A 正在进行，但 git 状态里可能混着 B 的改动；你很难回答“这个 diff 属于哪个任务”。

      **2) 收尾语义缺失**  
      共享目录里没有“为任务收尾”的显式动作：你只能靠人工判断哪些文件要保留、哪些要还原。

      worktree 隔离本质上是在物理层面给每个任务一个独立工作区，让“任务边界”落到目录边界上。

  - type: md
    title: WorktreeManager：create / run / status / keep / remove
    body: |
      s12 引入了 WorktreeManager，把 git worktree 变成一组可被模型调用的工具：

      - `worktree_create(name, task_id?, base_ref=HEAD)`：创建一个 worktree 目录与分支（分支名形如 `wt/<name>`），并可选绑定到 task_id。  
      - `worktree_run(name, command)`：在指定 worktree 目录里执行命令（通过 `cwd=worktree_path` 路由执行面）。  
      - `worktree_status(name)`：查看该 worktree 的 git 状态（在隔离目录内执行 `git status`）。  
      - `worktree_keep(name)`：标记该 worktree 被保留（例如后续继续开发或等待 review）。  
      - `worktree_remove(name, complete_task=false)`：移除该 worktree；如果 complete_task=true，并且 worktree 绑定了 task_id，会同步把任务标记完成并解绑 worktree。

      这里的关键不是“多了几个工具”，而是把“执行上下文”的选择变成显式 API：每次执行都必须指定 lane（worktree 名称）。

  - type: md
    title: 显式绑定：task_id 如何把控制面与执行面对齐？
    body: |
      s12 做了两边的显式绑定：

      **Task 侧持有 worktree 名称**  
      任务 JSON 里有 `worktree` 字段。绑定后它会被写成 worktree 名称，并把任务状态从 pending 推进到 in_progress。

      **Worktree 侧持有 task_id**  
      worktree 的 registry（index.json）里记录 `task_id`，让你能从 worktree 追溯“它服务于哪个任务”。

      这种双向关联让你在调试时更容易回答：
      - “任务 7 的执行面在哪个目录？”  
      - “这个 worktree 的变更应该归到哪个任务？”

  - type: md
    title: index.json：worktree registry 解决“可恢复性”
    body: |
      `.worktrees/index.json` 是一个最小 registry：记录所有 worktree 的 name/path/branch/task_id/status。

      它的作用是让系统在进程中断后仍能重建现场：
      - worktree 目录在磁盘上  
      - index 里有指向这些目录的可枚举列表  
      - task 文件里也有绑定信息

      这比“把所有信息放在内存里”更接近工程现实：会话记忆是易失的，但磁盘状态是持久的。

  - type: md
    title: events.jsonl：事件流是旁路可观测层，而不是主状态
    body: |
      s12 还引入了一个 EventBus，把关键操作写成 append-only 的事件流（`.worktrees/events.jsonl`）：
      - `worktree.create.before/after/failed`  
      - `worktree.remove.before/after/failed`  
      - `worktree.keep`  
      - `task.completed`（当 remove + complete_task 成功时）

      事件流的工程意义在于：
      - 它不会替代 task/index 这两个主状态机；  
      - 它提供审计与调试线索：你可以看到“什么时候创建、什么时候移除、失败原因是什么”；  
      - 你可以把副作用（通知、配额、回收策略）放到事件消费者里，让核心流程保持最小。

  - type: md
    title: 动手练习：两个任务，两条 worktree lane，最后显式收尾
    body: |
      1) 运行：

      ```bash
      python agents/s12_worktree_task_isolation.py
      ```

      小提示：脚本会尝试探测当前目录所属的 git 仓库根目录，并把 `.tasks/` 与 `.worktrees/` 写在仓库根目录下。
      如果你在仓库的子目录里运行，记得去 repo root 查看这些目录与文件。

      2) 建议操作路径：
      - 创建两个任务（例如后端 auth 与前端 login）  
      - 分别创建 worktree 并绑定到各自 task_id  
      - 在各自 worktree 里运行 `git status --short`（确认隔离生效）  
      - keep 一个 worktree（表示保留），remove 另一个 worktree 并设置 complete_task=true（表示任务完成并收尾）

      3) 检查点：
      - `task_list` 是否显示 owner 与 wt 绑定信息？  
      - `worktree_list` 的 status 是否随 keep/remove 更新？  
      - `worktree_events` 是否能看到 create/remove/keep 的事件序列？

      4) 微改动（建议）：
      - 在 worktree_create 时允许传入 base_ref（例如某个分支），观察这会如何影响并行开发流程。  
      - 在 events payload 里加入更多上下文字段（例如当前 git commit），观察可追溯性提升到什么程度。

  - type: md
    title: 原文阅读
    body: |
      - 日期：2026-02-26（仓库快照）
      - 来源：shareAI-lab/learn-claude-code（MIT，commit: ff8acd8）
