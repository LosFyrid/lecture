  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      1) 并行改动的根因是共享执行上下文：多个任务在同一目录里读写同一套未提交状态，导致污染与难以收尾。  
      2) 控制面/执行面分离把“做什么”与“在哪做”拆开：任务板管理目标与进度，worktree 管理隔离目录与分支。  
      3) git worktree 提供的核心能力是目录级隔离：让每个任务有独立的工作区，减少并行协作时的状态干扰。  
      4) index.json 与 events.jsonl 分别解决“可恢复性”和“可观测性”：前者用于重建现场，后者用于审计与调试，并不替代主状态机。
