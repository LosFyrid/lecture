id: agent-skills-references
title: "附录：资源与参考——示例 Skills、文档索引与 frontmatter 模板"
summary: |
  汇总材料中提到的学习资源与可复用模板：官方文档/博客/示例 skills、skill-creator 的用法，以及 frontmatter 的“必填/全量字段”参考。你可以把它当成一个可反复回来的索引页。
items:
  - type: md
    title: 如何使用这份索引：先建立直觉，再按需查细节
    body: |
      当你在做第一个 skill 时，不建议一上来就把所有文档都读完。
      更高效的顺序通常是：

      1) 先读：Best Practices / Skills Documentation（建立直觉）
      2) 再查：API Reference / MCP Documentation（用到再查）
      3) 最后看：示例 skills（对齐质量上限）

      这对应三种不同的学习目标：
      - Best Practices：告诉你“为什么这样设计”（心智模型）  
      - API/MCP：告诉你“字段与约束是什么”（实现细节）  
      - 示例 skills：告诉你“高质量长什么样”（对齐上限）

      备注：平台能力会更新，具体 UI 路径与 API 字段可能变化；建议以最新官方文档为准。

  - type: md
    title: 官方文档（建议先收藏，按需打开）
    body: |
      材料列出的“官方资源”主要覆盖四块：skills 概览、最佳实践、API 文档、MCP 文档。

      - Overview：告诉你技能是什么、怎么集成、核心概念  
      - Best Practices：告诉你三层渐进式加载、触发与写作的经验做法  
      - API Reference：当你要程序化管理/调用 skills 时必查  
      - MCP Documentation：当你的 skill 依赖连接器/工具编排时必查

