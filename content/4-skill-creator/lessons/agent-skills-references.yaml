  - type: md
    title: 工具与实用语句：skill-creator
    body: |
      材料建议用 skill-creator 加速：

      - 生成：从需求描述生成 SKILL.md 骨架
      - 评审：找出常见问题（过泛描述、缺触发、结构缺失）
      - 迭代：把失败案例喂回去让它建议改法

      一个可直接使用的提示语（示例）：
      - “Use the skill-creator skill to help me build a skill for [your use case]”

  - type: md
    title: Reference：YAML frontmatter 模板（必填版 / 全量版）
    body: |
      必填版（最小可用）：

      ```yaml
      ---
      name: skill-name-in-kebab-case
      description: What it does and when to use it. Include specific trigger phrases.
      ---
      ```

      全量版（可选字段按需添加）：

      ```yaml
      ---
      name: skill-name
      description: ...
      license: MIT
      compatibility: Claude.ai / Claude Code / API; requires network; requires xyz
      allowed-tools: "Bash(python:*) WebFetch"  # 如果你的运行环境支持权限限制
      metadata:
        author: Your Team
        version: 1.0.0
        mcp-server: your-server
        category: productivity
        tags: [workflow, automation]
      ---
      ```

      安全提示（材料强调）：
      - frontmatter 禁止出现 `< >`
      - 其他命名限制以官方规范为准（材料提到某些保留前缀）

  - type: md
    title: 支持与反馈：如何提问，才能让别人更快帮到你
    body: |
      发布后常见的反馈入口包括：

      - 社区：开发者社区/论坛/Discord（适合通用问题）
      - Issue：示例 skills 仓库的 issues（适合 bug/文档问题）

      建议你在 issue 里固定包含：
      - skill 名称与版本
      - 复现步骤（触发语句、输入文件）
      - 错误信息/日志（如有）

  - type: url
    title: "Claude Developers Discord（支持入口）"
    url: https://discord.com/invite/6PPFFzqPDZ
    mode: open

  - type: md
    title: 原文阅读
    body: |
      - 日期：2026-01-26（PDF 元数据 CreationDate；在线页面可能有更新）
      - 来源：Anthropic / Claude（Agent Skills 指南）
      - 建议：把原文的 Resources & references 当作“官方链接索引”，但学习顺序仍建议从 Best Practices 入手：先建立三层结构与触发/执行分流的直觉，再回到 API/MCP 文档查细节。

  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      如果你发现自己在“读文档读到迷路”，可以用一个返回点把路径拉直：

      - 你在解决“触发不稳定/写作结构”问题：回到 Best Practices 与示例 skills。  
      - 你在解决“接口字段/权限/沙箱”问题：回到 API Reference。  
      - 你在解决“多系统编排/工具语义”问题：回到 MCP 文档与 pattern 章节。

      把资源当成“按需打开的 references”，本身也是一种渐进式加载的实践。
