  - type: md
    title: 示例 skills（“抄作业”的正确方式）
    body: |
      学习 skills 的最快方法之一，是 clone 一份高质量示例，然后做“最小改动”，材料也给了一个很实用的顺序：

      1) 先只改 description（触发条件），跑触发测试  
      2) 再改 instructions（步骤与校验），跑功能测试  
      3) 最后加 references/scripts，把复杂度拆到按需加载层

      这样做的好处是：你每一步都能观察到“行为变化来自哪里”，而不是一次改太多导致无法归因。

