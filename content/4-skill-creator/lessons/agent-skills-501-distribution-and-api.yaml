id: agent-skills-501-distribution-and-api
title: "分发与协作：从个人自用到团队/生态（GitHub / 组织分发 / API）"
summary: |
  Skill 不只是“自己用”：当你把它分享给团队或社区，分发方式、版本管理与定位文案会直接影响采用率。本课总结材料里（截至 2026-01）的分发模型，并给出推荐的开源/发布流程。
items:
  - type: md
    title: 学习目标
    body: |
      学完本课，你应该能够：

      - 选择合适的分发方式：个人安装 / 组织统一部署 / API 程序化使用。
      - 按推荐路径发布一个 skill：GitHub repo + 安装指南 + 示例与截图。
      - 为你的 skill 写对“定位文案”：强调 outcomes，而不是文件结构细节。

  - type: md
    title: 当前分发模型（材料给出的时间点：2026-01）
    body: |
      说明：下面是材料里“截至 2026 年 1 月”的状态；平台能力可能会变化，请以最新官方文档为准。

      个人用户常见路径：
      1) 下载 skill 文件夹
      2)（需要时）打包成 zip
      3) 在产品里上传/安装（例如 Claude.ai 的 Skills 设置）
      4) 或放进 Claude Code 的 skills 目录

      组织级分发（材料提到：管理员可 workspace-wide 部署，支持自动更新）：
      - 适合：希望团队统一工作流/统一质量标准的场景
      - 关键能力：集中管理 + 自动更新 + 降低个人配置成本

  - type: md
    title: 开放标准与生态协作（为什么值得“可移植”）
    body: |
      材料提到：Agent Skills 被作为“开放标准”推动，其目标类似 MCP：
      - 同一个 skill 理论上可以跨平台/跨工具使用（只要环境能力匹配）
      - 作者可在 compatibility 里声明依赖与适配范围

      这对作者的启示：
      - 把 skill 写成“可携带的工作流知识”，而不是绑定某个界面的按钮
      - 依赖要显式，避免“在我电脑上能跑”的隐性假设

  - type: md
    title: API 使用（适合程序化/规模化）
    body: |
      材料提到：当你要把 skills 用在应用、agent、自动化流水线中，应该考虑 API 方式，因为它提供：

      - skills 的列举与管理（例如 `/v1/skills`）
      - 在请求中启用 skills（例如 `container.skills` 参数）
      - 版本控制与管理（通过控制台/平台能力）
      - 与 Agent SDK 结合，用于自建 agent 系统

      备注：材料也提示 API 侧可能依赖更严格的执行环境（例如 code execution sandbox）。实际能力以最新文档为准。

  - type: md
    title: 推荐发布流程（今天就能做的版本）
    body: |
      一套“低门槛但足够专业”的发布流程：

      1) **把 skill 放到 GitHub repo**  
         - repo 根目录写 README（给人类看）  
         - skill 文件夹内部不要放 README.md（给 Claude 的写在 SKILL.md）
      2) **提供安装指南**  
         - 下载/clone  
         - 如何安装到产品（上传 zip/放目录）  
         - 如何验证（给 3 条测试语句）
      3) **给出示例与截图**  
         - 让用户 30 秒理解价值  
         - 最好包含“前后对比”：无 skill 的繁琐 vs 有 skill 的顺滑
      4) **在你的 MCP 文档里链接 skill（如果你是 MCP Builder）**  
         - 强调：MCP=接入能力，Skills=工作流知识  
         - 把“支持问题”转移成“自助工作流”

  - type: md
    title: 定位文案：讲 outcomes，不讲文件结构
    body: |
      写 README/文档/营销文案时，避免把价值说成“一个 YAML + Markdown 文件夹”。

      ✅ 好：强调结果
      - “把项目空间在几秒内搭好（页面/数据库/模板齐全），而不是手动 30 分钟配置。”

      ❌ 差：强调实现细节
      - “这是一个包含 YAML frontmatter 与 Markdown instructions 的文件夹……”

      对 MCP + Skills 组合，建议讲清楚“组合价值”：
      - “MCP 给 Claude 访问你们系统的能力；Skill 教 Claude 你们团队的最佳流程；两者结合才能稳定落地。”

  - type: md
    layout: inline
    body: |
      来源材料：

