  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      如果你希望“写一次、复用很多次”，可以用三个问题判断某个流程是否值得写成 Skill：

      1) **它是不是会重复出现？**（频率越高越值得沉淀）  
      2) **它有没有可复现的步骤与标准？**（能否写出检查点与成功标准）  
      3) **它最贵的成本是什么？**（是人类反复解释、还是上下文膨胀、还是工具调用失败后的返工）

      这些问题的答案，会在下一章变成可操作的设计要求：触发条件、渐进式加载、以及测试用例。
