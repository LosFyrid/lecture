id: agent-skills-intro
title: "导论：为什么要把工作流写成 Skill（一次写好，多次复用）"
summary: |
  Skill 的价值不在“多一份提示词”，而在把可重复的工作流知识做成可触发、可复现、可迭代的工程资产：当任务再次出现时，系统用同一套步骤与标准把事做成。
items:
  - type: md
    title: 导入：本课要回答的问题
    body: |
      如果你已经开始用 API/代码做 agent，会很快遇到一种“反直觉的耗时”：

      - 同一类任务总在重复（写 PRD、做调研、按团队规范生成交付物、跑一段固定校验流程）；  
      - 你每次都要重新解释方法、标准、格式、边界；  
      - 解释得越多，越容易让对话上下文膨胀、结果漂移、难以复现。

      这节导论用一个问题贯穿：

      **如果把 agent 当成“会执行多步流程的系统”，能不能把流程本身变成可复用的能力，而不是每次从头 prompt？**

      为了回答它，本课会先把几个容易混淆的概念对齐：Skill、Prompt、Tool、MCP（连接器）分别负责什么。

  - type: md
    title: 概念对齐：Skill、Prompt、Tool、MCP 分别解决什么
    body: |
      这份材料讨论的 **Skill** 是一种“工作流知识的打包方式”：把指令、示例、必要的脚本/资料放进一个文件夹里，并让系统在合适的时候加载它。

      为了避免“看起来都像是在写提示词”，先把边界拆开：

      **Prompt（临时指令）**  
      更像一次性的“口头说明”：对当前任务有效，但天然不稳定——不同人写法不同、上下文不同、下一次对话又要重来。

      **Tool（工具/函数）**  
      Tool 决定 *能不能做*：例如执行脚本、读写文件、发起检索、调用外部 API。它提供能力的“动作接口”，通常表现为可调用的函数。

      **MCP / Connector（连接器）**  
      MCP/连接器解决 *连不连得上*：把 agent 接到真实系统（Notion/Linear/Sentry/数据库/内部服务），让 Tool 有“数据源”和“执行端”。

      **Skill（工作流知识层）**  
      Skill 解决 *怎么做得对、做得一致*：把“顺序、检查点、错误处理、输出格式、团队规范”写进可复用说明书，让系统在合适时机采用同一套做法。

      一个更工程化的类比是：
      - MCP/Tools 像厨房和设备（能做什么）
      - Skills 像菜谱与出品标准（怎么做、做到什么程度算合格）

  - type: md
    title: 为什么 Skill 常常比“更长的 prompt”更省事
    body: |
      把工作方式写成 Skill，本质上是在处理三类工程问题：

      **问题 1：一致性（consistency）**  
      同一个任务如果每次都靠临时 prompt，结果常出现“结构/顺序/检查项漂移”：今天先做校验，明天先写结论；今天输出 6 个小节，明天输出 4 个小节。  
      Skill 通过固定步骤与格式，把这类漂移压到更小。

      **问题 2：上下文成本（token / attention budget）**  
      你当然可以把所有规则、模板、例子都写进 prompt，但这会把“本次任务的关键信息”挤到噪声里。  
      Skill 的关键机制之一是 **渐进式加载（progressive disclosure）**：先只放“什么时候用”的少量信息，触发后再加载细节。

      **问题 3：可复用与可维护（maintainability）**  
      当你把方法写进文件（而不是散落在聊天记录里），你就能像维护代码一样维护它：版本化、评审、迭代、回归测试。

  - type: md
    title: 两条学习路径：Standalone Skills 与 Skills + MCP
    body: |
      这份材料本身给出了两条主线。你可以把它当成课程的两种“落地形态”：

      **路径 A：Standalone Skills（不依赖 MCP）**  
      重点是把“输出质量”做稳定：模板、风格指南、检查清单、迭代精炼回路。  
      常见产物：文档/演示/代码评审意见/研究报告的结构化产出。

      **路径 B：Skills + MCP（把连接器变成“会做事的工作流”）**  
      重点是把“工具访问”升级为“端到端流程”：工具调用顺序、参数组装、错误处理、跨系统数据传递。  
      常见产物：跨系统工作流（例如设计导出→资产入库→创建任务→通知）。

      两条路径共享同一套底层要求：文件结构、触发逻辑、安全限制、以及测试与迭代方法。

  - type: md
    title: 小练习：找出你第一个值得“写成 Skill”的工作流
    body: |
      后面章节会反复用到“use case（用例）”这个词。现在先用 5 分钟做一个准备：

      1) 写下你最近一周重复出现过的 3 件事（越具体越好）。  
         例：不是“做项目管理”，而是“把 sprint 状态从 Linear 拉出来→按容量排序→生成 tickets 并打标签”。

      2) 对每件事补两行：
         - 如果让 agent 做，最容易翻车在哪里？（输入不完整、格式不一致、漏校验、工具调用顺序错）  
         - 如果要“做完算成功”，你能不能写出一个可检查的成功标准？（产物结构、必填字段、错误率、工具调用次数）

      3) 选一个你觉得“最有信号”的，作为后续章节的贯穿例子。

