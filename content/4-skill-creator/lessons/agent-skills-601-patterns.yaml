id: agent-skills-601-patterns
title: "第 6 课：模式库——把 Skill 写成“可执行的工作流结构”"
summary: |
  好的 skill 不只是“说明书”，而是可执行的工作流结构。本课把材料里的 5 种常见模式整理成可迁移的写作骨架：顺序编排、多 MCP 协同、迭代精炼、上下文感知选工具、领域智能，并解释每种模式解决的核心困难与常见翻车点。
items:
  - type: md
    title: 导入：为什么需要“模式库”（而不是每次从零写说明书）
    body: |
      当你把 skill 写得越来越复杂时，一个常见现象是：正文变成了一篇“散文式说明”，读起来很丰富，但执行时容易漂移。
      材料提出的解决方式不是继续加规则，而是引入“工作流结构”——也就是模式（pattern）。

      这节课会回答：

      1) 当用户描述问题时，你的 skill 应该以“问题”为中心还是以“工具”为中心？  
      2) 5 种常见模式分别适用于什么场景？它们试图解决的瓶颈是什么？  
      3) 怎样把模式落成可执行步骤（依赖、验证门、失败补救），而不是口头建议？

  - type: md
    title: 概念对齐：Problem-first 与 Tool-first 是两种不同的“入口”
    body: |
      材料先让你选一个叙事入口（framing）。这一步看似“写作风格”，但它会直接影响：
      - description 该怎么写（触发短语更偏结果还是更偏工具）  
      - 正文该怎么写（先澄清目标还是先教会工具用法）

      **Problem-first（问题/结果驱动）**  
      用户通常说的是“我想达成什么”。skill 的职责是：选择工具、编排步骤、把事做成。  
      更适合：端到端流程、用户不想了解工具细节的场景。

      **Tool-first（工具/能力驱动）**  
      用户已经把 MCP/工具接好了，但不知道“正确用法/最佳实践”。skill 的职责是：把专家流程教给系统。  
      更适合：连接器增强、领域最佳实践固化的场景。

      材料用了一个很生活化的类比（Home Depot）：  
      - 你带着问题进店（Problem-first）：店员帮你选工具并教你怎么做；  
      - 你先买了工具（Tool-first）：你需要的是“怎么把这把钻用在你的具体工作上”。

      实操上，大多数 skills 会明显偏向其中一类。偏向不清晰常导致：description 难写、正文难收敛、用户不知道它到底在解决什么。

  - type: md
    title: Pattern 1：顺序工作流编排（Sequential orchestration）
    body: |
      **适用**：流程必须按固定顺序走，而且步骤之间存在依赖（后一步需要前一步的产物）。

      材料给的关键点不是“按顺序写”，而是把依赖与验证写清楚：  
      - 每一步要明确输入/输出；  
      - 在关键步骤设置验证门；  
      - 失败时要有回滚/重试指令（否则会在外部系统留下半完成状态）。

      一个可复用的骨架可以是：

      - Step 1：做 A（先验证输入）  
      - Step 2：做 B（显式引用 A 的输出字段）  
      - Step 3：做 C（阶段性自检）  
      - Failure：某步失败时如何回滚/重试/提示用户补充信息

      材料里的例子是“新客户 onboarding”：创建账号 → 设置支付 → 创建订阅 → 发送欢迎邮件。  
      这里的工程要点是：每一步都可能失败，并且失败会把你带到不同的补救路径。

  - type: md
    title: Pattern 2：多 MCP 协同（Multi-MCP coordination）
    body: |
      **适用**：一个结果需要跨多个系统完成（例如设计→存储→任务→通知），而且每个系统都有自己的数据形态。

      材料建议把它写成按 phase 分段的结构（而不是把所有步骤平铺成 20 行）：
      - Phase 1：系统 A（导出/拉取数据）
      - Phase 2：系统 B（存储/共享链接）
      - Phase 3：系统 C（创建任务/附加链接）
      - Phase 4：系统 D（通知/总结）

      材料给的例子是“设计到开发交接”：Figma 导出 → Drive 存储并生成链接 → Linear 创建任务并附链接 → Slack 通知。  
      关键技巧在于：
      - phase 边界清晰（每个 phase 的输入/输出）  
      - 数据如何在 MCP 之间传递（IDs、links、metadata）  
      - 错误处理尽量集中（否则每一步都写一遍重试/鉴权，会让正文膨胀）

  - type: md
    title: Pattern 3：迭代精炼（Iterative refinement）
    body: |
      **适用**：输出质量需要多轮改进才能达标（报告、长文档、代码生成）。

      材料给出的骨架非常“工程化”：先有一个可用初稿，再进入可重复的检查与修复循环。
      - Initial draft：先生成一个可运行/可读的初稿  
      - Quality check：用 checklist 或脚本检查（缺段落、格式不一致、数据不合法）  
      - Refinement loop：逐项修复 → 重新验证 → 直到满足停止条件  
      - Finalization：统一格式、产出摘要与交付物

      这一模式最容易翻车的点是“无限迭代”。材料给的缓解方式是：
      - 把质量标准写出来（否则每轮都在凭感觉改）  
      - 写清停止条件（到什么程度算够好）  
      - 能脚本化就脚本化（确定性校验优先）

  - type: md
    title: Pattern 4：上下文感知选工具（Context-aware tool selection）
    body: |
      **适用**：同一个目标，但根据上下文/约束要选择不同工具（例如文件存储位置、处理路径）。

      材料把它写成一个决策树（Decision tree），核心不是“聪明选择”，而是把选择标准写得足够明确：
      - 先判断：类型/大小/协作需求/时效性/安全级别  
      - 再选择：工具/系统/存储位置  
      - 最后解释：为什么做这个选择（降低用户不信任与误操作）

      材料给的例子是“文件存储”：大文件进云存储、协作文档进 Docs/Notion、代码进 GitHub、临时文件留本地。  
      关键技巧包括：
      - 决策标准写清楚（否则模型会随机选）  
      - 提供 fallback（工具不可用时退路是什么）  
      - 对用户透明（解释选择理由）

  - type: md
    title: Pattern 5：领域智能（Domain-specific intelligence）
    body: |
      **适用**：skill 的价值不只是“调用工具”，而是“把专业判断写进去”（合规、科研规范、风格标准）。

      材料给的核心骨架是 “Before action → Action → Audit trail”：
      - Before action：先做规则/合规/前置检查（可落盘/可审计）  
      - Action：条件满足才执行（否则升级处理）  
      - Audit trail：记录判断依据与产物（便于复盘与审计）

      材料的例子是金融合规：先查制裁名单、司法辖区、风险等级并记录判断，再决定是否继续执行支付流程。  
      这一模式的关键在于：
      - 把领域规则显式化（列表/表格/决策树）  
      - 先检查再行动（把风险关在前面）  
      - 记录证据（“为什么这样做”要可追溯）

  - type: md
    title: 小练习：为你的 skill 选一个“主模式”，并写出 10 行骨架
    body: |
      用你在 `agent-skills-201` 写的 Design Card，选一个 use case：

      1) 选择一个最匹配的 pattern（1~5）  
      2) 写出 6–10 行的“骨架版 workflow”（只写步骤标题 + 输入/输出）  
      3) 标出 2 个你必须加验证门的地方（否则必翻车）  
      4) 如果你的模式涉及外部系统（MCP/API），再额外标出 1 条失败补救（重试/回滚/人工介入）

      目标不是写完全部细节，而是让你的正文开始具备“结构”：读者能看出依赖、阶段、决策点与错误路径。

  - type: md
    title: 原文阅读
    body: |
      - 日期：2026-01-26（PDF 元数据 CreationDate；在线页面可能有更新）
      - 来源：Anthropic / Claude（Agent Skills 指南）
      - 建议：把原文的 5 个 pattern 当成“结构化写作的目录”，逐个对照你自己的 workflow：你的流程更像顺序编排、还是多系统协同、还是需要迭代精炼？模式选对后，正文会更容易写成可执行步骤。

  - type: url
    title: "参考：anthropics/skills（公开示例仓库，可对照模式）"
    url: https://github.com/anthropics/skills/tree/main/skills
    mode: open

  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      如果你发现自己“写不下去”，很多时候不是内容不够，而是没有选定结构入口：

      - 用户说的是结果：更像 Problem-first，先把 end-state 与步骤编排写清楚。  
      - 用户已经接好了工具：更像 Tool-first，先把“正确用法/常见坑/错误处理”写清楚。  

      在 5 个模式里，最常复用的一条经验是：无论哪种模式，正文都尽量显式化三件事——依赖、验证门、失败补救。它们会让执行更可控，也更容易被测试与迭代。
