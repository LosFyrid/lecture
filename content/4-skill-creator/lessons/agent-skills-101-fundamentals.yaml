id: agent-skills-101-fundamentals
title: "第 1 课：Skill 的结构与三条设计原则（渐进式加载 / 可组合 / 可移植）"
summary: |
  搞清楚 Skill 的最小结构（一个文件夹 + `SKILL.md`）以及为什么“把信息放在正确层级”会同时影响触发准确性、上下文成本与可维护性：三层渐进式加载（frontmatter → SKILL.md → linked files）+ 可组合 + 可移植。
items:
  - type: md
    title: 导入：为什么“结构”会决定一个 Skill 是否好用
    body: |
      很多初学者写 Skill 的第一反应是：把一堆规则、模板、例子都塞进 `SKILL.md`。
      结果往往出现两种相反但同源的问题：

      - **“太短”**：规则写得很泛，触发后也不知道下一步怎么做；  
      - **“太长”**：细节堆满上下文，触发变慢、质量下降，甚至开始乱触发/抢别的 skill 的工作。

      这节课要回答的是：

      1) 一个 Skill 最小需要哪些东西？哪些内容应该拆到可选目录？  
      2) 什么是“渐进式加载”，为什么它不是写作技巧而是系统设计？  
      3) 当同时存在多个 Skills（以及 MCP tools）时，怎样写才能互不干扰、还能复用？

  - type: md
    title: 概念对齐：SKILL.md、frontmatter、system prompt、linked files
    body: |
      先对齐几个术语，它们决定了后面“该把信息放在哪一层”。

      **SKILL.md**  
      Skill 的“主说明书”。它通常包含两部分：  
      - 顶部的 YAML frontmatter（用于触发）；  
      - Markdown 正文（用于执行：步骤、示例、错误处理、引用哪些资料）。

      **YAML frontmatter**  
      一小段写在 `--- ... ---` 之间的元数据。材料强调它是“最重要的部分”，原因是：  
      **它会进入 system prompt 的常驻部分**，用来帮系统判断“什么时候该加载这个 skill”。  
      （细节写法放到后续专门一课，这里先记住：frontmatter 控制触发。）

      **system prompt（系统提示词）**  
      你可以把它理解成“系统层的默认规则与常识”：比用户消息更靠前、更稳定、每轮都会带着。
      frontmatter 在这里的意义是：用很少的文字让系统知道“哪类请求应该启用这个 skill”。

      **linked files（引用/链接文件）**  
      指 skill 文件夹里那些“不会默认加载、但需要时可以打开”的文件：`references/`、`assets/`、`scripts/`。
      它们是渐进式加载的第三层：把长文档、模板、确定性校验迁移出去，避免把 `SKILL.md` 写成巨型说明书。

  - type: md
    title: Skill 的最小结构：一个文件夹 + 可选三类“按需层”
    body: |
      材料给出的最小结构非常克制：

      ```text
      your-skill-name/
      └── SKILL.md   # 必须，且文件名必须完全一致（区分大小写）
      ```

      当你希望 skill 变得“更确定、更专业”时，通常会引入三类可选目录（它们的共同点是：只在需要时加载/执行）：

      ```text
      your-skill-name/
      ├── SKILL.md
      ├── scripts/        # 可选：可执行脚本（Python/Bash 等）
      ├── references/     # 可选：长文档（API 规则、例子、团队规范）
      └── assets/         # 可选：模板/字体/图标/固定素材
      ```

      这里的“工程直觉”是：
      - **脚本用来做确定性校验**：例如 schema 校验、格式检查、文件转换；  
      - **references 用来存长知识**：例如分页/限速/错误码说明；  
      - **assets 用来稳定输出形态**：例如报告模板、品牌色、组件骨架。

  - type: md
    title: 设计原则 1：渐进式加载——把信息放在正确的层级
    body: |
      材料把 Skill 设计成三层信息系统。你可以把它当成“减少上下文噪声”的关键机制：

      **第一层：frontmatter（常驻、很短）**  
      只承担一件事：描述“什么时候该用”。  
      目标是让系统在不读正文的情况下，也能大致判断相关性。

      **第二层：SKILL.md 正文（触发后加载）**  
      承担“怎么做”的主体：步骤、示例、错误处理、输出约束。  
      这一层写得越具体，执行越稳定；但越长也越容易挤占上下文，所以要克制地写“主干流程”。

      **第三层：linked files（只在需要时打开）**  
      承担“细节与确定性”：把长文档与模板移出正文；把关键校验交给脚本。

      这三层的分工很像“目录→章节→附录/工具箱”。  
      当你发现 `SKILL.md` 越写越大、触发越来越慢时，通常不是“信息不够”，而是“信息放错层级”。

  - type: md
    title: 设计原则 2：可组合——让多个 Skills 能一起工作
    body: |
      材料明确提到：系统可以同时加载多个 skills。
      这意味着写 skill 时需要一种“库的思维”，而不是“全局接管”的思维：

      - 你的 skill 需要清楚自己覆盖的边界：它擅长什么、不负责什么；  
      - 避免写成“无论用户说什么都按我这套来”；  
      - 把关键约束放在开头，用一致的术语和结构表达（减少与其他 skill 的冲突）。

      一种很实用的写作自检是：
      **如果另一个 skill 也被启用，你的指令会不会互相“抢方向盘”？**
      如果会，通常需要把触发条件写得更具体，并在正文里强调“何时退出/何时交还控制”。

  - type: md
    title: 设计原则 3：可移植——同一套知识在不同运行面复用
    body: |
      材料把 “portability” 描述为：skills 在不同使用面（网页、IDE、API）表现一致。

      把它翻译成工程要求，通常包含三件事：

      1) **不要把 skill 写成“点某个按钮才能做”的说明**：按钮/界面会变，但流程与约束应该稳定。  
      2) **依赖要显式**：如果需要网络、系统包、某个 MCP server，应该写在可见的元数据里。  
      3) **把可变因素隔离**：把可变的“实现细节”留在 references/scripts，而让主流程保持通用。

      这条原则也解释了为什么材料强调“脚本/参考资料按需加载”：它们能承载更多实现差异，而不污染主干上下文。

  - type: md
    title: 对 MCP Builder 的含义：Skills 是“知识层”，不是“连接层”
    body: |
      如果你已经有一个能工作的 MCP server，你可能会遇到一种常见反馈：
      “工具接上了，但我不知道下一步怎么把事做成。”

      材料把这种落差总结得很直白：
      - 只有连接器：用户能访问数据与工具，但工作流每次都要从头解释；  
      - 加上 skills：把最佳实践与步骤写进系统，触发后就按固定流程执行，用户不必每次扮演“提示词工程师”。

      换句话说：**MCP 让 agent ‘能动手’，Skill 让 agent ‘会做事’。**

  - type: md
    title: 小练习：把你的一个流程拆成“三层信息”
    body: |
      选一个你在导论里写下的重复流程，尝试做一次“分层”：

      1) **frontmatter 应该写什么？**  
         只写触发条件：用户会怎么说、会给什么文件、会提到什么工具/术语。

      2) **SKILL.md 正文应该写什么？**  
         写主干步骤（3–7 步即可），每一步描述：输入→行动→输出/检查点。

      3) **哪些细节应该移到 linked files？**  
         - 很长的规则表（放 `references/`）  
         - 很固定的模板（放 `assets/`）  
         - 很关键的校验（放 `scripts/`）

      做完后再问一句：如果只读 frontmatter，系统能否判断何时该用？如果只读正文，能否执行到一个可检查的 end-state？

  - type: md
    title: 原文阅读
    body: |
      - 日期：2026-01-26（PDF 元数据 CreationDate；在线页面可能有更新）
      - 来源：Anthropic / Claude（Agent Skills 指南）
      - 建议：先对照“什么是 skill”与“三层渐进式加载”的定义；再带着你自己的流程去想：哪些信息应该常驻、哪些应该按需加载。

  - type: url
    title: "参考：Agent Skills Best Practices（结构与设计原则）"
    url: https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices
    mode: open

  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      判断一个 skill 的“结构是否合理”，可以用三条快速自检：

      1) **触发信息是否被压缩到了 frontmatter？**（足够短、足够具体、能区分场景）  
      2) **执行主干是否写在正文？**（能照着做、每一步有检查点）  
      3) **细节是否被移到按需层？**（长文档/模板/脚本不默认灌进上下文）

      如果三条都满足，这个 skill 往往更容易触发得对、运行得稳，也更方便被别的团队复用与维护。
