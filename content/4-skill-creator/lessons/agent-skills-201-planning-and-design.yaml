id: agent-skills-201-planning-and-design
title: "规划与设计：从 Use Case 出发定义触发、步骤与成功标准"
summary: |
  先别急着写 SKILL.md：高质量 skill 的起点是 2-3 个具体用例（use case）+ 清晰的触发条件（trigger）+ 可验证的成功标准（success criteria）。你要先知道“它该在什么时候出现、做完算成功”。
items:
  - type: md
    title: 导入：写 Skill 之前，先把“问题定义”写对
    body: |
      一个 skill 最容易走偏的地方，不是写作技巧，而是“问题定义”：

      - 你写了一堆规则，但它不知道什么时候该触发；  
      - 它触发了，但不知道“做完算成功”的标准；  
      - 你以为它在帮忙，但它其实在制造更多来回澄清。

      这节课用三个问题把“问题定义”钉牢：

      1) 用户真正想完成的结果是什么？（use case）  
      2) 系统凭什么知道该启用你这套流程？（trigger）  
      3) 你怎样判断 skill 真的在变好，而不是“感觉还行”？（success criteria）

  - type: md
    title: 概念对齐：use case / trigger / steps / output / success criteria
    body: |
      先把这几个词对齐，它们会贯穿 skill 的规划、写作与测试：

      **Use case（用例）**  
      一句话说清楚“用户要达成什么结果”。它不是愿景口号，而是可以执行的任务。

      **Trigger（触发条件）**  
      系统如何判断“现在该用这个 skill”：常见信号包括用户会说的短语、提到的工具/系统名、上传的文件类型等。

      **Steps（步骤）**  
      这件事通常需要哪些阶段性的动作（可能包含工具调用、校验、生成交付物）。

      **Output / Result（交付物）**  
      最终产物长什么样：一个文件？一段结构化输出？一组 tickets？一个可点击链接？

      **Success criteria（成功标准）**  
      用来判断“skill 是否有效”的指标集合。它可以先从粗粒度开始，但最好能被观察与复核。

  - type: md
    title: 从 Use Case 开始：用一个最小模板把事情写具体
    body: |
      材料建议：在写任何代码或说明之前，先写 2-3 个具体 use case。
      一个可直接复用的最小模板是：

      ```text
      Use Case: [用户想完成什么结果]
      Trigger:  用户会怎么说（关键短语/同义表达/相关文件类型）
      Steps:    这个结果通常需要哪些步骤（多步编排）
      Tools:    需要哪些工具（Claude 内建 / 脚本 / MCP）
      Output:   最终交付物长什么样（结构/格式/链接/文件）
      ```

      材料给了一个“好用例”的例子（Sprint Planning），它之所以好，是因为：
      - trigger 可以被写成一组可测试的短语；  
      - steps 是一个有依赖的多步流程；  
      - output 是可检查的 end-state（任务已创建、标签/估算齐全）。

      一个很实用的自检是：  
      **如果把 use case 发给一个完全不了解背景的人，他能不能按 steps 复述出“要做哪些事”？**

  - type: md
    title: 三类常见 Skill：选一个“主叙事”，别把所有东西塞进一个桶
    body: |
      材料把常见 use case 分成三类。它们不是互斥分类，而更像三种“写作重点”：

      **类别 1：文档与资产生成（Document & Asset Creation）**  
      核心目标是稳定产出“高质量且结构一致”的内容：文档、演示、设计稿说明、代码骨架等。  
      它常用的杠杆不是外部工具，而是：内置风格指南、模板结构、交付前质量清单。

      **类别 2：工作流自动化（Workflow Automation）**  
      核心目标是把“多步流程”固化下来，并且在关键步骤设置验证门（validation gates）。  
      常见手段是：脚本化校验 + 迭代精炼回路 + 失败时的补救步骤。

      **类别 3：MCP 增强（MCP Enhancement）**  
      核心目标是把“能调工具”升级为“能把事做成”：多次 MCP 调用的顺序编排、参数组装、错误处理、跨系统数据传递。

      这三类里，你可以先选一个“主叙事”（主目标 + 主风险）。  
      如果一开始就把三类全部揉进一个 skill，常见后果是：description 很难写清楚触发边界，正文也很难收敛成可执行流程。

  - type: md
    title: 定义成功标准：把“好用”变成可观察信号
    body: |
      材料强调：成功标准更像“粗基准”，不是精确 KPI。  
      早期评估会带有一些主观性（材料原话是“vibes-based”），但仍然值得把它写下来，因为它会直接影响测试方式与迭代方向。

      材料给出了一组非常“工程化”的指标示例，你可以直接拿来当模板：

      **定量（Quantitative）**  
      - **触发覆盖率**：在相关请求里，skill 能在多数情况下自动触发（材料给的经验数值是 90%）。  
        测法很朴素：写 10–20 条“应该触发”的测试语句，看自动加载比例。  
      - **工作流成本**：同一任务在“有 skill vs 无 skill”下的 tool calls 与 token 消耗对比。  
        这里的工具调用次数（tool calls）可以理解为：模型请求执行外部动作的次数（每次调用都会带来延迟与失败概率）。  
      - **失败率**：每次工作流里的失败 API 调用次数（材料给的理想目标是 0），并记录重试与错误码。

      **定性（Qualitative）**  
      - 用户是否还需要频繁“提示下一步”（流程是否真正被 skill 内化）  
      - 同一请求跑 3–5 次，输出结构是否稳定、是否需要大量人工纠正  
      - 新用户是否能在“第一次尝试”就跑通（可理解性与可迁移性）

      这些指标的价值在于：当你发现问题时，能更快定位“该改触发还是该改正文”，而不是靠感觉乱试。

  - type: md
    title: 小练习：写一张 Skill 设计卡片（Design Card）
    body: |
      选择一个你真的会用的方向（最好和你的研究/项目绑定），填完下面这张卡片：

      ```text
      Skill name（kebab-case）:
      一句话价值主张（outcome）:

      Use case #1:
      - Trigger phrases (3-5):
      - Steps (3-6):
      - Output:

      Use case #2:
      - Trigger phrases (3-5):
      - Steps (3-6):
      - Output:

      Success criteria:
      - Triggering:
      - Functional:
      - Performance:
      ```

      下一课会把它落成 frontmatter + SKILL.md 的正文结构，并用测试集把“成功标准”变成可复核的反馈信号。

  - type: md
    title: 原文阅读
    body: |
      - 日期：2026-01-26（PDF 元数据 CreationDate；在线页面可能有更新）
      - 来源：Anthropic / Claude（Agent Skills 指南）
      - 建议：带着你自己的 Design Card 回看原文的三类用例：每一类到底在“稳定什么”（结构/步骤/工具调用），以及成功标准如何变成测试用例。

  - type: url
    title: "参考：How to create Skills for Claude（步骤、限制与例子）"
    url: https://www.claude.com/blog/how-to-create-skills-key-steps-limitations-and-examples
    mode: open

  - type: md
    title: 回到开头的问题：一些提示（Hints）
    body: |
      如果你担心“use case 写得太大/太虚”，可以用两条准则收敛范围：

      1) **先把一个典型任务写到能跑通**：不要同时覆盖 10 种变体；先确保最常见场景能稳定完成。  
      2) **先把成功标准写成可观察信号**：哪怕只是一张 10 条语句的触发测试集，也比“感觉更好用了”更可迭代。

      当你能回答“什么时候用”“做完算成功”，skill 的写作与测试就会变得更像工程，而不是更像玄学。
