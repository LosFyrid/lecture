id: agent-skills
title: "Skill Engineering：把工作流知识封装成可触发的技能包（SKILL.md）"
description: |
  当你用 API/代码构建 agent 时，很多工作会反复出现：同样的步骤、同样的质量标准、同样的“先检查再执行”。
  如果这些经验只靠一次次 prompt 口头重复，系统很容易出现三类问题：

  1) **触发不稳定**：该用时没用到，不该用时又跳出来干扰；  
  2) **执行不一致**：同一工作流在不同对话里漂移，结果难复现；  
  3) **上下文成本失控**：为了“讲清楚”，把所有细节塞进对话，反而让模型注意力被噪声稀释。

  本 track 以 Anthropic / Claude 的 Agent Skills（`SKILL.md` + YAML frontmatter）作为一个具体实现实例，
  但课程的主线是可迁移的工程原则：如何把“工作流知识”写成可组合、可测试、可分发的能力包。

  你会沿着一条更像教材的路径学习：
  - 先对齐结构与三条设计原则（渐进式加载 / 可组合 / 可移植）
  - 再从 use case 出发做规划：触发条件、步骤编排、成功标准
  - 然后落到写作：frontmatter 决定“何时加载”，SKILL.md 决定“如何执行得稳”
  - 最后通过测试、分发、模式库与排障把它变成“稳定可用”的工程资产
modules:
  - id: intro
    title: "第 0 章：导论——为什么要把经验写成 Skill"
    lessons:
      - agent-skills-intro

  - id: fundamentals
    title: "第 1 章：结构与原则——渐进式加载 / 可组合 / 可移植"
    lessons:
      - agent-skills-101-fundamentals

  - id: planning
    title: "第 2 章：规划与设计——从 Use Case 到成功标准"
    lessons:
      - agent-skills-201-planning-and-design

  - id: authoring
    title: "第 3 章：触发与执行——Frontmatter 与 SKILL.md 的写作法"
    lessons:
      - agent-skills-301-frontmatter-and-instructions

  - id: testing
    title: "第 4 章：测试与迭代——让 Skill 变得稳定可用"
    lessons:
      - agent-skills-401-testing-and-iteration

  - id: distribution
    title: "第 5 章：分发与协作——GitHub / 组织部署 / API"
    lessons:
      - agent-skills-501-distribution-and-api

  - id: patterns
    title: "第 6 章：模式库——把“说明”写成可运行的工作流"
    lessons:
      - agent-skills-601-patterns

  - id: troubleshooting
    title: "第 7 章：排障与清单——从不触发到不按指令"
    lessons:
      - agent-skills-602-troubleshooting-and-checklist

  - id: references
    title: "附录：资源与参考——示例仓库、文档索引与模板"
    lessons:
      - agent-skills-references
